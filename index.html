<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>냐옹이 배구 온라인</title>
<script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
<style>
* { box-sizing: border-box; user-select: none; -webkit-user-select: none; }
body { background: #0f172a; color: #fff; text-align: center; font-family: sans-serif; margin: 0; padding: 6px 8px; display: flex; flex-direction: column; align-items: center; justify-content: space-between; height: 100dvh; overflow: hidden; touch-action: none; }

/* 상단 헤더 바 */
.top-bar { width: 100%; max-width: 800px; display: flex; justify-content: space-between; align-items: center; padding: 2px 4px; gap: 6px; }
h1 { font-size: 0.96rem; margin: 0; white-space: nowrap; }
.top-right { display: flex; align-items: center; gap: 5px; }
.spec-badge { background: rgba(168, 85, 247, 0.25); border: 1.5px solid #c084fc; color: #e9d5ff; border-radius: 8px; padding: 4px 7px; font-size: 0.7rem; font-weight: bold; display: none; }
.sound-btn, .lang-btn { background: #1e293b; color: #7dd3fc; border: 1.5px solid #38bdf8; border-radius: 8px; padding: 4px 7px; font-size: 0.72rem; font-weight: bold; cursor: pointer; white-space: nowrap; }
.sound-btn.muted { color: #94a3b8; border-color: #64748b; }
.home-btn { background: #334155; color: #fff; border: 1.5px solid #64748b; border-radius: 8px; padding: 4px 8px; font-size: 0.74rem; font-weight: bold; cursor: pointer; white-space: nowrap; }
.home-btn:active { background: #475569; }

/* 게임 캔버스 래퍼 */
.game-wrapper { position: relative; width: 100%; max-width: 800px; max-height: 59dvh; aspect-ratio: 800 / 450; }
canvas { border: 3px solid #fff; border-radius: 10px; width: 100%; height: 100%; display: block; background: #0284c7; transform: translateZ(0); }

/* 메인 대기화면(로비) 오버레이 */
.lobby-overlay {
  position: absolute;
  inset: 0;
  background: rgba(15, 23, 42, 0.92);
  backdrop-filter: blur(4px);
  border-radius: 10px;
  border: 3px solid #38bdf8;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 6px 10px;
  z-index: 10;
}
.lobby-header { display: flex; align-items: center; justify-content: space-between; width: 100%; max-width: 420px; margin-bottom: 4px; gap: 6px; }
.lobby-title { font-size: 0.94rem; font-weight: bold; color: #fde047; white-space: nowrap; }
.rank-pill {
  background: rgba(30, 41, 59, 0.95);
  border: 1.5px solid #facc15;
  border-radius: 20px;
  padding: 2px 8px;
  font-size: 0.68rem;
  font-weight: bold;
  color: #fef08a;
  white-space: nowrap;
  cursor: pointer;
}
.rank-pill:active { transform: scale(0.96); }

.menu-box { width: 100%; max-width: 420px; display: flex; flex-direction: column; gap: 5px; }

/* 닉네임 + 스킨 + TOP10 랭킹 버튼 행 */
.profile-row { display: flex; gap: 5px; width: 100%; }
.nick-row { flex: 1.3; display: flex; align-items: center; gap: 4px; background: #1e293b; border: 1.5px solid #38bdf8; border-radius: 10px; padding: 2px 7px; }
.nick-label { font-size: 0.7rem; color: #7dd3fc; font-weight: bold; white-space: nowrap; }
.nick-input {
  width: 100%;
  background: transparent;
  border: none;
  color: #fff;
  font-size: 0.82rem;
  font-weight: bold;
  padding: 2px;
  outline: none;
  user-select: text;
  -webkit-user-select: text;
}
.btn-skin-open {
  flex: 0.85;
  background: linear-gradient(135deg, #9333ea, #7e22ce);
  border: 1.5px solid #d8b4fe;
  border-radius: 10px;
  color: #fff;
  font-size: 0.72rem;
  font-weight: bold;
  cursor: pointer;
  padding: 4px 6px;
  white-space: nowrap;
}
.btn-rank-open {
  flex: 0.72;
  background: linear-gradient(135deg, #d97706, #b45309);
  border: 1.5px solid #fde047;
  border-radius: 10px;
  color: #fff;
  font-size: 0.72rem;
  font-weight: bold;
  cursor: pointer;
  padding: 4px 6px;
  white-space: nowrap;
}

.menu-btn {
  width: 100%;
  padding: 6px 10px;
  border-radius: 10px;
  border: none;
  font-size: 0.82rem;
  font-weight: bold;
  color: #fff;
  cursor: pointer;
  box-shadow: 0 3px 8px rgba(0,0,0,0.3);
}
.menu-btn:active:not(:disabled) { transform: scale(0.97); }
.menu-btn:disabled { opacity: 0.65; cursor: default; }
.btn-ai { background: linear-gradient(135deg, #0284c7, #0369a1); border: 1.5px solid #7dd3fc; }
.btn-create { background: linear-gradient(135deg, #ea580c, #c2410c); border: 1.5px solid #fdba74; }
.btn-list { background: linear-gradient(135deg, #16a34a, #15803d); border: 1.5px solid #86efac; }

/* 조작법 안내 배지 */
.ctrl-hint {
  font-size: 0.65rem;
  color: #cbd5e1;
  background: rgba(30, 41, 59, 0.85);
  border: 1px solid #475569;
  border-radius: 7px;
  padding: 2px 8px;
  margin-top: 2px;
}

/* 대기화면 하단 배너 광고 슬롯 (320x50 규격) */
.lobby-ad-slot {
  width: 100%;
  max-width: 320px;
  min-height: 34px;
  margin-top: 3px;
  background: rgba(15, 23, 42, 0.85);
  border: 1px dashed rgba(148, 163, 184, 0.55);
  border-radius: 7px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 0.62rem;
  color: #94a3b8;
  padding: 2px 6px;
  overflow: hidden;
}

/* 스킨 & 이펙트 꾸미기 패널 */
.skin-panel {
  display: none;
  flex-direction: column;
  width: 100%;
  max-width: 450px;
  gap: 4px;
}
.skin-scroll {
  width: 100%;
  max-height: 122px;
  overflow-y: auto;
  background: rgba(30, 41, 59, 0.96);
  border: 1.5px solid #a855f7;
  border-radius: 10px;
  padding: 6px;
  display: flex;
  flex-direction: column;
  gap: 6px;
  text-align: left;
}
.skin-cat-title { font-size: 0.68rem; font-weight: bold; color: #d8b4fe; margin-bottom: 2px; }
.skin-grid { display: flex; flex-wrap: wrap; gap: 4px; }
.skin-chip {
  flex: 1 1 30%;
  min-width: 96px;
  background: #0f172a;
  border: 1.5px solid #475569;
  border-radius: 8px;
  padding: 4px 5px;
  color: #e2e8f0;
  font-size: 0.68rem;
  text-align: center;
  cursor: pointer;
}
.skin-chip.equipped { border-color: #facc15; background: rgba(250, 204, 21, 0.16); color: #fef08a; font-weight: bold; }
.skin-chip.ready-ad { border-color: #38bdf8; background: rgba(56, 189, 248, 0.12); color: #bae6fd; }
.skin-chip.rank-locked { border-color: #475569; background: rgba(15, 23, 42, 0.65); color: #94a3b8; }
.skin-sub { display: block; font-size: 0.59rem; opacity: 0.9; margin-top: 2px; line-height: 1.15; }

/* 선택 스킨 상세 설명 카드 */
.skin-detail-box {
  width: 100%;
  background: rgba(15, 23, 42, 0.95);
  border: 1.5px solid #38bdf8;
  border-radius: 9px;
  padding: 5px 8px;
  text-align: left;
  font-size: 0.67rem;
  line-height: 1.28;
}
.skin-detail-top { display: flex; justify-content: space-between; align-items: center; font-weight: bold; color: #fde047; margin-bottom: 2px; gap: 4px; }
.skin-detail-cond { font-size: 0.61rem; color: #7dd3fc; text-align: right; }
.skin-detail-desc { color: #e2e8f0; }

/* TOP 10 랭킹 패널 */
.rank-panel {
  display: none;
  flex-direction: column;
  width: 100%;
  max-width: 420px;
  gap: 5px;
}
.rank-scroll {
  width: 100%;
  max-height: 145px;
  overflow-y: auto;
  background: rgba(30, 41, 59, 0.96);
  border: 1.5px solid #facc15;
  border-radius: 10px;
  padding: 5px 7px;
  display: flex;
  flex-direction: column;
  gap: 4px;
}
.rank-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  background: #0f172a;
  border: 1px solid #334155;
  border-radius: 7px;
  padding: 4px 8px;
  font-size: 0.72rem;
}
.rank-row.me {
  border-color: #facc15;
  background: rgba(250, 204, 21, 0.14);
}
.rank-left { display: flex; align-items: center; gap: 6px; font-weight: bold; }
.rank-num { width: 24px; text-align: center; color: #fde047; }
.rank-right { font-size: 0.67rem; color: #bae6fd; }

/* 방 리스트 패널 */
.list-panel { display: none; flex-direction: column; align-items: center; gap: 5px; width: 100%; max-width: 390px; }
.room-list-box {
  width: 100%;
  max-height: 106px;
  overflow-y: auto;
  background: rgba(30, 41, 59, 0.92);
  border: 1.5px solid #475569;
  border-radius: 10px;
  padding: 5px;
  display: flex;
  flex-direction: column;
  gap: 5px;
}
.room-item {
  display: flex;
  justify-content: space-between;
  align-items: center;
  background: #0f172a;
  border: 1px solid #38bdf8;
  border-radius: 8px;
  padding: 5px 9px;
  font-size: 0.76rem;
}
.room-item-info { text-align: left; }
.room-item-title { font-weight: bold; color: #fde047; }
.room-item-sub { font-size: 0.66rem; color: #94a3b8; }
.room-item-btn {
  background: #16a34a;
  color: #fff;
  border: none;
  border-radius: 6px;
  padding: 5px 9px;
  font-size: 0.72rem;
  font-weight: bold;
  cursor: pointer;
}
.room-item-btn.spec { background: #7e22ce; }

.join-row { display: flex; gap: 5px; width: 100%; }
.code-input {
  flex: 1.2;
  padding: 5px;
  border-radius: 8px;
  border: 1.5px solid #64748b;
  background: #1e293b;
  color: #fff;
  font-size: 0.78rem;
  font-weight: bold;
  text-align: center;
  text-transform: uppercase;
  user-select: text;
  -webkit-user-select: text;
}
.btn-small { flex: 0.8; padding: 5px; border-radius: 8px; font-size: 0.74rem; }

/* 방 생성 후 대기 패널 */
.wait-panel { display: none; flex-direction: column; align-items: center; gap: 5px; width: 100%; max-width: 350px; }
.room-badge {
  background: #1e293b;
  border: 2px dashed #fde047;
  border-radius: 10px;
  padding: 5px 12px;
  font-size: 1.05rem;
  font-weight: bold;
  color: #fde047;
  letter-spacing: 1px;
  user-select: all;
  -webkit-user-select: all;
}
.wait-actions { display: flex; gap: 8px; width: 100%; }
.btn-copy { flex: 1.5; background: #16a34a; border: 1.5px solid #86efac; }
.btn-cancel { flex: 1; background: #475569; border: 1.5px solid #94a3b8; }
.lobby-status { font-size: 0.69rem; color: #bae6fd; margin-top: 2px; min-height: 13px; }

/* 5초 광고 해금 모달 */
.reward-modal {
  display: none;
  position: absolute;
  inset: 10px;
  background: rgba(15, 23, 42, 0.98);
  border: 2px solid #facc15;
  border-radius: 12px;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 12px;
  z-index: 20;
  gap: 6px;
}
.reward-modal h3 { margin: 0; color: #fde047; font-size: 0.96rem; }
.reward-modal p { margin: 0; font-size: 0.74rem; color: #e2e8f0; line-height: 1.35; max-width: 320px; }
.ad-5s-box {
  width: 100%;
  max-width: 300px;
  background: #1e293b;
  border: 1.5px solid #38bdf8;
  border-radius: 8px;
  padding: 7px;
  font-size: 0.76rem;
  color: #bae6fd;
  font-weight: bold;
}
.reward-btns { display: flex; gap: 8px; width: 100%; max-width: 280px; margin-top: 2px; }

/* 모바일 터치 패드: 왼쪽에 이동(좌/우) + 점프 통합 배치 */
.controls { width: 100%; max-width: 800px; flex: 1; max-height: 158px; display: flex; justify-content: space-between; align-items: stretch; gap: 12px; padding: 6px 4px 8px; }
.dpad-group {
  flex: 1.65;
  display: grid;
  grid-template-columns: 1fr 1fr 1.05fr;
  gap: 7px;
}
.action-group {
  flex: 0.85;
  display: flex;
}
.touch-btn {
  flex: 1;
  height: 100%;
  min-height: 76px;
  border-radius: 16px;
  border: 2.5px solid rgba(255,255,255,0.45);
  background: rgba(255,255,255,0.14);
  color: #fff;
  font-size: 1.35rem;
  font-weight: bold;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
}
.touch-btn:active, .touch-btn.active { background: rgba(56,189,248,0.65); border-color: #7dd3fc; transform: scale(0.96); }
.jump-btn { background: rgba(56,189,248,0.28); border-color: rgba(125,211,252,0.75); font-size: 1.05rem; }
.spike-btn { background: rgba(249,115,22,0.48); border-color: #fb923c; font-size: 1.02rem; }
.spike-btn.active { background: rgba(249,115,22,0.85); border-color: #fed7aa; }
.sub-label { font-size: 0.66rem; font-weight: normal; opacity: 0.88; margin-top: 2px; }

/* 관전자 전용 안내 바 */
.spectator-banner {
  display: none;
  width: 100%;
  max-width: 800px;
  flex: 1;
  max-height: 125px;
  background: rgba(88, 28, 135, 0.35);
  border: 2px solid #a855f7;
  border-radius: 16px;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 10px;
  margin: 6px 0;
}
.spectator-banner strong { font-size: 1rem; color: #f3e8ff; margin-bottom: 4px; }
.spectator-banner span { font-size: 0.8rem; color: #d8b4fe; }
</style>
</head>
<body>

<div class="top-bar">
  <h1 id="appTitle">🐾 냐옹이 배구</h1>
  <div class="top-right">
    <div class="spec-badge" id="specBadge">👀 관전 0명</div>
    <button class="lang-btn" id="btnLangToggle">EN</button>
    <button class="sound-btn" id="btnSoundToggle">🔊 BGM</button>
    <button class="home-btn" id="btnHome" style="display:none;">🏠 대기화면</button>
  </div>
</div>

<div class="game-wrapper">
  <canvas id="cvs" width="800" height="450"></canvas>

  <!-- 대기화면(로비) -->
  <div class="lobby-overlay" id="lobbyOverlay">
    <div class="lobby-header">
      <div class="lobby-title" id="seasonTitleLabel">🏐 냐옹이 배구 · 시즌</div>
      <div class="rank-pill" id="rankSummaryBadge">🥉 브론즈 · 0승 0패 (0%)</div>
    </div>

    <!-- 1. 기본 메인 메뉴 -->
    <div class="menu-box" id="mainMenuBox">
      <div class="profile-row">
        <div class="nick-row">
          <span class="nick-label" id="nickLabel">닉네임</span>
          <input type="text" class="nick-input" id="nickInput" maxlength="8" placeholder="닉네임 입력">
        </div>
        <button class="btn-skin-open" id="btnOpenSkins">🎨 스킨</button>
        <button class="btn-rank-open" id="btnOpenRank">🏆 랭킹</button>
      </div>

      <button class="menu-btn btn-ai" id="btnStartAI">🐱 1인 플레이 (AI 대전)</button>
      <button class="menu-btn btn-create" id="btnCreateRoom">🏠 방 만들기 (공개방 생성)</button>
      <button class="menu-btn btn-list" id="btnOpenRoomList">🔍 참여하기 (방 리스트 보기)</button>
    </div>

    <!-- 2. 스킨 & 이펙트 선택 패널 -->
    <div class="skin-panel" id="skinPanel">
      <div class="skin-scroll" id="skinScrollContainer"></div>
      <div class="skin-detail-box" id="skinDetailBox">
        <div class="skin-detail-top">
          <span id="detailName">스킨을 선택하세요</span>
          <span class="skin-detail-cond" id="detailCond"></span>
        </div>
        <div class="skin-detail-desc" id="detailDesc"></div>
      </div>
      <button class="menu-btn btn-ai btn-small" id="btnCloseSkins">선택 완료 (돌아가기)</button>
    </div>

    <!-- 3. 글로벌 통합 TOP 10 랭킹 보드 패널 -->
    <div class="rank-panel" id="rankPanel">
      <div class="rank-scroll" id="rankListContainer"></div>
      <div class="join-row">
        <button class="menu-btn btn-list btn-small" id="btnRefreshRank">🔄 실시간 갱신</button>
        <button class="menu-btn btn-cancel btn-small" id="btnCloseRank">뒤로</button>
      </div>
    </div>

    <!-- 4. 공개 방 리스트 및 코드 직접 입력 패널 -->
    <div class="list-panel" id="listPanel">
      <div class="room-list-box" id="roomListBox"></div>
      <div class="join-row">
        <input type="text" class="code-input" id="roomCodeInput" placeholder="코드 직접입력">
        <button class="menu-btn btn-list btn-small" id="btnJoinDirect">입장</button>
        <button class="menu-btn btn-cancel btn-small" id="btnRefreshList">새로고침</button>
        <button class="menu-btn btn-cancel btn-small" id="btnBackMain">뒤로</button>
      </div>
    </div>

    <!-- 5. 방 생성 후 대기 화면 -->
    <div class="wait-panel" id="waitPanel">
      <div style="font-size:0.76rem; color:#e2e8f0;" id="waitGuideText">공개 로비에 등록되었습니다! 친구가 방 리스트에서 바로 찾을 수 있어요.</div>
      <div class="room-badge" id="roomCodeDisplay">CAT-ROOM-1</div>
      <div class="wait-actions">
        <button class="menu-btn btn-copy" id="btnCopyCode">📋 방코드 복사</button>
        <button class="menu-btn btn-cancel" id="btnCancelRoom">취소</button>
      </div>
    </div>

    <!-- 5초 광고 해금 모달 -->
    <div class="reward-modal" id="rewardModal">
      <h3 id="rewardModalTitle">🎁 시즌 스킨 5초 광고 해금</h3>
      <p id="rewardModalDesc"></p>
      <div class="ad-5s-box" id="adCountdownBox"></div>
      <div class="reward-btns">
        <button class="menu-btn btn-create btn-small" id="btnConfirmUnlock">🎬 5초 광고 시작</button>
        <button class="menu-btn btn-cancel btn-small" id="btnCancelUnlock">닫기</button>
      </div>
    </div>

    <div class="ctrl-hint" id="ctrlHintText">⌨️ PC: ←→(A/D) 이동 · ↑(W) 점프 · Space 스파이크(강타)</div>
    <div class="lobby-status" id="lobbyStatus"></div>

    <!-- 대기화면 하단 배너 광고 슬롯 -->
    <div class="lobby-ad-slot" id="lobbyAdSlot">📢 Lobby Banner Ad Slot (320×50)</div>
  </div>
</div>

<!-- 플레이어용 터치 패드: 왼쪽(이동+점프 통합) / 오른쪽(스파이크) -->
<div class="controls" id="controlsArea">
  <div class="dpad-group" id="dpadArea">
    <div class="touch-btn" id="btnLeft">◀<span class="sub-label" id="subLeft">왼쪽</span></div>
    <div class="touch-btn" id="btnRight">▶<span class="sub-label" id="subRight">오른쪽</span></div>
    <div class="touch-btn jump-btn" id="btnJump">▲<span class="sub-label" id="jumpText">점프</span></div>
  </div>
  <div class="action-group">
    <div class="touch-btn spike-btn" id="btnSpike">💥<span id="spikeText">스파이크</span><span class="sub-label" id="subSpike">Space / 터치</span></div>
  </div>
</div>

<!-- 3번째 입장자부터 표시되는 관전 안내 -->
<div class="spectator-banner" id="spectatorBanner">
  <strong id="specBannerTitle">👀 관전 모드로 입장했습니다</strong>
  <span id="spectatorInfo">현재 1P와 2P가 대전 중입니다. 실시간 경기를 관람하세요!</span>
</div>

<script>
window.onload = function() {
  var FIREBASE_DB_URL = "https://vollybal-rank-default-rtdb.firebaseio.com";

  var AD_CONFIG = {
    lobbyBannerHtml: ""
  };

  var cvs = document.getElementById("cvs");
  var ctx = cvs.getContext("2d", { alpha: false });
  var TAU = 6.283185;

  function detectInitialLang() {
    try {
      var saved = localStorage.getItem('cat_volley_lang');
      if (saved === 'ko' || saved === 'en') return saved;
    } catch (e) {}
    var nav = (navigator.language || navigator.userLanguage || 'ko').toLowerCase();
    return nav.indexOf('ko') === 0 ? 'ko' : 'en';
  }

    document.getElementById("appTitle").innerText = d.appTitle;

  var SoundEngine = (function() {

      659.25, 0, 783.99, 880.00, 783.99, 659.25, 587.33, 0,

    function ensureContext() {
      if (!AudioCtx) return null;

    function startBGM() {
      if (bgmTimer || isMuted) return;

        if (isMuted || !actx || actx.state !== 'running') return;
        var now = actx.currentTime, mFreq = MELODY[bgmStep % MELODY.length], bFreq = BASS[bgmStep % BASS.length];
        if (mFreq > 0) {
          var osc = actx.createOscillator(), gain = actx.createGain();
          osc.type = 'sine'; osc.frequency.setValueAtTime(mFreq, now);
          gain.gain.setValueAtTime(0.001, now); gain.gain.linearRampToValueAtTime(0.016, now + 0.03); gain.gain.exponentialRampToValueAtTime(0.0005, now + 0.24);
          osc.connect(gain); gain.connect(actx.destination); osc.start(now); osc.stop(now + 0.25);
        }
        if (bFreq > 0) {
          var bOsc = actx.createOscillator(), bGain = actx.createGain();
          bOsc.type = 'triangle'; bOsc.frequency.setValueAtTime(bFreq, now);
          bGain.gain.setValueAtTime(0.001, now); bGain.gain.linearRampToValueAtTime(0.014, now + 0.02); bGain.gain.exponentialRampToValueAtTime(0.0005, now + 0.26);
          bOsc.connect(bGain); bGain.connect(actx.destination); bOsc.start(now); bOsc.stop(now + 0.27);

    }

    function playNoise(duration, filterFreq, filterType, vol) {

      for (var i = 0; i < bufSize; i++) data[i] = Math.random() * 2 - 1;
      var src = c.createBufferSource(); src.buffer = buf;
      var filter = c.createBiquadFilter(); filter.type = filterType || 'bandpass'; filter.frequency.setValueAtTime(filterFreq, c.currentTime);
      var gain = c.createGain(); gain.gain.setValueAtTime(vol, c.currentTime); gain.gain.exponentialRampToValueAtTime(0.001, c.currentTime + duration);
      src.connect(filter); filter.connect(gain); gain.connect(c.destination); src.start();

    function synthSyllable(c, startTime, opt) {

      osc1.frequency.setValueAtTime(opt.fStart, startTime);
      osc1.frequency.exponentialRampToValueAtTime(opt.fPeak, startTime + dur * (opt.peakRatio || 0.35));
      osc1.frequency.exponentialRampToValueAtTime(opt.fEnd, startTime + dur);

      osc2.frequency.setValueAtTime(opt.fStart * (opt.harmonic || 1), startTime);
      osc2.frequency.exponentialRampToValueAtTime(opt.fPeak * (opt.harmonic || 1), startTime + dur * (opt.peakRatio || 0.35));
      osc2.frequency.exponentialRampToValueAtTime(opt.fEnd * (opt.harmonic || 1), startTime + dur);

      if (opt.vibFreq && opt.vibDepth) {
        var lfo = c.createOscillator(), lfoGain = c.createGain();
        lfo.frequency.setValueAtTime(opt.vibFreq, startTime); lfoGain.gain.setValueAtTime(opt.vibDepth, startTime);
        lfo.connect(lfoGain); lfoGain.connect(osc1.frequency); lfoGain.connect(osc2.frequency);

        } else if (skinId === 'calico') {

    if (wins >= 10 || (total >= 8 && rate >= 70)) { lv = 4; tier = tiers[4].badge; }
    else if (wins >= 6 || (total >= 5 && rate >= 60)) { lv = 3; tier = tiers[3].badge; }
    else if (wins >= 3 || (total >= 2 && rate >= 50)) { lv = 2; tier = tiers[2].badge; }
    else if (wins >= 1) { lv = 1; tier = tiers[1].badge; }

    var score = mul(wins, 30) + rate;
    var summary = currentLang === 'ko'
      ? tier + " · " + wins + "승 " + losses + "패 (" + rate + "%)"
      : tier + " · " + wins + "W " + losses + "L (" + rate + "%)";

    return { lv: lv, tier: tier, rate: rate, total: total, score: score, summary: summary };

  var LOBBY_SLOTS = [];

  var worldTime = 0.08;
  var clouds = [
    { x: 120, y: 82, s: 1.0, spd: 0.32 },
    { x: 430, y: 65, s: 0.78, spd: 0.22 },
    { x: 680, y: 105, s: 1.12, spd: 0.40 }
  ];
  var stars = [];
  for (var si = 0; si < 38; si++) {
    stars.push({ x: Math.random() * 800, y: 12 + Math.random() * 230, r: 0.8 + Math.random() * 1.5, phase: Math.random() * TAU });
  }
  var shootingStar = { active: false, x: 0, y: 0, vx: 0, vy: 0, life: 0 };
  var birds = [
    { x: -60, y: 95, spd: 1.7, phase: 0 },
    { x: -95, y: 80, spd: 1.7, phase: 1.2 },
    { x: -125, y: 112, spd: 1.7, phase: 2.4 }
  ];
  var heroCat = { active: false, x: -120, y: 88, spd: 4.4, cooldown: 1200 };

  function lerp(a, b, t) { return a + mul(b - a, t); }
  function lerpColor(c1, c2, t) {
    var r = Math.round(lerp(c1[0], c2[0], t)), g = Math.round(lerp(c1[1], c2[1], t)), b = Math.round(lerp(c1[2], c2[2], t));
    return "rgb(" + r + "," + g + "," + b + ")";
  }

  function updateEnvironment(dt) {
    worldTime += mul(0.00022, dt);
    if (worldTime >= 1) worldTime -= 1;

    for (var i = 0; i < clouds.length; i++) {
      clouds[i].x += mul(clouds[i].spd, dt);
      if (clouds[i].x > 890) clouds[i].x = -90;
    }

    if (worldTime >= 0.50 && worldTime <= 0.82) {
      if (!shootingStar.active && Math.random() < mul(0.014, dt)) {
        shootingStar.active = true; shootingStar.x = 180 + Math.random() * 580; shootingStar.y = 15 + Math.random() * 75;
        shootingStar.vx = -9.5; shootingStar.vy = 4.2; shootingStar.life = 34;
      }
    }
    if (shootingStar.active) {
      shootingStar.x += mul(shootingStar.vx, dt); shootingStar.y += mul(shootingStar.vy, dt); shootingStar.life -= dt;
      if (shootingStar.life <= 0) shootingStar.active = false;
    }

    var isMorning = (worldTime >= 0.82 || worldTime <= 0.08);
    for (var b = 0; b < birds.length; b++) {
      if (isMorning || birds[b].x > -40) {
        birds[b].x += mul(birds[b].spd, dt); birds[b].phase += mul(0.16, dt);
        if (birds[b].x > 860) { birds[b].x = isMorning ? -60 - mul(b, 32) : -120; birds[b].y = 70 + Math.random() * 65; }
      }
    }

    if (heroCat.cooldown > 0) heroCat.cooldown -= dt;
    if (worldTime >= 0.12 && worldTime <= 0.32 && heroCat.cooldown <= 0) {
      if (!heroCat.active && Math.random() < mul(0.0012, dt)) {
        heroCat.active = true; heroCat.x = -110; heroCat.y = 65 + Math.random() * 55; heroCat.cooldown = 2600;
      }
    }
    if (heroCat.active) { heroCat.x += mul(heroCat.spd, dt); if (heroCat.x > 920) heroCat.active = false; }
  }

  var dpadArea = document.getElementById("dpadArea"), btnLeft = document.getElementById("btnLeft"), btnRight = document.getElementById("btnRight"), btnJump = document.getElementById("btnJump");

  function isPointInEl(x, y, el, pad) {

  function handleLeftPad(e) {

  // --- 9. 게임 물리 및 스파이크 이펙트 업데이트 ---
  function update(dt) {
    updateEnvironment(dt);
    if (gameState !== 'playing') { p1.skin = userState.equippedCat; ball.skin = userState.equippedBall; return; }

    if (netMode === 'guest' || netMode === 'spectator') {
      if (netMode === 'guest' && conn && conn.open) {
        if ((keys["ArrowUp"] || keys["KeyW"]) && p2.y >= 338) SoundEngine.playCatMeow(p2.skin, true);
        conn.send({ type: 'keys', keys: { L: !!(keys["ArrowLeft"] || keys["KeyA"]), R: !!(keys["ArrowRight"] || keys["KeyD"]), U: !!(keys["ArrowUp"] || keys["KeyW"]), S: !!keys["Space"] } });
      }
      updateParticles(dt); return;
    }

    if (gameOver) return;
    if (p1.hitTimer > 0) p1.hitTimer -= dt; if (p2.hitTimer > 0) p2.hitTimer -= dt;

    var moveDir = 0;
    if (keys["ArrowLeft"] || keys["KeyA"]) moveDir -= 1; if (keys["ArrowRight"] || keys["KeyD"]) moveDir += 1;

    if (moveDir !== 0) { p1.vx += mul(moveDir, 1.4) * dt; if (p1.vx > p1.maxSpeed) p1.vx = p1.maxSpeed; if (p1.vx < -p1.maxSpeed) p1.vx = -p1.maxSpeed; }
    else { p1.vx = mul(p1.vx, Math.pow(0.76, dt)); if (Math.abs(p1.vx) < 0.15) p1.vx = 0; }

    if ((keys["ArrowUp"] || keys["KeyW"]) && p1.y >= 340) { p1.vy = -10.8; p1.squash = 1.22; SoundEngine.playCatMeow(p1.skin, true); }

    var wasAir1 = p1.y < 340;
    p1.vy += mul(0.36, dt); p1.x += mul(p1.vx, dt); p1.y += mul(p1.vy, dt);
    if (p1.y >= 340) { p1.y = 340; if (wasAir1) p1.squash = 0.82; p1.vy = 0; }
    p1.squash += mul(1 - p1.squash, 0.2) * dt;
    if (p1.x < p1.r + 6) { p1.x = p1.r + 6; p1.vx = 0; } if (p1.x > 390 - p1.r) { p1.x = 390 - p1.r; p1.vx = 0; }

    if (netMode === 'host') {
      var p2Dir = 0;
      if (remoteKeys.L) p2Dir -= 1; if (remoteKeys.R) p2Dir += 1;
      if (p2Dir !== 0) { p2.vx += mul(p2Dir, 1.4) * dt; if (p2.vx > p2.maxSpeed) p2.vx = p2.maxSpeed; if (p2.vx < -p2.maxSpeed) p2.vx = -p2.maxSpeed; }
      else { p2.vx = mul(p2.vx, Math.pow(0.76, dt)); if (Math.abs(p2.vx) < 0.15) p2.vx = 0; }
      if (remoteKeys.U && p2.y >= 340) { p2.vy = -10.8; p2.squash = 1.22; SoundEngine.playCatMeow(p2.skin, true); }
    } else {
      var aiMax = 4.2, targetX = ball.x > 400 ? ball.x + 10 : 650, diffX = targetX - p2.x;
      if (Math.abs(diffX) > 6) { var aiDir = diffX > 0 ? 1 : -1; p2.vx += mul(aiDir, 1.0) * dt; if (p2.vx > aiMax) p2.vx = aiMax; if (p2.vx < -aiMax) p2.vx = -aiMax; }
      else { p2.vx = mul(p2.vx, Math.pow(0.78, dt)); }
      if (ball.x > 400 && ball.y < 250 && ball.vy > 0 && p2.y >= 340 && Math.abs(p2.x - ball.x) < 70) { p2.vy = -10.5; p2.squash = 1.22; SoundEngine.playCatMeow(p2.skin, true); }
    }

    var wasAir2 = p2.y < 340;
    p2.vy += mul(0.36, dt); p2.x += mul(p2.vx, dt); p2.y += mul(p2.vy, dt);
    if (p2.y >= 340) { p2.y = 340; if (wasAir2) p2.squash = 0.82; p2.vy = 0; }
    p2.squash += mul(1 - p2.squash, 0.2) * dt;
    if (p2.x < 410 + p2.r) { p2.x = 410 + p2.r; p2.vx = 0; } if (p2.x > 800 - p2.r - 6) { p2.x = 800 - p2.r - 6; p2.vx = 0; }

    ball.vy += mul(0.115, dt); ball.x += mul(ball.vx, dt); ball.y += mul(ball.vy, dt);
    updateParticles(dt);

    if (ball.x < ball.r) { ball.x = ball.r; ball.vx = -ball.vx; SoundEngine.playBounce(false); }
    if (ball.x > 800 - ball.r) { ball.x = 800 - ball.r; ball.vx = -ball.vx; SoundEngine.playBounce(false); }
    if (ball.y < ball.r) { ball.y = ball.r; ball.vy = -ball.vy; SoundEngine.playBounce(false); }

    if (ball.x + ball.r > 395 && ball.x - ball.r < 405 && ball.y + ball.r > 260) {
      if (ball.y < 275) { ball.y = 260 - ball.r; ball.vy = mul(ball.vy, -0.92); }
      else { ball.vx = mul(ball.vx, -0.85); ball.x = ball.x < 400 ? 395 - ball.r : 405 + ball.r; }
      SoundEngine.playBounce(true);
    }

    hitBall(p1, !!keys["Space"]); hitBall(p2, netMode === 'host' ? !!remoteKeys.S : false);

    if (ball.y > 430) {
      if (ball.x < 400) {
        score2++; SoundEngine.playScore(false);
        if (score2 >= 15) { gameOver = true; winnerText = T().winMsg(p2.name); if (!matchRecorded) { matchRecorded = true; recordMatchResult(false); } }
        else { ball.x = 580; ball.y = 140; ball.vx = -1.3; ball.vy = -1.8; ball.spikeType = 'none'; particles = []; }
      } else {
        score1++; SoundEngine.playScore(true);
        if (score1 >= 15) { gameOver = true; winnerText = T().winMsg(p1.name); if (!matchRecorded) { matchRecorded = true; recordMatchResult(true); } }
        else { ball.x = 220; ball.y = 140; ball.vx = 1.3; ball.vy = -1.8; ball.spikeType = 'none'; particles = []; }
      }
    }

    if (netMode === 'host') {
      broadcastToAll({
        type: 'state',
        p1: { x: p1.x, y: p1.y, vx: p1.vx, ht: p1.hitTimer, sq: p1.squash, nm: p1.name, tr: p1.tier, sk: p1.skin },
        p2: { x: p2.x, y: p2.y, vx: p2.vx, ht: p2.hitTimer, sq: p2.squash, nm: p2.name, tr: p2.tier, sk: p2.skin },
        b: { x: ball.x, y: ball.y, st: ball.spikeType, sk: ball.skin },
        s1: score1, s2: score2, go: gameOver, wt: winnerText,
        sc: spectatorConns.length, wtm: worldTime
      });
    }
  }

  function updateParticles(dt) {
    if (ball.spikeType !== 'none' && particles.length < 40) {
      var pColor = '#ffffff', pKind = 'circle', pSize = mul(Math.random(), 6) + 4;
      if (ball.spikeType === 'wind') { pColor = Math.random() > 0.4 ? 'rgba(255,255,255,0.85)' : 'rgba(186,230,253,0.85)'; pKind = 'wind'; pSize = mul(Math.random(), 5) + 5; }
      else if (ball.spikeType === 'meteor') { pColor = Math.random() > 0.45 ? '#f97316' : '#facc15'; pKind = 'circle'; pSize = mul(Math.random(), 8) + 4; }
      else if (ball.spikeType === 'lightning') { pColor = Math.random() > 0.4 ? '#38bdf8' : '#fef08a'; pKind = 'bolt'; }
      else if (ball.spikeType === 'ice') { pColor = Math.random() > 0.4 ? '#bae6fd' : '#ffffff'; pKind = 'crystal'; }
      else if (ball.spikeType === 'sakura') { pColor = Math.random() > 0.4 ? '#f9a8d4' : '#fbcfe8'; pKind = 'petal'; }
      else if (ball.spikeType === 'blackhole') { pColor = Math.random() > 0.4 ? '#a855f7' : '#312e81'; pKind = 'void'; }

      particles.push({
        x: ball.x + mul(Math.random() - 0.5, 20), y: ball.y + mul(Math.random() - 0.5, 20),
        vx: mul(Math.random() - 0.5, 2.8) - mul(ball.vx, 0.22), vy: mul(Math.random() - 0.5, 2.8) - mul(ball.vy, 0.22),
        size: pSize, color: pColor, kind: pKind, life: 20

    }
    for (var i = particles.length - 1; i >= 0; i--) {
      var pt = particles[i]; pt.x += mul(pt.vx, dt); pt.y += mul(pt.vy, dt); pt.life -= dt;
      if (pt.life <= 0) particles.splice(i, 1);

  function hitBall(p, isSpike) {
    var dx = ball.x - p.x, dy = ball.y - p.y, dist = Math.hypot(dx, dy);
    if (dist < ball.r + p.r + 6 && dist > 0) {
      var overlap = (ball.r + p.r + 6) - dist;
      ball.x += mul(dx / dist, overlap); ball.y += mul(dy / dist, overlap);
      p.hitTimer = 18; p.squash = 1.15;
      var angle = Math.atan2(dy, dx);
      SoundEngine.playCatMeow(p.skin, false);
      if (isSpike) {
        ball.spikeType = p.spikeSkin || 'wind';
        ball.vx = mul(Math.cos(angle), 10.2) + mul(p.vx, 0.28);
        ball.vy = mul(Math.sin(angle), 10.2) - 3.2;
        SoundEngine.playSpikeSound(ball.spikeType);
      } else {
        ball.spikeType = 'none';
        ball.vx = mul(Math.cos(angle), 5.5) + mul(p.vx, 0.22);
        ball.vy = mul(Math.sin(angle), 5.5) - 2.3;
      }
    }
  }

  // =========================================================================
  // 10. 캐릭터 / 공 / 오로라 & 반짝임 이펙트 그리기

  function drawStarSparkle(x, y, outerR, color) {
    ctx.save(); ctx.translate(x, y); ctx.fillStyle = color || '#ffffff';
    var innerR = outerR * 0.28;
    ctx.beginPath();
    for (var i = 0; i < 8; i++) {
      var r = (i % 2 === 0) ? outerR : innerR, a = mul(i, Math.PI / 4), px = Math.cos(a) * r, py = Math.sin(a) * r;
      if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
    }
    ctx.closePath(); ctx.fill(); ctx.restore();
  }

  function drawGoldCatAurora(x, y, time) {
    ctx.save(); ctx.translate(x, y - 4);
    var shift = Math.sin(mul(time, 0.004)), shift2 = Math.cos(mul(time, 0.0032));

    var auraGrad = ctx.createRadialGradient(0, 0, 12, 0, 0, 56 + shift * 5);
    auraGrad.addColorStop(0.0, 'rgba(254, 240, 138, 0.42)');
    auraGrad.addColorStop(0.45, 'rgba(52, 211, 153, 0.28)');
    auraGrad.addColorStop(0.75, 'rgba(192, 132, 252, 0.22)');
    auraGrad.addColorStop(1.0, 'rgba(250, 204, 21, 0)');
    ctx.fillStyle = auraGrad;
    ctx.beginPath(); ctx.ellipse(shift * 5, shift2 * 4, 52, 46, shift * 0.2, 0, TAU); ctx.fill();

    ctx.save(); ctx.rotate(shift * 0.25);
    ctx.strokeStyle = 'rgba(110, 231, 183, 0.55)'; ctx.lineWidth = 4; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(-36, -18 + shift * 6); ctx.bezierCurveTo(-14, -34 - shift2 * 8, 16, -24 + shift * 8, 36, -14 - shift2 * 6); ctx.stroke();
    ctx.restore();

    var sparkles = [
      { ox: -34, oy: -28, ph: 0.0, sz: 7.5, col: '#fef9c3' },
      { ox: 35,  oy: -24, ph: 1.7, sz: 8.0, col: '#a7f3d0' },
      { ox: -28, oy: 24,  ph: 3.1, sz: 6.5, col: '#f5d0fe' },
      { ox: 32,  oy: 20,  ph: 4.5, sz: 7.0, col: '#fde047' }
    ];
    for (var i = 0; i < sparkles.length; i++) {
      var sp = sparkles[i], tw = Math.sin(mul(time, 0.008) + sp.ph);
      if (tw > -0.15) drawStarSparkle(sp.ox, sp.oy, sp.sz * (0.55 + Math.max(0, tw) * 0.65), sp.col);
    }
    ctx.restore();
  }

  function traceCatHeadPath(isSimple) {
    ctx.beginPath();
    if (isSimple) { ctx.arc(0, -2, 26, 0, TAU); }
    else {
      ctx.moveTo(0, -25); ctx.bezierCurveTo(18, -25, 29, -15, 29, 2); ctx.bezierCurveTo(29, 16, 17, 22, 0, 22);
      ctx.bezierCurveTo(-17, 22, -29, 16, -29, 2); ctx.bezierCurveTo(-29, -15, -18, -25, 0, -25); ctx.closePath();
    }
  }

  function drawChar(p) {
    var sk = CAT_SKINS[p.skin] || CAT_SKINS.cream, isSimple = sk.simple, time = performance.now();
    if (sk.id === 'gold') drawGoldCatAurora(p.x, p.y, time);

    ctx.save();
    var labelStr = p.tier ? (p.tier + " " + p.name) : p.name;
    ctx.font = 'bold 12px sans-serif';
    var nameWidth = ctx.measureText(labelStr).width + 14;
    ctx.fillStyle = 'rgba(15, 23, 42, 0.8)';
    ctx.beginPath(); ctx.roundRect(p.x - nameWidth / 2, p.y - 72, nameWidth, 21, 8); ctx.fill();
    ctx.fillStyle = p.side === 1 ? '#fde047' : '#e0f2fe';
    ctx.textAlign = 'center'; ctx.fillText(labelStr, p.x, p.y - 57);
    ctx.restore();

    ctx.save(); ctx.translate(p.x, p.y + 32); ctx.scale(2 - p.squash, p.squash); ctx.translate(0, -32);

    var dir = p.side === 1 ? 1 : -1, speedRatio = Math.abs(p.vx) / p.maxSpeed;

    ctx.lineCap = 'round'; ctx.strokeStyle = '#0f172a'; ctx.lineWidth = isSimple ? 8 : 10;
    ctx.beginPath(); ctx.moveTo(mul(-dir, 12), 17); ctx.quadraticCurveTo(mul(-dir, 36), 2 + tailWag, mul(-dir, 28), -18 + tailWag); ctx.stroke();

    }

    if (!isSimple) {

    var rightEarColor = (sk.id === 'persian') ? '#334155' : (sk.id === 'siamese' ? '#4e342e' : (sk.id === 'calico' ? '#1e293b' : sk.color));

      ctx.beginPath(); ctx.moveTo(21, -12); ctx.lineTo(18, -34); ctx.lineTo(6, -22); ctx.closePath(); ctx.fill(); ctx.stroke();
    } else {
      ctx.fillStyle = leftEarColor; ctx.strokeStyle = '#0f172a'; ctx.lineWidth = 2.4;
      ctx.beginPath(); ctx.moveTo(-23, -10); ctx.quadraticCurveTo(-26, -34, -20, -36); ctx.quadraticCurveTo(-13, -37, -7, -21); ctx.closePath(); ctx.fill(); ctx.stroke();
      ctx.fillStyle = sk.earInner;
      ctx.beginPath(); ctx.moveTo(-20, -14); ctx.quadraticCurveTo(-22, -29, -18.5, -31); ctx.quadraticCurveTo(-15, -31, -11, -20); ctx.closePath(); ctx.fill();

      ctx.fillStyle = rightEarColor; ctx.beginPath(); ctx.moveTo(23, -10); ctx.quadraticCurveTo(26, -34, 20, -36); ctx.quadraticCurveTo(13, -37, 7, -21); ctx.closePath(); ctx.fill(); ctx.stroke();
      ctx.fillStyle = sk.earInner;
      ctx.beginPath(); ctx.moveTo(20, -14); ctx.quadraticCurveTo(22, -29, 18.5, -31); ctx.quadraticCurveTo(15, -31, 11, -20); ctx.closePath(); ctx.fill();
    }

    ctx.fillStyle = sk.color; traceCatHeadPath(isSimple); ctx.fill();

    if (!isSimple) {
      ctx.save(); traceCatHeadPath(false); ctx.clip();
      if (sk.id === 'persian') {
        ctx.fillStyle = '#bae6fd'; ctx.beginPath(); ctx.ellipse(0, -17, 27, 13, 0, 0, TAU); ctx.fill();
        ctx.fillStyle = '#e0f2fe'; ctx.beginPath(); ctx.arc(-22, 6, 10, 0, TAU); ctx.arc(22, 6, 10, 0, TAU); ctx.fill();
      } else if (sk.id === 'calico') {
        ctx.fillStyle = '#ea580c'; ctx.beginPath(); ctx.arc(-18, -14, 15, 0, TAU); ctx.fill();
        ctx.fillStyle = '#1e293b'; ctx.beginPath(); ctx.arc(20, -12, 14, 0, TAU); ctx.fill();
      } else if (sk.id === 'siamese') {

      } else {
        ctx.fillStyle = sk.light; ctx.beginPath(); ctx.ellipse(-6, -15, 13, 6, -0.25, 0, TAU); ctx.fill();
      }
      if (sk.id !== 'siamese') {
        ctx.fillStyle = sk.stripe;
        ctx.beginPath();
        ctx.roundRect(-7, -26, 2.8, 9, 1.5); ctx.roundRect(-1.4, -26, 2.8, 11, 1.5); ctx.roundRect(4.2, -26, 2.8, 9, 1.5);
        ctx.roundRect(-30, -1, 8.5, 2.5, 1.2); ctx.roundRect(-30, 3.5, 7.5, 2.5, 1.2);
        ctx.roundRect(21.5, -1, 8.5, 2.5, 1.2); ctx.roundRect(22.5, 3.5, 7.5, 2.5, 1.2);
        ctx.fill();
      }
      ctx.restore();
    }

    ctx.lineWidth = 2.6; ctx.strokeStyle = '#0f172a'; traceCatHeadPath(isSimple); ctx.stroke();

    if (sk.id === 'gold') {
      ctx.fillStyle = '#fef08a'; ctx.strokeStyle = '#854d0e'; ctx.lineWidth = 1.6;
      ctx.beginPath();
      ctx.moveTo(-9, -24); ctx.lineTo(-11, -35); ctx.lineTo(-4, -29); ctx.lineTo(0, -37);
      ctx.lineTo(4, -29); ctx.lineTo(11, -35); ctx.lineTo(9, -24);
      ctx.closePath(); ctx.fill(); ctx.stroke();

    ctx.beginPath(); ctx.ellipse(-15, 4, 4.5, 3, 0, 0, TAU); ctx.ellipse(15, 4, 4.5, 3, 0, 0, TAU); ctx.fill();

      ctx.beginPath(); ctx.ellipse(eyeX1, -2.5, 3.8, 4.4, 0, 0, TAU); ctx.ellipse(eyeX2, -2.5, 3.8, 4.4, 0, 0, TAU); ctx.fill();

    ctx.beginPath(); ctx.arc(noseX - 2.6, 5.2, 2.5, 0.15, 2.9); ctx.stroke(); ctx.beginPath(); ctx.arc(noseX + 2.6, 5.2, 2.5, 0.25, 3.0); ctx.stroke();

  }

  function drawBall() {
    var time = performance.now();
    ctx.save(); ctx.translate(ball.x, ball.y);

    if (ball.skin === 'golden') {

      var goldAurora = ctx.createRadialGradient(0, 0, ball.r * 0.7, 0, 0, ball.r + 16 + pulse * 3);
      goldAurora.addColorStop(0.0, 'rgba(254, 240, 138, 0.55)');

    else if (ball.spikeType === 'sakura') { ctx.fillStyle = 'rgba(244, 114, 182, 0.38)'; ctx.beginPath(); ctx.arc(0, 0, ball.r + 8, 0, TAU); ctx.fill(); }
    else if (ball.spikeType === 'blackhole') { ctx.fillStyle = 'rgba(88, 28, 135, 0.55)'; ctx.beginPath(); ctx.arc(0, 0, ball.r + 10, 0, TAU); ctx.fill(); }

    ctx.fillStyle = '#facc15'; ctx.beginPath(); ctx.arc(-10, 0.5, 2.5, 0, TAU); ctx.fill();

    ctx.fillStyle = '#fde68a';
    ctx.beginPath(); ctx.moveTo(0, -7); ctx.lineTo(3, -15); ctx.lineTo(7, -8); ctx.moveTo(6, -7); ctx.lineTo(10, -15); ctx.lineTo(13, -6); ctx.fill();
    ctx.beginPath(); ctx.arc(7, -2, 8.5, 0, TAU); ctx.fill(); ctx.stroke();

    ctx.fillStyle = '#0f172a'; ctx.beginPath(); ctx.arc(11, -3, 1.8, 0, TAU); ctx.fill();
    ctx.restore();
  }

  function drawBackground() {
    var pal = getSkyPalette();
    var sky = ctx.createLinearGradient(0, 0, 0, 380);
    sky.addColorStop(0, pal.top); sky.addColorStop(1, pal.bot);
    ctx.fillStyle = sky; ctx.fillRect(0, 0, 800, 450);

    var nightAlpha = 0;
    if (worldTime >= 0.46 && worldTime < 0.54) nightAlpha = (worldTime - 0.46) / 0.08;
    else if (worldTime >= 0.54 && worldTime <= 0.78) nightAlpha = 1;
    else if (worldTime > 0.78 && worldTime <= 0.86) nightAlpha = 1 - (worldTime - 0.78) / 0.08;

    if (nightAlpha > 0) {
      ctx.save(); var now = performance.now();
      for (var i = 0; i < stars.length; i++) {
        var st = stars[i], twinkle = 0.45 + mul(0.55, Math.abs(Math.sin(mul(now, 0.003) + st.phase)));
        ctx.fillStyle = "rgba(255, 255, 255, " + mul(nightAlpha, twinkle).toFixed(2) + ")";
        ctx.beginPath(); ctx.arc(st.x, st.y, st.r, 0, TAU); ctx.fill();
      }
      ctx.globalAlpha = nightAlpha; ctx.fillStyle = '#fef08a';
      ctx.beginPath(); ctx.arc(675, 78, 22, 0, TAU); ctx.fill();
      ctx.fillStyle = pal.top;
      ctx.beginPath(); ctx.arc(684, 72, 19, 0, TAU); ctx.fill();
      ctx.restore();
    }

    if (shootingStar.active) {
      ctx.save();
      var grad = ctx.createLinearGradient(shootingStar.x, shootingStar.y, shootingStar.x + 55, shootingStar.y - 25);
      grad.addColorStop(0, 'rgba(255, 255, 255, 0.95)'); grad.addColorStop(1, 'rgba(255, 255, 255, 0)');
      ctx.strokeStyle = grad; ctx.lineWidth = 2.5; ctx.lineCap = 'round';
      ctx.beginPath(); ctx.moveTo(shootingStar.x, shootingStar.y); ctx.lineTo(shootingStar.x + 55, shootingStar.y - 25); ctx.stroke();
      ctx.fillStyle = '#ffffff'; ctx.beginPath(); ctx.arc(shootingStar.x, shootingStar.y, 2.5, 0, TAU); ctx.fill();
      ctx.restore();
    }

    if (worldTime <= 0.50) {
      var sunProg = worldTime / 0.50, sunX = lerp(95, 705, sunProg), sunY = 75 + mul(Math.pow(sunProg, 2.2), 295), isSunset = worldTime > 0.34;
      ctx.save();
      ctx.fillStyle = isSunset ? 'rgba(251, 146, 60, 0.35)' : 'rgba(253, 224, 71, 0.28)';
      ctx.beginPath(); ctx.arc(sunX, sunY, isSunset ? 42 : 34, 0, TAU); ctx.fill();
      ctx.fillStyle = isSunset ? '#fb7185' : '#fde047';
      ctx.beginPath(); ctx.arc(sunX, sunY, isSunset ? 28 : 22, 0, TAU); ctx.fill();
      ctx.restore();
    }

    var cloudAlpha = nightAlpha > 0 ? lerp(0.7, 0.16, nightAlpha) : 0.72;
    ctx.fillStyle = worldTime > 0.35 && worldTime < 0.50 ? "rgba(254, 215, 170, 0.68)" : "rgba(255, 255, 255, " + cloudAlpha.toFixed(2) + ")";
    for (var c = 0; c < clouds.length; c++) {
      var cl = clouds[c];
      ctx.save(); ctx.translate(cl.x, cl.y); ctx.scale(cl.s, cl.s);
      ctx.beginPath(); ctx.arc(-28, 4, 24, 0, TAU); ctx.arc(0, -6, 34, 0, TAU); ctx.arc(30, 6, 22, 0, TAU); ctx.fill();
      ctx.restore();
    }

    for (var b = 0; b < birds.length; b++) {
      var bd = birds[b];
      if (bd.x > -40 && bd.x < 840) {
        var wingY = mul(Math.sin(bd.phase), 5);
        ctx.strokeStyle = 'rgba(15, 23, 42, 0.72)'; ctx.lineWidth = 2; ctx.lineCap = 'round';
        ctx.beginPath(); ctx.moveTo(bd.x - 8, bd.y + wingY); ctx.quadraticCurveTo(bd.x - 4, bd.y - 4, bd.x, bd.y); ctx.quadraticCurveTo(bd.x + 4, bd.y - 4, bd.x + 8, bd.y + wingY); ctx.stroke();
      }
    }

    if (heroCat.active) drawHeroCat(heroCat.x, heroCat.y);

    ctx.fillStyle = pal.sand; ctx.fillRect(0, 380, 800, 70);
    ctx.fillStyle = pal.line; ctx.fillRect(0, 380, 800, 6);
  }

  function draw() {
    drawBackground();

    ctx.fillStyle = 'rgba(255,255,255,0.85)'; ctx.font = 'bold 11px sans-serif'; ctx.textAlign = 'right';
    ctx.fillText(T().creatorLabel, 775, 30);

    ctx.fillStyle = '#fff'; ctx.fillRect(396, 260, 8, 120);
    ctx.fillStyle = 'rgba(15,23,42,0.85)'; ctx.strokeStyle = '#38bdf8'; ctx.lineWidth = 2;
    ctx.fillRect(320, 15, 160, 45); ctx.strokeRect(320, 15, 160, 45);

    ctx.fillStyle = '#fff'; ctx.font = 'bold 22px sans-serif'; ctx.textAlign = 'center';
    ctx.fillText(score1 + "   VS   " + score2, 400, 44);

    drawChar(p1); drawChar(p2);

    for (var i = 0; i < particles.length; i++) {
      var pt = particles[i]; ctx.save();
      if (pt.kind === 'wind') {
        ctx.strokeStyle = pt.color; ctx.lineWidth = 2; ctx.lineCap = 'round';
        ctx.beginPath(); ctx.moveTo(pt.x - pt.size, pt.y); ctx.lineTo(pt.x + pt.size, pt.y); ctx.stroke();
      } else if (pt.kind === 'bolt') {
        ctx.strokeStyle = pt.color; ctx.lineWidth = 2.2;
        ctx.beginPath(); ctx.moveTo(pt.x - 6, pt.y - 4); ctx.lineTo(pt.x, pt.y); ctx.lineTo(pt.x - 3, pt.y + 4); ctx.lineTo(pt.x + 6, pt.y + 7); ctx.stroke();
      } else if (pt.kind === 'crystal') {
        ctx.strokeStyle = pt.color; ctx.lineWidth = 2; var sz = pt.size * 0.8;
        ctx.beginPath(); ctx.moveTo(pt.x - sz, pt.y); ctx.lineTo(pt.x + sz, pt.y); ctx.moveTo(pt.x, pt.y - sz); ctx.lineTo(pt.x, pt.y + sz); ctx.stroke();
      } else if (pt.kind === 'petal') {
        ctx.fillStyle = pt.color;
        ctx.beginPath(); ctx.ellipse(pt.x, pt.y, pt.size * 0.7, pt.size * 0.4, pt.life * 0.2, 0, TAU); ctx.fill();
      } else if (pt.kind === 'void') {
        ctx.strokeStyle = pt.color; ctx.lineWidth = 2.2;
        ctx.beginPath(); ctx.arc(pt.x, pt.y, pt.size * 0.85, 0, TAU); ctx.stroke();
      } else {
        ctx.fillStyle = pt.color;
        ctx.beginPath(); ctx.arc(pt.x, pt.y, pt.size, 0, TAU); ctx.fill();
      }
      ctx.restore();
    }

    drawBall();

    if (gameOver) {
      ctx.fillStyle = 'rgba(0,0,0,0.85)'; ctx.fillRect(0, 0, 800, 450);
      ctx.fillStyle = '#fff'; ctx.font = 'bold 25px sans-serif';
      ctx.fillText(winnerText, 400, 225);
    }
  }

  currentLang = detectInitialLang();
  loadUserState();
  applyLanguageUI();
  if (AD_CONFIG.lobbyBannerHtml) {
    document.getElementById("lobbyAdSlot").innerHTML = AD_CONFIG.lobbyBannerHtml;
  }

  function loop(now) {
    var dt = (now - lastTime) / 16.666;
    if (dt > 2.5) dt = 2.5;
    lastTime = now;

    update(dt);
    draw();
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
};
</script>
</body>
