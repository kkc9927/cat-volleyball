<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>냐옹이 배구 온라인</title>
<script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
<style>
* { box-sizing: border-box; user-select: none; -webkit-user-select: none; }
body { background: #0f172a; color: #fff; text-align: center; font-family: sans-serif; margin: 0; padding: 6px 8px; display: flex; flex-direction: column; align-items: center; justify-content: space-between; height: 100dvh; overflow: hidden; touch-action: none; }

/* 상단 헤더 바 */
.top-bar { width: 100%; max-width: 800px; display: flex; justify-content: space-between; align-items: center; padding: 2px 4px; gap: 6px; }
h1 { font-size: 0.98rem; margin: 0; white-space: nowrap; }
.top-right { display: flex; align-items: center; gap: 6px; }
.spec-badge { background: rgba(168, 85, 247, 0.25); border: 1.5px solid #c084fc; color: #e9d5ff; border-radius: 8px; padding: 4px 8px; font-size: 0.75rem; font-weight: bold; display: none; }
.home-btn { background: #334155; color: #fff; border: 1.5px solid #64748b; border-radius: 8px; padding: 4px 9px; font-size: 0.78rem; font-weight: bold; cursor: pointer; }
.home-btn:active { background: #475569; }

/* 게임 캔버스 래퍼 */
.game-wrapper { position: relative; width: 100%; max-width: 800px; max-height: 59dvh; aspect-ratio: 800 / 450; }
canvas { border: 3px solid #fff; border-radius: 10px; width: 100%; height: 100%; display: block; background: #0284c7; transform: translateZ(0); }

/* 메인 대기화면(로비) 오버레이 */
.lobby-overlay {
  position: absolute;
  inset: 0;
  background: rgba(15, 23, 42, 0.91);
  backdrop-filter: blur(4px);
  border-radius: 10px;
  border: 3px solid #38bdf8;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 8px 12px;
  z-index: 10;
}
.lobby-header { display: flex; align-items: center; justify-content: space-between; width: 100%; max-width: 390px; margin-bottom: 6px; gap: 6px; }
.lobby-title { font-size: 1.05rem; font-weight: bold; color: #fde047; white-space: nowrap; }
.rank-pill {
  background: rgba(30, 41, 59, 0.95);
  border: 1.5px solid #facc15;
  border-radius: 20px;
  padding: 3px 9px;
  font-size: 0.72rem;
  font-weight: bold;
  color: #fef08a;
  white-space: nowrap;
  cursor: pointer;
}
.rank-pill:active { transform: scale(0.96); }

.menu-box { width: 100%; max-width: 390px; display: flex; flex-direction: column; gap: 6px; }

/* 닉네임 + 스킨 + TOP10 랭킹 버튼 행 */
.profile-row { display: flex; gap: 5px; width: 100%; }
.nick-row { flex: 1.3; display: flex; align-items: center; gap: 4px; background: #1e293b; border: 1.5px solid #38bdf8; border-radius: 10px; padding: 3px 7px; }
.nick-label { font-size: 0.74rem; color: #7dd3fc; font-weight: bold; white-space: nowrap; }
.nick-input {
  width: 100%;
  background: transparent;
  border: none;
  color: #fff;
  font-size: 0.85rem;
  font-weight: bold;
  padding: 3px;
  outline: none;
  user-select: text;
  -webkit-user-select: text;
}
.btn-skin-open {
  flex: 0.85;
  background: linear-gradient(135deg, #9333ea, #7e22ce);
  border: 1.5px solid #d8b4fe;
  border-radius: 10px;
  color: #fff;
  font-size: 0.76rem;
  font-weight: bold;
  cursor: pointer;
  padding: 5px 6px;
  white-space: nowrap;
}
.btn-rank-open {
  flex: 0.72;
  background: linear-gradient(135deg, #d97706, #b45309);
  border: 1.5px solid #fde047;
  border-radius: 10px;
  color: #fff;
  font-size: 0.76rem;
  font-weight: bold;
  cursor: pointer;
  padding: 5px 6px;
  white-space: nowrap;
}

.menu-btn {
  width: 100%;
  padding: 8px 12px;
  border-radius: 11px;
  border: none;
  font-size: 0.88rem;
  font-weight: bold;
  color: #fff;
  cursor: pointer;
  box-shadow: 0 3px 8px rgba(0,0,0,0.3);
}
.menu-btn:active { transform: scale(0.97); }
.btn-ai { background: linear-gradient(135deg, #0284c7, #0369a1); border: 1.5px solid #7dd3fc; }
.btn-create { background: linear-gradient(135deg, #ea580c, #c2410c); border: 1.5px solid #fdba74; }
.btn-list { background: linear-gradient(135deg, #16a34a, #15803d); border: 1.5px solid #86efac; }

/* 스킨 & 이펙트 꾸미기 패널 */
.skin-panel {
  display: none;
  flex-direction: column;
  width: 100%;
  max-width: 440px;
  gap: 6px;
}
.skin-scroll {
  width: 100%;
  max-height: 158px;
  overflow-y: auto;
  background: rgba(30, 41, 59, 0.96);
  border: 1.5px solid #a855f7;
  border-radius: 10px;
  padding: 7px;
  display: flex;
  flex-direction: column;
  gap: 8px;
  text-align: left;
}
.skin-cat-title { font-size: 0.74rem; font-weight: bold; color: #d8b4fe; margin-bottom: 3px; }
.skin-grid { display: flex; flex-wrap: wrap; gap: 5px; }
.skin-chip {
  flex: 1 1 30%;
  min-width: 96px;
  background: #0f172a;
  border: 1.5px solid #475569;
  border-radius: 8px;
  padding: 5px 5px;
  color: #e2e8f0;
  font-size: 0.72rem;
  text-align: center;
  cursor: pointer;
}
.skin-chip.equipped { border-color: #facc15; background: rgba(250, 204, 21, 0.16); color: #fef08a; font-weight: bold; }
.skin-chip.locked { border-color: #9333ea; color: #c084fc; }
.skin-sub { display: block; font-size: 0.64rem; opacity: 0.85; margin-top: 2px; }

/* TOP 10 랭킹 패널 */
.rank-panel {
  display: none;
  flex-direction: column;
  width: 100%;
  max-width: 420px;
  gap: 6px;
}
.rank-scroll {
  width: 100%;
  max-height: 155px;
  overflow-y: auto;
  background: rgba(30, 41, 59, 0.96);
  border: 1.5px solid #facc15;
  border-radius: 10px;
  padding: 5px 7px;
  display: flex;
  flex-direction: column;
  gap: 4px;
}
.rank-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  background: #0f172a;
  border: 1px solid #334155;
  border-radius: 7px;
  padding: 4px 8px;
  font-size: 0.75rem;
}
.rank-row.me {
  border-color: #facc15;
  background: rgba(250, 204, 21, 0.14);
}
.rank-left { display: flex; align-items: center; gap: 6px; font-weight: bold; }
.rank-num { width: 22px; text-align: center; color: #fde047; }
.rank-right { font-size: 0.7rem; color: #bae6fd; }

/* 방 리스트 패널 */
.list-panel { display: none; flex-direction: column; align-items: center; gap: 6px; width: 100%; max-width: 390px; }
.room-list-box {
  width: 100%;
  max-height: 112px;
  overflow-y: auto;
  background: rgba(30, 41, 59, 0.92);
  border: 1.5px solid #475569;
  border-radius: 10px;
  padding: 5px;
  display: flex;
  flex-direction: column;
  gap: 5px;
}
.room-item {
  display: flex;
  justify-content: space-between;
  align-items: center;
  background: #0f172a;
  border: 1px solid #38bdf8;
  border-radius: 8px;
  padding: 5px 9px;
  font-size: 0.8rem;
}
.room-item-info { text-align: left; }
.room-item-title { font-weight: bold; color: #fde047; }
.room-item-sub { font-size: 0.7rem; color: #94a3b8; }
.room-item-btn {
  background: #16a34a;
  color: #fff;
  border: none;
  border-radius: 6px;
  padding: 5px 9px;
  font-size: 0.75rem;
  font-weight: bold;
  cursor: pointer;
}
.room-item-btn.spec { background: #7e22ce; }

.join-row { display: flex; gap: 5px; width: 100%; }
.code-input {
  flex: 1.2;
  padding: 6px;
  border-radius: 8px;
  border: 1.5px solid #64748b;
  background: #1e293b;
  color: #fff;
  font-size: 0.82rem;
  font-weight: bold;
  text-align: center;
  text-transform: uppercase;
  user-select: text;
  -webkit-user-select: text;
}
.btn-small { flex: 0.8; padding: 6px; border-radius: 8px; font-size: 0.78rem; }

/* 방 생성 후 대기 패널 */
.wait-panel { display: none; flex-direction: column; align-items: center; gap: 6px; width: 100%; max-width: 350px; }
.room-badge {
  background: #1e293b;
  border: 2px dashed #fde047;
  border-radius: 10px;
  padding: 6px 14px;
  font-size: 1.1rem;
  font-weight: bold;
  color: #fde047;
  letter-spacing: 1px;
  user-select: all;
  -webkit-user-select: all;
}
.wait-actions { display: flex; gap: 8px; width: 100%; }
.btn-copy { flex: 1.5; background: #16a34a; border: 1.5px solid #86efac; }
.btn-cancel { flex: 1; background: #475569; border: 1.5px solid #94a3b8; }
.lobby-status { font-size: 0.75rem; color: #bae6fd; margin-top: 4px; min-height: 15px; }

/* 보상 해금 확인 모달 */
.reward-modal {
  display: none;
  position: absolute;
  inset: 14px;
  background: rgba(15, 23, 42, 0.97);
  border: 2px solid #facc15;
  border-radius: 12px;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 14px;
  z-index: 20;
  gap: 8px;
}
.reward-modal h3 { margin: 0; color: #fde047; font-size: 1rem; }
.reward-modal p { margin: 0; font-size: 0.8rem; color: #e2e8f0; line-height: 1.4; }
.reward-btns { display: flex; gap: 8px; width: 100%; max-width: 260px; margin-top: 4px; }

/* 모바일 터치 패드 */
.controls { width: 100%; max-width: 800px; flex: 1; max-height: 155px; display: flex; justify-content: space-between; align-items: stretch; gap: 12px; padding: 6px 4px 8px; }
.dpad-group { flex: 1.1; display: flex; gap: 8px; }
.action-group { flex: 1.1; display: flex; gap: 8px; }
.touch-btn { flex: 1; height: 100%; min-height: 78px; border-radius: 18px; border: 2.5px solid rgba(255,255,255,0.45); background: rgba(255,255,255,0.14); color: #fff; font-size: 1.45rem; font-weight: bold; display: flex; flex-direction: column; align-items: center; justify-content: center; }
.touch-btn:active, .touch-btn.active { background: rgba(56,189,248,0.65); border-color: #7dd3fc; transform: scale(0.96); }
.jump-btn { background: rgba(56,189,248,0.25); border-color: rgba(125,211,252,0.6); font-size: 1.15rem; }
.spike-btn { background: rgba(249,115,22,0.45); border-color: #fb923c; font-size: 1.05rem; }
.sub-label { font-size: 0.7rem; font-weight: normal; opacity: 0.85; margin-top: 2px; }

/* 관전자 전용 안내 바 */
.spectator-banner {
  display: none;
  width: 100%;
  max-width: 800px;
  flex: 1;
  max-height: 125px;
  background: rgba(88, 28, 135, 0.35);
  border: 2px solid #a855f7;
  border-radius: 16px;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 10px;
  margin: 6px 0;
}
.spectator-banner strong { font-size: 1rem; color: #f3e8ff; margin-bottom: 4px; }
.spectator-banner span { font-size: 0.8rem; color: #d8b4fe; }
</style>
</head>
<body>

<div class="top-bar">
  <h1>🐾 냐옹이 배구</h1>
  <div class="top-right">
    <div class="spec-badge" id="specBadge">👀 관전 0명</div>
    <button class="home-btn" id="btnHome" style="display:none;">🏠 대기화면</button>
  </div>
</div>

<div class="game-wrapper">
  <canvas id="cvs" width="800" height="450"></canvas>

  <!-- 대기화면(로비) -->
  <div class="lobby-overlay" id="lobbyOverlay">
    <div class="lobby-header">
      <div class="lobby-title">🏐 냐옹이 배구</div>
      <div class="rank-pill" id="rankSummaryBadge">🥉 브론즈 · 0승 0패 (0%)</div>
    </div>

    <!-- 1. 기본 메인 메뉴 -->
    <div class="menu-box" id="mainMenuBox">
      <div class="profile-row">
        <div class="nick-row">
          <span class="nick-label">닉네임</span>
          <input type="text" class="nick-input" id="nickInput" maxlength="8" placeholder="닉네임 입력">
        </div>
        <button class="btn-skin-open" id="btnOpenSkins">🎨 스킨</button>
        <button class="btn-rank-open" id="btnOpenRank">🏆 랭킹</button>
      </div>

      <button class="menu-btn btn-ai" id="btnStartAI">🐱 1인 플레이 (AI 대전)</button>
      <button class="menu-btn btn-create" id="btnCreateRoom">🏠 방 만들기 (공개방 생성)</button>
      <button class="menu-btn btn-list" id="btnOpenRoomList">🔍 참여하기 (방 리스트 보기)</button>
    </div>

    <!-- 2. 스킨 & 이펙트 선택 패널 (24시간 기간제 해금) -->
    <div class="skin-panel" id="skinPanel">
      <div class="skin-scroll" id="skinScrollContainer"></div>
      <button class="menu-btn btn-ai btn-small" id="btnCloseSkins">선택 완료 (돌아가기)</button>
    </div>

    <!-- 3. TOP 10 랭킹 보드 패널 -->
    <div class="rank-panel" id="rankPanel">
      <div class="rank-scroll" id="rankListContainer"></div>
      <div class="join-row">
        <button class="menu-btn btn-list btn-small" id="btnRefreshRank">🔄 실시간 갱신</button>
        <button class="menu-btn btn-cancel btn-small" id="btnCloseRank">뒤로</button>
      </div>
    </div>

    <!-- 4. 공개 방 리스트 및 코드 직접 입력 패널 -->
    <div class="list-panel" id="listPanel">
      <div class="room-list-box" id="roomListBox">
        <div style="padding:16px; color:#94a3b8; font-size:0.8rem;">열려 있는 방을 찾는 중...</div>
      </div>
      <div class="join-row">
        <input type="text" class="code-input" id="roomCodeInput" placeholder="코드 직접입력">
        <button class="menu-btn btn-list btn-small" id="btnJoinDirect">입장</button>
        <button class="menu-btn btn-cancel btn-small" id="btnRefreshList">새로고침</button>
        <button class="menu-btn btn-cancel btn-small" id="btnBackMain">뒤로</button>
      </div>
    </div>

    <!-- 5. 방 생성 후 대기 화면 -->
    <div class="wait-panel" id="waitPanel">
      <div style="font-size:0.8rem; color:#e2e8f0;">공개 로비에 등록되었습니다! 친구가 방 리스트에서 바로 찾을 수 있어요.</div>
      <div class="room-badge" id="roomCodeDisplay">CAT-ROOM-1</div>
      <div class="wait-actions">
        <button class="menu-btn btn-copy" id="btnCopyCode">📋 방코드 복사</button>
        <button class="menu-btn btn-cancel" id="btnCancelRoom">취소</button>
      </div>
    </div>

    <!-- 보상형 24시간 해금 팝업 -->
    <div class="reward-modal" id="rewardModal">
      <h3 id="rewardModalTitle">🎁 스킨 24시간 무료 체험</h3>
      <p id="rewardModalDesc">짧은 광고(또는 이벤트 응원) 후 선택한 아이템을 24시간 동안 자유롭게 사용할 수 있습니다!</p>
      <div class="reward-btns">
        <button class="menu-btn btn-create btn-small" id="btnConfirmUnlock">🎬 24시간 열기</button>
        <button class="menu-btn btn-cancel btn-small" id="btnCancelUnlock">닫기</button>
      </div>
    </div>

    <div class="lobby-status" id="lobbyStatus">닉네임과 스킨을 고르고 게임을 시작하세요!</div>
  </div>
</div>

<!-- 플레이어용 터치 패드 -->
<div class="controls" id="controlsArea">
  <div class="dpad-group" id="dpadArea">
    <div class="touch-btn" id="btnLeft">◀<span class="sub-label">왼쪽</span></div>
    <div class="touch-btn" id="btnRight">▶<span class="sub-label">오른쪽</span></div>
  </div>
  <div class="action-group">
    <div class="touch-btn spike-btn" id="btnSpike">💥스파이크<span class="sub-label">강타</span></div>
    <div class="touch-btn jump-btn" id="btnJump">점프<span class="sub-label">▲</span></div>
  </div>
</div>

<!-- 3번째 입장자부터 표시되는 관전 안내 -->
<div class="spectator-banner" id="spectatorBanner">
  <strong>👀 관전 모드로 입장했습니다</strong>
  <span id="spectatorInfo">현재 1P와 2P가 대전 중입니다. 실시간 경기를 관람하세요!</span>
</div>

<script>
window.onload = function() {
  var cvs = document.getElementById("cvs");
  var ctx = cvs.getContext("2d", { alpha: false });
  var TAU = 6.283185;
  function mul(a, b) { return a / (1 / b); }

  var HOURS_24_MS = 24 * 60 * 60 * 1000;

  // --- 1. 확장된 스킨 & 스파이크 카탈로그 ---
  var CAT_SKINS = {
    cream:   { id: 'cream',   name: '크림냥(기본)',   free: true,  simple: true,  color: '#fef3c7', shadow: '#78350f', light: '#ffffff', stripe: '#d97706', earInner: '#fda4af' },
    gray:    { id: 'gray',    name: '그레이냥(기본)', free: true,  simple: true,  color: '#cbd5e1', shadow: '#1e293b', light: '#f1f5f9', stripe: '#64748b', earInner: '#fda4af' },
    cheese:  { id: 'cheese',  name: '치즈냥',         free: false, simple: false, color: '#f59e0b', shadow: '#78350f', light: '#fde68a', stripe: '#92400e', earInner: '#fda4af' },
    persian: { id: 'persian', name: '페르시안냥',     free: false, simple: false, color: '#ffffff', shadow: '#0f172a', light: '#bae6fd', stripe: '#1e293b', earInner: '#fda4af' },
    black:   { id: 'black',   name: '검둥이냥',       free: false, simple: false, color: '#1e293b', shadow: '#020617', light: '#475569', stripe: '#0f172a', earInner: '#fb7185' },
    calico:  { id: 'calico',  name: '삼색냥',         free: false, simple: false, color: '#ffffff', shadow: '#1e293b', light: '#fef3c7', stripe: '#ea580c', earInner: '#fda4af' },
    siamese: { id: 'siamese', name: '샴냥',           free: false, simple: false, color: '#f5ebe0', shadow: '#3e2723', light: '#ffffff', stripe: '#4e342e', earInner: '#d7ccc8' },
    gold:    { id: 'gold',    name: '황금냥',         free: false, simple: false, color: '#facc15', shadow: '#854d0e', light: '#fef9c3', stripe: '#ca8a04', earInner: '#fde047' }
  };

  var BALL_SKINS = {
    classic:    { id: 'classic',    name: '비치볼(기본)', free: true },
    watermelon: { id: 'watermelon', name: '수박공',       free: false },
    rainbow:    { id: 'rainbow',    name: '무지개공',     free: false },
    soccer:     { id: 'soccer',     name: '축구공',       free: false },
    paw:        { id: 'paw',        name: '냥발바닥공',   free: false },
    golden:     { id: 'golden',     name: '황금공',       free: false }
  };

  var SPIKE_SKINS = {
    wind:      { id: 'wind',      name: '💨 바람슛(기본)', free: true },
    meteor:    { id: 'meteor',    name: '☄️ 메테오',       free: false },
    lightning: { id: 'lightning', name: '⚡ 번개슛',       free: false },
    ice:       { id: 'ice',       name: '❄️ 얼음슛',       free: false },
    sakura:    { id: 'sakura',    name: '🌸 벚꽃슛',       free: false },
    blackhole: { id: 'blackhole', name: '🌌 블랙홀슛',     free: false }
  };

  // --- 2. 로컬 저장소 기반 24시간 해금 & 랭크/전적 관리 ---
  var userState = {
    equippedCat: 'cream',
    equippedBall: 'classic',
    equippedSpike: 'wind',
    unlocks: {},
    wins: 0,
    losses: 0,
    knownPlayers: [] // 온라인에서 만난 다른 플레이어들의 랭킹 데이터 캐시
  };

  function loadUserState() {
    try {
      var raw = localStorage.getItem('cat_volley_save_v2');
      if (raw) {
        var parsed = JSON.parse(raw);
        if (parsed.equippedCat && CAT_SKINS[parsed.equippedCat]) userState.equippedCat = parsed.equippedCat;
        if (parsed.equippedBall && BALL_SKINS[parsed.equippedBall]) userState.equippedBall = parsed.equippedBall;
        if (parsed.equippedSpike && SPIKE_SKINS[parsed.equippedSpike]) userState.equippedSpike = parsed.equippedSpike;
        if (parsed.unlocks) userState.unlocks = parsed.unlocks;
        if (typeof parsed.wins === 'number') userState.wins = parsed.wins;
        if (typeof parsed.losses === 'number') userState.losses = parsed.losses;
        if (Array.isArray(parsed.knownPlayers)) userState.knownPlayers = parsed.knownPlayers;
      }
    } catch (e) {}
    validateExpiredUnlocks();

  function isItemUnlocked(key, isFree) {
    if (isFree) return true;

    var exp = userState.unlocks[key];
    if (!exp || exp <= Date.now()) return "";
    var diffMs = exp - Date.now();
    var hrs = Math.ceil(diffMs / (60 * 60 * 1000));
    return hrs + "시간 남음";
  }

    if (!isItemUnlocked('ball_' + userState.equippedBall, BALL_SKINS[userState.equippedBall].free)) {

    if (!isItemUnlocked('spike_' + userState.equippedSpike, SPIKE_SKINS[userState.equippedSpike].free)) {

  function getRankInfo(wins, losses) {
    var total = wins + losses;
    var rate = total > 0 ? Math.round((wins / total) * 100) : 0;
    var tier = "🥉 브론즈";
    if (total >= 15 && rate >= 75) tier = "👑 챌린저냥";
    else if (total >= 10 && rate >= 65) tier = "💎 다이아";
    else if (total >= 5 && rate >= 55) tier = "🥇 골드";
    else if (total >= 2 && rate >= 40) tier = "🥈 실버";
    // 랭킹 산정 점수: 승리당 30점 + 승률 보너스
    var score = mul(wins, 30) + rate;
    return {
      tier: tier,
      rate: rate,
      total: total,
      score: score,
      summary: tier + " · " + wins + "승 " + losses + "패 (" + rate + "%)"
    };
  }

    if (!nick || nick.indexOf('(AI)') !== -1) return;
    var found = false;
    for (var i = 0; i < userState.knownPlayers.length; i++) {
      if (userState.knownPlayers[i].nick === nick) {

        userState.knownPlayers[i].losses = losses;
        found = true;

    if (!found) {

  function renderTop10Leaderboard(onlineExtras) {
    var myNick = getMyNick(CAT_SKINS[userState.equippedCat].name.replace('(기본)', ''));
    var pool = [];

    // 1) 내 전적 추가
    pool.push({ nick: myNick, wins: userState.wins, losses: userState.losses, isMe: true });

    // 2) 실시간 온라인 로비에서 감지된 플레이어 추가
    if (Array.isArray(onlineExtras)) {
      for (var i = 0; i < onlineExtras.length; i++) {
        var op = onlineExtras[i];
        if (op.nick && op.nick !== myNick) {
          upsertKnownPlayer(op.nick, op.wins || 0, op.losses || 0);
        }
      }
    }

    // 3) 저장된 온라인 상대방 전적 병합
    for (var j = 0; j < userState.knownPlayers.length; j++) {
      var kp = userState.knownPlayers[j];
      if (kp.nick !== myNick && !pool.some(function(x) { return x.nick === kp.nick; })) {
        pool.push({ nick: kp.nick, wins: kp.wins, losses: kp.losses, isMe: false });
      }
    }

    // 4) 10명이 안 차면 기본 라이벌 랭커로 채움
    for (var k = 0; k < DEFAULT_RIVALS.length; k++) {
      var dr = DEFAULT_RIVALS[k];
      if (dr.nick !== myNick && !pool.some(function(x) { return x.nick === dr.nick; })) {
        pool.push({ nick: dr.nick, wins: dr.wins, losses: dr.losses, isMe: false });
      }
    }

    // 랭킹 점수 및 승률 기준 내림차순 정렬
    pool.sort(function(a, b) {
      var ra = getRankInfo(a.wins, a.losses);
      var rb = getRankInfo(b.wins, b.losses);
      if (rb.score !== ra.score) return rb.score - ra.score;
      return rb.wins - a.wins;
    });

    var top10 = pool.slice(0, 10);
    var box = document.getElementById("rankListContainer");
    box.innerHTML = "";

    for (var idx = 0; idx < top10.length; idx++) {
      var item = top10[idx];
      var info = getRankInfo(item.wins, item.losses);
      var medal = idx === 0 ? "🥇" : (idx === 1 ? "🥈" : (idx === 2 ? "🥉" : (idx + 1) + "위"));
      var row = document.createElement("div");
      row.className = "rank-row" + (item.isMe ? " me" : "");
      row.innerHTML =
        '<div class="rank-left">' +
          '<span class="rank-num">' + medal + '</span>' +
          '<span>' + info.tier + ' ' + item.nick + (item.isMe ? ' <span style="color:#fde047;">(나)</span>' : '') + '</span>' +
        '</div>' +
        '<div class="rank-right">' + item.wins + '승 ' + item.losses + '패 (' + info.rate + '%)</div>';
      box.appendChild(row);
    }
  }

  var LOBBY_SLOTS = [];
  for (var s = 1; s <= 10; s++) LOBBY_SLOTS.push("CAT-ROOM-" + s);

  var worldTime = 0.08;
  var clouds = [
    { x: 120, y: 82, s: 1.0, spd: 0.32 },
    { x: 430, y: 65, s: 0.78, spd: 0.22 },
    { x: 680, y: 105, s: 1.12, spd: 0.40 }
  ];
  var stars = [];
  for (var si = 0; si < 38; si++) {
    stars.push({ x: Math.random() * 800, y: 12 + Math.random() * 230, r: 0.8 + Math.random() * 1.5, phase: Math.random() * TAU });
  }
  var shootingStar = { active: false, x: 0, y: 0, vx: 0, vy: 0, life: 0 };
  var birds = [
    { x: -60, y: 95, spd: 1.7, phase: 0 },
    { x: -95, y: 80, spd: 1.7, phase: 1.2 },
    { x: -125, y: 112, spd: 1.7, phase: 2.4 }
  ];
  var heroCat = { active: false, x: -120, y: 88, spd: 4.4, cooldown: 1200 };

  function lerp(a, b, t) { return a + mul(b - a, t); }
  function lerpColor(c1, c2, t) {
    var r = Math.round(lerp(c1[0], c2[0], t));
    var g = Math.round(lerp(c1[1], c2[1], t));
    var b = Math.round(lerp(c1[2], c2[2], t));
    return "rgb(" + r + "," + g + "," + b + ")";
  }

  function updateEnvironment(dt) {
    worldTime += mul(0.00022, dt);
    if (worldTime >= 1) worldTime -= 1;

    for (var i = 0; i < clouds.length; i++) {
      clouds[i].x += mul(clouds[i].spd, dt);
      if (clouds[i].x > 890) clouds[i].x = -90;
    }

    if (worldTime >= 0.50 && worldTime <= 0.82) {
      if (!shootingStar.active && Math.random() < mul(0.014, dt)) {
        shootingStar.active = true;
        shootingStar.x = 180 + Math.random() * 580;
        shootingStar.y = 15 + Math.random() * 75;
        shootingStar.vx = -9.5;
        shootingStar.vy = 4.2;
        shootingStar.life = 34;
      }
    }
    if (shootingStar.active) {
      shootingStar.x += mul(shootingStar.vx, dt);
      shootingStar.y += mul(shootingStar.vy, dt);
      shootingStar.life -= dt;
      if (shootingStar.life <= 0) shootingStar.active = false;
    }

    var isMorning = (worldTime >= 0.82 || worldTime <= 0.08);
    for (var b = 0; b < birds.length; b++) {
      if (isMorning || birds[b].x > -40) {
        birds[b].x += mul(birds[b].spd, dt);
        birds[b].phase += mul(0.16, dt);
        if (birds[b].x > 860) {
          birds[b].x = isMorning ? -60 - mul(b, 32) : -120;
          birds[b].y = 70 + Math.random() * 65;
        }
      }
    }

    if (heroCat.cooldown > 0) heroCat.cooldown -= dt;
    if (worldTime >= 0.12 && worldTime <= 0.32 && heroCat.cooldown <= 0) {
      if (!heroCat.active && Math.random() < mul(0.0012, dt)) {
        heroCat.active = true;
        heroCat.x = -110;
        heroCat.y = 65 + Math.random() * 55;
        heroCat.cooldown = 2600;
      }
    }
    if (heroCat.active) {
      heroCat.x += mul(heroCat.spd, dt);
      if (heroCat.x > 920) heroCat.active = false;
    }
  }

  function getSkyPalette() {
    var keys = [
      { t: 0.00, top: [14, 165, 233], bot: [186, 230, 253], sand: [253, 224, 71], line: [234, 179, 8] },
      { t: 0.32, top: [2, 132, 199],  bot: [125, 211, 252], sand: [253, 224, 71], line: [234, 179, 8] },
      { t: 0.43, top: [124, 45, 18],  bot: [251, 146, 60],  sand: [245, 158, 11], line: [180, 83, 9] },
      { t: 0.53, top: [15, 23, 42],   bot: [30, 41, 59],    sand: [161, 136, 62], line: [113, 95, 42] },
      { t: 0.80, top: [15, 23, 42],   bot: [49, 46, 129],   sand: [175, 150, 72], line: [120, 102, 48] },
      { t: 0.90, top: [131, 24, 67],  bot: [253, 186, 116], sand: [252, 211, 77], line: [217, 119, 6] },
      { t: 1.00, top: [14, 165, 233], bot: [186, 230, 253], sand: [253, 224, 71], line: [234, 179, 8] }
    ];
    for (var i = 0; i < keys.length - 1; i++) {
      if (worldTime >= keys[i].t && worldTime <= keys[i + 1].t) {
        var span = keys[i + 1].t - keys[i].t;
        var ratio = span > 0 ? (worldTime - keys[i].t) / span : 0;
        return {
          top: lerpColor(keys[i].top, keys[i + 1].top, ratio),
          bot: lerpColor(keys[i].bot, keys[i + 1].bot, ratio),
          sand: lerpColor(keys[i].sand, keys[i + 1].sand, ratio),
          line: lerpColor(keys[i].line, keys[i + 1].line, ratio)
        };
      }
    }
    return { top: '#0284c7', bot: '#7dd3fc', sand: '#fde047', line: '#eab308' };
  }

  function broadcastToAll(payload) {

  // --- 7. 방 생성 & 공개 방 리스트 스캔 ---
  function tryCreateHostSlot(slotIndex, fixedCode) {
    if (typeof Peer === 'undefined') {
      lobbyStatus.innerText = "인터넷 연결이 필요합니다.";
      return;
    }
    if (!fixedCode && slotIndex >= LOBBY_SLOTS.length) {
      lobbyStatus.innerText = "현재 공개방 10개가 모두 가득 찼습니다.";
      mainMenuBox.style.display = 'flex';
      waitPanel.style.display = 'none';
      return;
    }

    validateExpiredUnlocks();
    var targetId = fixedCode || LOBBY_SLOTS[slotIndex];
    if (peer) { try { peer.destroy(); } catch (e) {} }

    isHostingRoom = true;
    var rInfo = getRankInfo(userState.wins, userState.losses);
    p1.name = getMyNick(CAT_SKINS[userState.equippedCat].name.replace('(기본)', ''));
    p1.tier = rInfo.tier;
    p1.wins = userState.wins;
    p1.losses = userState.losses;
    p1.skin = userState.equippedCat;
    p1.spikeSkin = userState.equippedSpike;
    ball.skin = userState.equippedBall;
    myRoomId = targetId;

    mainMenuBox.style.display = 'none';
    skinPanel.style.display = 'none';
    rankPanel.style.display = 'none';
    listPanel.style.display = 'none';
    waitPanel.style.display = 'flex';
    document.getElementById("roomCodeDisplay").innerText = targetId;
    lobbyStatus.innerText = "공개 방 슬롯(" + (slotIndex + 1) + "번) 연결 중...";

    var tempPeer = new Peer(targetId);
    peer = tempPeer;

    tempPeer.on('open', function(id) {
      myRoomId = id;
      try { sessionStorage.setItem('cat_host_room', id); } catch (e) {}
      document.getElementById("roomCodeDisplay").innerText = id;
      lobbyStatus.innerText = "방 개설 완료! 상대방이 방 리스트에서 입장할 수 있습니다.";
    });

    tempPeer.on('connection', function(c) {
      c.on('data', function(data) {
        if (data && data.type === 'probe') {
          var isPlaying = (player2Conn && player2Conn.open);
          c.send({
            type: 'roomInfo',
            roomId: myRoomId,
            hostName: p1.name,
            hostTier: p1.tier,
            hostWins: p1.wins,
            hostLosses: p1.losses,
            p2Name: isPlaying ? p2.name : "",
            p2Wins: isPlaying ? p2.wins : 0,
            p2Losses: isPlaying ? p2.losses : 0,
            status: isPlaying ? 'playing' : 'waiting',
            specCount: spectatorConns.length
          });
          setTimeout(function() { try { c.close(); } catch (e) {} }, 300);
          return;
        }

        if (data && data.type === 'hello') {
          if (!player2Conn || !player2Conn.open) {
            player2Conn = c;
            p2.name = data.nick || '그레이냥';
            p2.tier = data.tier || '🥉 브론즈';
            p2.wins = data.wins || 0;
            p2.losses = data.losses || 0;
            p2.skin = (data.catSkin && CAT_SKINS[data.catSkin]) ? data.catSkin : 'gray';
            p2.spikeSkin = (data.spikeSkin && SPIKE_SKINS[data.spikeSkin]) ? data.spikeSkin : 'wind';
            upsertKnownPlayer(p2.name, p2.wins, p2.losses);
            c.send({ type: 'role', role: 'guest', p1Name: p1.name, p1Tier: p1.tier, p1Wins: p1.wins, p1Losses: p1.losses, p1Skin: p1.skin, ballSkin: ball.skin });
            if (gameState !== 'playing') startMatch('host');
          } else {
            spectatorConns.push(c);
            updateSpecBadge(spectatorConns.length);
            c.send({
              type: 'role',
              role: 'spectator',
              p1Name: p1.name,
              p2Name: p2.name,
              specCount: spectatorConns.length
            });
          }
        } else if (data && data.type === 'keys' && c === player2Conn) {
          remoteKeys = data.keys;
        }
      });

      c.on('close', function() {
        if (c === player2Conn) {
          player2Conn = null;
          returnToLobby("상대 플레이어(2P)가 퇴장하여 대기화면으로 돌아왔습니다.");
        } else {
          var idx = spectatorConns.indexOf(c);
          if (idx !== -1) {
            spectatorConns.splice(idx, 1);
            updateSpecBadge(spectatorConns.length);
          }
        }
      });
    });

    tempPeer.on('disconnected', function() {
      if (isHostingRoom && peer && !peer.destroyed) peer.reconnect();
    });

    tempPeer.on('error', function(err) {
      if (err && err.type === 'unavailable-id') {
        if (fixedCode) {
          setTimeout(function() { if (isHostingRoom) tryCreateHostSlot(0, fixedCode); }, 1200);
        } else {
          tryCreateHostSlot(slotIndex + 1, null);
        }
      } else {
        lobbyStatus.innerText = "연결 대기 중...";
      }
    });
  }

  function scanOpenRooms() {
    if (typeof Peer === 'undefined') {
      lobbyStatus.innerText = "인터넷 연결이 필요합니다.";
      return;
    }
    if (scanPeer) { try { scanPeer.destroy(); } catch (e) {} }

    roomListBox.innerHTML = '<div style="padding:16px; color:#bae6fd; font-size:0.8rem;">🔍 열려 있는 방을 찾는 중...</div>';
    lobbyStatus.innerText = "공개 방 목록을 조회하고 있습니다...";

    var foundRooms = [];
    var checkedCount = 0;
    var sp = new Peer();
    scanPeer = sp;

    sp.on('open', function() {
      for (var i = 0; i < LOBBY_SLOTS.length; i++) {
        (function(slotId) {
          var c = sp.connect(slotId, { reliable: true });
          var done = false;
          var finishOne = function() {
            if (done) return;
            done = true;
            checkedCount++;
            renderRoomList(foundRooms, checkedCount >= LOBBY_SLOTS.length);
          };
          c.on('open', function() { c.send({ type: 'probe' }); });
          c.on('data', function(data) {
            if (data && data.type === 'roomInfo') {
              foundRooms.push(data);
              if (data.hostName) upsertKnownPlayer(data.hostName, data.hostWins || 0, data.hostLosses || 0);
              finishOne();
            }
          });
          c.on('error', finishOne);
          setTimeout(function() { try { c.close(); } catch (e) {} finishOne(); }, 1600);
        })(LOBBY_SLOTS[i]);
      }
    });

    sp.on('error', function() { renderRoomList(foundRooms, true); });
  }

  function renderRoomList(rooms, isDone) {
    if (rooms.length === 0) {
      if (isDone) {
        roomListBox.innerHTML = '<div style="padding:14px; color:#94a3b8; font-size:0.8rem;">현재 열린 방이 없습니다.<br>직접 방을 만들거나 코드를 입력해 보세요!</div>';
        lobbyStatus.innerText = "열린 방이 없으면 [방 만들기]로 호스트가 되어보세요.";
      }
      return;
    }

    roomListBox.innerHTML = "";
    for (var i = 0; i < rooms.length; i++) {

      item.className = "room-item";
      var isWaiting = (r.status === 'waiting');
      var statusBadge = isWaiting
        ? "대기중 (1/2명) · 바로 대전 가능"
        : "대전중 (" + r.hostName + " vs " + r.p2Name + ") · 관전 " + r.specCount + "명";

      item.innerHTML =
        '<div class="room-item-info">' +
          '<div class="room-item-title">[' + (r.hostTier || '🥉 브론즈') + '] ' + r.hostName + '의 방</div>' +
          '<div class="room-item-sub">' + statusBadge + '</div>' +
        '</div>';

      var btn = document.createElement("button");
      btn.className = isWaiting ? "room-item-btn" : "room-item-btn spec";
      btn.innerText = isWaiting ? "대전 입장" : "👀 관람";
      (function(targetRoomId) {
        btn.onclick = function() { joinRoomById(targetRoomId); };
      })(r.roomId);

      item.appendChild(btn);
      roomListBox.appendChild(item);
    }
    lobbyStatus.innerText = "총 " + rooms.length + "개의 방이 열려 있습니다! 터치해서 입장하세요.";
  }

  function joinRoomById(code) {
    if (!code) {
      lobbyStatus.innerText = "입장할 방을 선택하거나 코드를 입력하세요!";
      return;
    }
    validateExpiredUnlocks();
    isHostingRoom = false;
    try { sessionStorage.removeItem('cat_host_room'); } catch (e) {}
    if (scanPeer) { try { scanPeer.destroy(); } catch (e) {} scanPeer = null; }
    if (peer) { try { peer.destroy(); } catch (e) {} }

    var rInfo = getRankInfo(userState.wins, userState.losses);
    var myNick = getMyNick(CAT_SKINS[userState.equippedCat].name.replace('(기본)', ''));
    lobbyStatus.innerText = "[" + code + "] 방에 접속 중...";
    peer = new Peer();

    peer.on('open', function() {
      conn = peer.connect(code);
      conn.on('open', function() {
        conn.send({
          type: 'hello',
          nick: myNick,
          tier: rInfo.tier,
          wins: userState.wins,
          losses: userState.losses,
          catSkin: userState.equippedCat,
          spikeSkin: userState.equippedSpike
        });

        conn.on('data', function(data) {
          if (data.type === 'role') {
            p1.name = data.p1Name || '크림냥';
            p1.tier = data.p1Tier || '🥉 브론즈';
            p1.skin = data.p1Skin || 'cream';
            ball.skin = data.ballSkin || 'classic';
            upsertKnownPlayer(p1.name, data.p1Wins || 0, data.p1Losses || 0);
            if (data.role === 'guest') {
              p2.name = myNick;
              p2.tier = rInfo.tier;
              p2.skin = userState.equippedCat;
              startMatch('guest');
            } else {
              p2.name = data.p2Name || '그레이냥';
              updateSpecBadge(data.specCount || 1);
              document.getElementById("spectatorInfo").innerText =
                "[" + p1.name + "] vs [" + p2.name + "] 실시간 대전을 관람 중입니다!";
              startMatch('spectator');
            }
          } else if (data.type === 'state') {
            p1.x = data.p1.x; p1.y = data.p1.y; p1.vx = data.p1.vx; p1.hitTimer = data.p1.ht; p1.squash = data.p1.sq; p1.name = data.p1.nm; p1.tier = data.p1.tr; p1.skin = data.p1.sk;
            p2.x = data.p2.x; p2.y = data.p2.y; p2.vx = data.p2.vx; p2.hitTimer = data.p2.ht; p2.squash = data.p2.sq; p2.name = data.p2.nm; p2.tier = data.p2.tr; p2.skin = data.p2.sk;
            ball.x = data.b.x; ball.y = data.b.y; ball.spikeType = data.b.st; ball.skin = data.b.sk;
            score1 = data.s1; score2 = data.s2;
            gameOver = data.go; winnerText = data.wt;
            if (gameOver && !matchRecorded && netMode === 'guest') {
              matchRecorded = true;
              recordMatchResult(score2 >= 15);
            }
            if (typeof data.wtm === 'number') worldTime = data.wtm;
            updateSpecBadge(data.sc || 0);
          } else if (data.type === 'reset') {
            gameOver = false; matchRecorded = false; particles = [];
          }
        });
      });

      conn.on('close', function() {
        returnToLobby("방장과의 연결이 종료되었습니다.");
      });
    });

    peer.on('error', function() {
      lobbyStatus.innerText = "방을 찾을 수 없습니다. 새로고침 후 다시 시도해 주세요.";
    });
  }

  var dpadArea = document.getElementById("dpadArea");
  var btnLeft = document.getElementById("btnLeft");
  var btnRight = document.getElementById("btnRight");

  function handleDpad(e) {
    e.preventDefault();
    if (gameState !== 'playing' || netMode === 'spectator') return;
    if (gameOver && (netMode === 'ai' || netMode === 'host')) { resetGame(); return; }
    var rect = dpadArea.getBoundingClientRect();
    var midX = rect.left + rect.width / 2;
    var leftActive = false;
    var rightActive = false;

    for (var i = 0; i < e.touches.length; i++) {
      var tx = e.touches[i].clientX;
      var ty = e.touches[i].clientY;
      if (tx >= rect.left - 20 && tx <= rect.right + 20 && ty >= rect.top - 20 && ty <= rect.bottom + 20) {
        if (tx < midX) leftActive = true;
        else rightActive = true;
      }
    }
    keys['ArrowLeft'] = leftActive;
    keys['ArrowRight'] = rightActive;
    btnLeft.classList.toggle('active', leftActive);
    btnRight.classList.toggle('active', rightActive);
  }

  dpadArea.addEventListener('touchstart', handleDpad, { passive: false });
  dpadArea.addEventListener('touchmove', handleDpad, { passive: false });
  dpadArea.addEventListener('touchend', handleDpad, { passive: false });
  dpadArea.addEventListener('touchcancel', handleDpad, { passive: false });

  function bindBtn(id, code) {
    var btn = document.getElementById(id);
    var down = function(e) {
      e.preventDefault();
      if (gameState !== 'playing' || netMode === 'spectator') return;
      if (gameOver && (netMode === 'ai' || netMode === 'host')) { resetGame(); return; }
      keys[code] = true;
      btn.classList.add('active');
    };
    var up = function(e) { e.preventDefault(); keys[code] = false; btn.classList.remove('active'); };
    btn.addEventListener('touchstart', down, {passive: false});
    btn.addEventListener('touchend', up, {passive: false});
    btn.addEventListener('touchcancel', up, {passive: false});
    btn.addEventListener('mousedown', down);
    btn.addEventListener('mouseup', up);
    btn.addEventListener('mouseleave', up);
  }
  bindBtn('btnLeft', 'ArrowLeft');
  bindBtn('btnRight', 'ArrowRight');
  bindBtn('btnJump', 'ArrowUp');
  bindBtn('btnSpike', 'Space');

  // --- 10. 게임 물리 및 스파이크 이펙트 업데이트 ---
  function update(dt) {
    updateEnvironment(dt);

    if (gameState !== 'playing') {
      p1.skin = userState.equippedCat;
      ball.skin = userState.equippedBall;
      return;
    }

    if (netMode === 'guest' || netMode === 'spectator') {
      if (netMode === 'guest' && conn && conn.open) {
        conn.send({
          type: 'keys',
          keys: {
            L: !!(keys["ArrowLeft"] || keys["KeyA"]),
            R: !!(keys["ArrowRight"] || keys["KeyD"]),
            U: !!(keys["ArrowUp"] || keys["KeyW"]),
            S: !!keys["Space"]
          }
        });
      }
      updateParticles(dt);
      return;
    }

    if (gameOver) return;
    if (p1.hitTimer > 0) p1.hitTimer -= dt;
    if (p2.hitTimer > 0) p2.hitTimer -= dt;

    var moveDir = 0;
    if (keys["ArrowLeft"] || keys["KeyA"]) moveDir -= 1;
    if (keys["ArrowRight"] || keys["KeyD"]) moveDir += 1;

    if (moveDir !== 0) {
      p1.vx += mul(moveDir, 1.4) * dt;
      if (p1.vx > p1.maxSpeed) p1.vx = p1.maxSpeed;
      if (p1.vx < -p1.maxSpeed) p1.vx = -p1.maxSpeed;
    } else {
      p1.vx = mul(p1.vx, Math.pow(0.76, dt));
      if (Math.abs(p1.vx) < 0.15) p1.vx = 0;
    }

    if ((keys["ArrowUp"] || keys["KeyW"]) && p1.y >= 340) {
      p1.vy = -10.8;
      p1.squash = 1.22;
    }

    var wasAir1 = p1.y < 340;
    p1.vy += mul(0.36, dt);
    p1.x += mul(p1.vx, dt);
    p1.y += mul(p1.vy, dt);

    if (p1.y >= 340) { p1.y = 340; if (wasAir1) p1.squash = 0.82; p1.vy = 0; }
    p1.squash += mul(1 - p1.squash, 0.2) * dt;
    if (p1.x < p1.r + 6) { p1.x = p1.r + 6; p1.vx = 0; }
    if (p1.x > 390 - p1.r) { p1.x = 390 - p1.r; p1.vx = 0; }

    if (netMode === 'host') {
      var p2Dir = 0;
      if (remoteKeys.L) p2Dir -= 1;
      if (remoteKeys.R) p2Dir += 1;
      if (p2Dir !== 0) {
        p2.vx += mul(p2Dir, 1.4) * dt;
        if (p2.vx > p2.maxSpeed) p2.vx = p2.maxSpeed;
        if (p2.vx < -p2.maxSpeed) p2.vx = -p2.maxSpeed;
      } else {
        p2.vx = mul(p2.vx, Math.pow(0.76, dt));
        if (Math.abs(p2.vx) < 0.15) p2.vx = 0;
      }
      if (remoteKeys.U && p2.y >= 340) { p2.vy = -10.8; p2.squash = 1.22; }
    } else {
      var aiMax = 4.5;
      var targetX = ball.x > 400 ? ball.x + 10 : 650;
      var diffX = targetX - p2.x;
      if (Math.abs(diffX) > 6) {
        var aiDir = diffX > 0 ? 1 : -1;
        p2.vx += mul(aiDir, 1.0) * dt;
        if (p2.vx > aiMax) p2.vx = aiMax;
        if (p2.vx < -aiMax) p2.vx = -aiMax;
      } else {
        p2.vx = mul(p2.vx, Math.pow(0.78, dt));
      }
      if (ball.x > 400 && ball.y < 250 && ball.vy > 0 && p2.y >= 340 && Math.abs(p2.x - ball.x) < 70) {
        p2.vy = -10.5;
        p2.squash = 1.22;
      }
    }

    var wasAir2 = p2.y < 340;
    p2.vy += mul(0.36, dt);
    p2.x += mul(p2.vx, dt);
    p2.y += mul(p2.vy, dt);

    if (p2.y >= 340) { p2.y = 340; if (wasAir2) p2.squash = 0.82; p2.vy = 0; }
    p2.squash += mul(1 - p2.squash, 0.2) * dt;
    if (p2.x < 410 + p2.r) { p2.x = 410 + p2.r; p2.vx = 0; }
    if (p2.x > 800 - p2.r - 6) { p2.x = 800 - p2.r - 6; p2.vx = 0; }

    ball.vy += mul(0.15, dt);
    ball.x += mul(ball.vx, dt);
    ball.y += mul(ball.vy, dt);

    updateParticles(dt);

    if (ball.x < ball.r) { ball.x = ball.r; ball.vx = -ball.vx; }
    if (ball.x > 800 - ball.r) { ball.x = 800 - ball.r; ball.vx = -ball.vx; }
    if (ball.y < ball.r) { ball.y = ball.r; ball.vy = -ball.vy; }

    if (ball.x + ball.r > 395 && ball.x - ball.r < 405 && ball.y + ball.r > 260) {
      if (ball.y < 275) { ball.y = 260 - ball.r; ball.vy = mul(ball.vy, -0.92); }
      else { ball.vx = mul(ball.vx, -0.85); ball.x = ball.x < 400 ? 395 - ball.r : 405 + ball.r; }
    }

    hitBall(p1, !!keys["Space"]);
    hitBall(p2, netMode === 'host' ? !!remoteKeys.S : false);

    if (ball.y > 430) {
      if (ball.x < 400) {
        score2++;
        if (score2 >= 15) {
          gameOver = true;
          winnerText = "🎉 " + p2.name + " 승리! (터치해 재시작)";
          if (!matchRecorded) { matchRecorded = true; recordMatchResult(false); }
        } else {
          ball.x = 580; ball.y = 140; ball.vx = -1.6; ball.vy = -2.2; ball.spikeType = 'none'; particles = [];
        }
      } else {
        score1++;
        if (score1 >= 15) {
          gameOver = true;
          winnerText = "🎉 " + p1.name + " 승리! (터치해 재시작)";
          if (!matchRecorded) { matchRecorded = true; recordMatchResult(true); }
        } else {
          ball.x = 220; ball.y = 140; ball.vx = 1.6; ball.vy = -2.2; ball.spikeType = 'none'; particles = [];
        }
      }
    }

    if (netMode === 'host') {
      broadcastToAll({
        type: 'state',
        p1: { x: p1.x, y: p1.y, vx: p1.vx, ht: p1.hitTimer, sq: p1.squash, nm: p1.name, tr: p1.tier, sk: p1.skin },
        p2: { x: p2.x, y: p2.y, vx: p2.vx, ht: p2.hitTimer, sq: p2.squash, nm: p2.name, tr: p2.tier, sk: p2.skin },
        b: { x: ball.x, y: ball.y, st: ball.spikeType, sk: ball.skin },
        s1: score1, s2: score2, go: gameOver, wt: winnerText,
        sc: spectatorConns.length,
        wtm: worldTime
      });
    }
  }

  // 스파이크 종류(바람 / 메테오 / 번개 / 얼음 / 벚꽃 / 블랙홀)별 전용 파티클 생성
  function updateParticles(dt) {
    if (ball.spikeType !== 'none' && particles.length < 40) {
      var pColor = '#ffffff';
      var pKind = 'circle';
      var pSize = mul(Math.random(), 6) + 4;

      if (ball.spikeType === 'wind') {
        pColor = Math.random() > 0.4 ? 'rgba(255,255,255,0.85)' : 'rgba(186,230,253,0.85)';
        pKind = 'wind';
        pSize = mul(Math.random(), 5) + 5;
      } else if (ball.spikeType === 'meteor') {
        pColor = Math.random() > 0.45 ? '#f97316' : '#facc15';
        pKind = 'circle';
        pSize = mul(Math.random(), 8) + 4;
      } else if (ball.spikeType === 'lightning') {
        pColor = Math.random() > 0.4 ? '#38bdf8' : '#fef08a';
        pKind = 'bolt';
      } else if (ball.spikeType === 'ice') {
        pColor = Math.random() > 0.4 ? '#bae6fd' : '#ffffff';
        pKind = 'crystal';
      } else if (ball.spikeType === 'sakura') {
        pColor = Math.random() > 0.4 ? '#f9a8d4' : '#fbcfe8';
        pKind = 'petal';
      } else if (ball.spikeType === 'blackhole') {
        pColor = Math.random() > 0.4 ? '#a855f7' : '#312e81';
        pKind = 'void';
      }

      particles.push({
        x: ball.x + mul(Math.random() - 0.5, 20),
        y: ball.y + mul(Math.random() - 0.5, 20),
        vx: mul(Math.random() - 0.5, 3.0) - mul(ball.vx, 0.25),
        vy: mul(Math.random() - 0.5, 3.0) - mul(ball.vy, 0.25),
        size: pSize,
        color: pColor,
        kind: pKind,
        life: 20
      });
    }
    for (var i = particles.length - 1; i >= 0; i--) {
      var pt = particles[i];
      pt.x += mul(pt.vx, dt);
      pt.y += mul(pt.vy, dt);
      pt.life -= dt;
      if (pt.life <= 0) particles.splice(i, 1);
    }
  }

  function hitBall(p, isSpike) {
    var dx = ball.x - p.x, dy = ball.y - p.y;
    var dist = Math.hypot(dx, dy);
    if (dist < ball.r + p.r + 6 && dist > 0) {
      var overlap = (ball.r + p.r + 6) - dist;
      ball.x += mul(dx / dist, overlap);
      ball.y += mul(dy / dist, overlap);
      p.hitTimer = 18;
      p.squash = 1.15;
      var angle = Math.atan2(dy, dx);
      if (isSpike) {
        ball.spikeType = p.spikeSkin || 'wind';
        ball.vx = mul(Math.cos(angle), 12.2) + mul(p.vx, 0.3);
        ball.vy = mul(Math.sin(angle), 12.2) - 3.5;
      } else {
        ball.spikeType = 'none';
        ball.vx = mul(Math.cos(angle), 6.5) + mul(p.vx, 0.25);
        ball.vy = mul(Math.sin(angle), 6.5) - 2.4;
      }
    }
  }

  // --- 11. 캐릭터 / 공 / 이펙트 그리기 ---
  function traceCatHeadPath(isSimple) {
    ctx.beginPath();
    if (isSimple) {
      ctx.arc(0, -2, 26, 0, TAU);
    } else {
      ctx.moveTo(0, -25);
      ctx.bezierCurveTo(18, -25, 29, -15, 29, 2);
      ctx.bezierCurveTo(29, 16, 17, 22, 0, 22);
      ctx.bezierCurveTo(-17, 22, -29, 16, -29, 2);
      ctx.bezierCurveTo(-29, -15, -18, -25, 0, -25);
      ctx.closePath();
    }
  }

  function drawChar(p) {
    var sk = CAT_SKINS[p.skin] || CAT_SKINS.cream;
    var isSimple = sk.simple;

    // 닉네임 + 랭크 티어 이름표
    ctx.save();
    var labelStr = p.tier ? (p.tier + " " + p.name) : p.name;
    ctx.font = 'bold 12px sans-serif';
    var nameWidth = ctx.measureText(labelStr).width + 14;
    ctx.fillStyle = 'rgba(15, 23, 42, 0.8)';
    ctx.beginPath();
    ctx.roundRect(p.x - nameWidth / 2, p.y - 72, nameWidth, 21, 8);
    ctx.fill();
    ctx.fillStyle = p.side === 1 ? '#fde047' : '#e0f2fe';
    ctx.textAlign = 'center';
    ctx.fillText(labelStr, p.x, p.y - 57);
    ctx.restore();

    ctx.save();
    ctx.translate(p.x, p.y + 32);
    ctx.scale(2 - p.squash, p.squash);
    ctx.translate(0, -32);

    var dir = p.side === 1 ? 1 : -1;
    var speedRatio = Math.abs(p.vx) / p.maxSpeed;
    var time = performance.now();

    // 1. 꼬리
    var tailWag = mul(Math.sin(mul(time, 0.008)), 6);
    ctx.lineCap = 'round';
    ctx.strokeStyle = '#0f172a';
    ctx.lineWidth = isSimple ? 8 : 10;
    ctx.beginPath();
    ctx.moveTo(mul(-dir, 12), 17);
    ctx.quadraticCurveTo(mul(-dir, 36), 2 + tailWag, mul(-dir, 28), -18 + tailWag);
    ctx.stroke();

    ctx.strokeStyle = (sk.id === 'persian') ? '#bae6fd' : (sk.id === 'siamese' ? '#4e342e' : sk.color);
    ctx.lineWidth = isSimple ? 4.5 : 6;
    ctx.stroke();

    if (sk.id === 'persian' || sk.id === 'calico') {
      ctx.fillStyle = sk.id === 'persian' ? '#0f172a' : '#ea580c';
      ctx.beginPath();
      ctx.arc(mul(-dir, 28), -18 + tailWag, 4.5, 0, TAU);
      ctx.fill();
    }

    // 2. 몸통
    ctx.fillStyle = sk.color;
    ctx.beginPath();
    ctx.ellipse(0, 17, 16, 13, 0, 0, TAU);
    ctx.fill();
    ctx.lineWidth = 2.5;
    ctx.strokeStyle = '#0f172a';
    ctx.stroke();

    if (!isSimple) {
      if (sk.id === 'persian') {
        ctx.fillStyle = '#bae6fd';
        ctx.beginPath(); ctx.ellipse(mul(-dir, 4), 19, 10, 8, 0, 0, TAU); ctx.fill();
      } else if (sk.id === 'calico') {
        ctx.fillStyle = '#1e293b';
        ctx.beginPath(); ctx.arc(mul(-dir, 6), 16, 6, 0, TAU); ctx.fill();
      }
      ctx.fillStyle = sk.stripe;
      ctx.beginPath();
      ctx.roundRect(mul(dir, 3), 12, 3.8, 8.5, 2);
      ctx.roundRect(mul(dir, 8.5), 14, 3.8, 6.5, 2);
      ctx.fill();
    }

    // 3. 앞발
    var paw = mul(Math.sin(mul(time, 0.022)), mul(4.2, speedRatio));
    ctx.fillStyle = (sk.id === 'persian' || sk.id === 'siamese') ? '#3e2723' : '#ffffff';
    ctx.strokeStyle = '#0f172a';
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(-8, 28 + paw, 5, 0, TAU); ctx.fill(); ctx.stroke();
    ctx.beginPath(); ctx.arc(8, 28 - paw, 5, 0, TAU); ctx.fill(); ctx.stroke();

    // 4. 귀
    var leftEarColor = (sk.id === 'persian') ? '#334155' : (sk.id === 'siamese' ? '#4e342e' : (sk.id === 'calico' ? '#ea580c' : sk.color));
    var rightEarColor = (sk.id === 'persian') ? '#334155' : (sk.id === 'siamese' ? '#4e342e' : (sk.id === 'calico' ? '#1e293b' : sk.color));

    if (isSimple) {
      ctx.fillStyle = sk.color;
      ctx.strokeStyle = '#0f172a';
      ctx.lineWidth = 2.4;
      ctx.beginPath(); ctx.moveTo(-21, -12); ctx.lineTo(-18, -34); ctx.lineTo(-6, -22); ctx.closePath(); ctx.fill(); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(21, -12); ctx.lineTo(18, -34); ctx.lineTo(6, -22); ctx.closePath(); ctx.fill(); ctx.stroke();
    } else {
      ctx.fillStyle = leftEarColor;
      ctx.strokeStyle = '#0f172a';
      ctx.lineWidth = 2.4;
      ctx.beginPath();
      ctx.moveTo(-23, -10); ctx.quadraticCurveTo(-26, -34, -20, -36); ctx.quadraticCurveTo(-13, -37, -7, -21); ctx.closePath(); ctx.fill(); ctx.stroke();
      ctx.fillStyle = sk.earInner;
      ctx.beginPath();
      ctx.moveTo(-20, -14); ctx.quadraticCurveTo(-22, -29, -18.5, -31); ctx.quadraticCurveTo(-15, -31, -11, -20); ctx.closePath(); ctx.fill();

      ctx.fillStyle = rightEarColor;
      ctx.beginPath();
      ctx.moveTo(23, -10); ctx.quadraticCurveTo(26, -34, 20, -36); ctx.quadraticCurveTo(13, -37, 7, -21); ctx.closePath(); ctx.fill(); ctx.stroke();
      ctx.fillStyle = sk.earInner;
      ctx.beginPath();
      ctx.moveTo(20, -14); ctx.quadraticCurveTo(22, -29, 18.5, -31); ctx.quadraticCurveTo(15, -31, 11, -20); ctx.closePath(); ctx.fill();
    }

    // 5. 머리
    ctx.fillStyle = sk.color;
    traceCatHeadPath(isSimple);
    ctx.fill();

    if (!isSimple) {
      ctx.save();
      traceCatHeadPath(false);
      ctx.clip();

      if (sk.id === 'persian') {
        ctx.fillStyle = '#bae6fd';
        ctx.beginPath(); ctx.ellipse(0, -17, 27, 13, 0, 0, TAU); ctx.fill();
        ctx.fillStyle = '#e0f2fe';
        ctx.beginPath(); ctx.arc(-22, 6, 10, 0, TAU); ctx.arc(22, 6, 10, 0, TAU); ctx.fill();
      } else if (sk.id === 'calico') {
        // 삼색냥 얼룩 패치
        ctx.fillStyle = '#ea580c';
        ctx.beginPath(); ctx.arc(-18, -14, 15, 0, TAU); ctx.fill();
        ctx.fillStyle = '#1e293b';
        ctx.beginPath(); ctx.arc(20, -12, 14, 0, TAU); ctx.fill();
      } else if (sk.id === 'siamese') {
        // 샴냥 특유의 코·입 주변 짙은 초코 포인트 마스크
        ctx.fillStyle = '#5d4037';
        ctx.beginPath(); ctx.ellipse(dir * 2, 3, 15, 11, 0, 0, TAU); ctx.fill();
      } else {
        ctx.fillStyle = sk.light;
        ctx.beginPath(); ctx.ellipse(-6, -15, 13, 6, -0.25, 0, TAU); ctx.fill();
      }

      // 이마 & 볼 줄무늬
      if (sk.id !== 'siamese') {
        ctx.fillStyle = sk.stripe;
        ctx.beginPath();
        ctx.roundRect(-7, -26, 2.8, 9, 1.5);
        ctx.roundRect(-1.4, -26, 2.8, 11, 1.5);
        ctx.roundRect(4.2, -26, 2.8, 9, 1.5);
        ctx.roundRect(-30, -1, 8.5, 2.5, 1.2);
        ctx.roundRect(-30, 3.5, 7.5, 2.5, 1.2);
        ctx.roundRect(21.5, -1, 8.5, 2.5, 1.2);
        ctx.roundRect(22.5, 3.5, 7.5, 2.5, 1.2);
        ctx.fill();
      }
      ctx.restore();
    }

    ctx.lineWidth = 2.6;
    ctx.strokeStyle = '#0f172a';
    traceCatHeadPath(isSimple);
    ctx.stroke();

    // 황금냥 전용 미니 왕관 장식
    if (sk.id === 'gold') {
      ctx.fillStyle = '#fef08a';
      ctx.strokeStyle = '#854d0e';
      ctx.lineWidth = 1.6;
      ctx.beginPath();
      ctx.moveTo(-9, -24);
      ctx.lineTo(-11, -35);
      ctx.lineTo(-4, -29);
      ctx.lineTo(0, -37);
      ctx.lineTo(4, -29);
      ctx.lineTo(11, -35);
      ctx.lineTo(9, -24);
      ctx.closePath();
      ctx.fill();
      ctx.stroke();
    }

    // 6. 볼터치
    ctx.fillStyle = 'rgba(244, 63, 94, 0.35)';
    ctx.beginPath();
    ctx.ellipse(-15, 4, 4.5, 3, 0, 0, TAU);
    ctx.ellipse(15, 4, 4.5, 3, 0, 0, TAU);
    ctx.fill();

    // 7. 눈
    var isBlackCat = (sk.id === 'black');
    var isSiamese = (sk.id === 'siamese');
    if (p.hitTimer > 0) {
      ctx.strokeStyle = (isBlackCat || isSiamese) ? '#fde047' : '#0f172a';
      ctx.lineWidth = 2.6;
      ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(-12, -4); ctx.lineTo(-8, -7.5); ctx.lineTo(-4, -4);
      ctx.moveTo(4, -4); ctx.lineTo(8, -7.5); ctx.lineTo(12, -4);
      ctx.stroke();
    } else {
      var eyeX1 = -8.5 + dir;
      var eyeX2 = 8.5 + dir;
      ctx.fillStyle = isBlackCat ? '#facc15' : (isSiamese ? '#38bdf8' : '#0f172a');
      ctx.beginPath();
      ctx.ellipse(eyeX1, -2.5, 3.8, 4.4, 0, 0, TAU);
      ctx.ellipse(eyeX2, -2.5, 3.8, 4.4, 0, 0, TAU);
      ctx.fill();

      if (isBlackCat || isSiamese) {
        ctx.fillStyle = '#0f172a';
        ctx.beginPath();
        ctx.ellipse(eyeX1, -2.5, 1.4, 3.5, 0, 0, TAU);
        ctx.ellipse(eyeX2, -2.5, 1.4, 3.5, 0, 0, TAU);
        ctx.fill();
      }

      ctx.fillStyle = '#ffffff';
      ctx.beginPath();
      ctx.arc(eyeX1 - 1.2, -4, 1.5, 0, TAU);
      ctx.arc(eyeX2 - 1.2, -4, 1.5, 0, TAU);
      ctx.fill();
    }

    // 8. 코 & 입
    var noseX = dir;
    ctx.fillStyle = '#fb7185';
    ctx.beginPath();
    ctx.ellipse(noseX, 2.5, 2.5, 1.8, 0, 0, TAU);
    ctx.fill();

    ctx.strokeStyle = (isBlackCat || isSiamese) ? '#f8fafc' : '#0f172a';
    ctx.lineWidth = 1.6;
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.arc(noseX - 2.6, 5.2, 2.5, 0.15, 2.9);
    ctx.stroke();
    ctx.beginPath();
    ctx.arc(noseX + 2.6, 5.2, 2.5, 0.25, 3.0);
    ctx.stroke();

    ctx.restore();
  }

  function drawBall() {
    ctx.save();
    ctx.translate(ball.x, ball.y);

    // 스파이크 상태일 때 공 주변 오라 광채
    if (ball.spikeType === 'wind') {
      ctx.strokeStyle = 'rgba(255, 255, 255, 0.6)';
      ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(0, 0, ball.r + 5, 0, TAU); ctx.stroke();
    } else if (ball.spikeType === 'meteor') {
      ctx.fillStyle = 'rgba(249, 115, 22, 0.42)';
      ctx.beginPath(); ctx.arc(0, 0, ball.r + 8, 0, TAU); ctx.fill();
    } else if (ball.spikeType === 'lightning') {
      ctx.fillStyle = 'rgba(56, 189, 248, 0.42)';
      ctx.beginPath(); ctx.arc(0, 0, ball.r + 8, 0, TAU); ctx.fill();
    } else if (ball.spikeType === 'ice') {
      ctx.fillStyle = 'rgba(186, 230, 253, 0.45)';
      ctx.beginPath(); ctx.arc(0, 0, ball.r + 8, 0, TAU); ctx.fill();
    } else if (ball.spikeType === 'sakura') {
      ctx.fillStyle = 'rgba(244, 114, 182, 0.38)';
      ctx.beginPath(); ctx.arc(0, 0, ball.r + 8, 0, TAU); ctx.fill();
    } else if (ball.spikeType === 'blackhole') {
      ctx.fillStyle = 'rgba(88, 28, 135, 0.55)';
      ctx.beginPath(); ctx.arc(0, 0, ball.r + 10, 0, TAU); ctx.fill();
    }

    // 공 스킨 클리핑 내부 그리기
    ctx.beginPath();
    ctx.arc(0, 0, ball.r, 0, TAU);
    ctx.clip();

    if (ball.skin === 'watermelon') {
      ctx.fillStyle = '#22c55e';
      ctx.fillRect(-ball.r, -ball.r, ball.r * 2, ball.r * 2);
      ctx.strokeStyle = '#14532d';
      ctx.lineWidth = 4;
      ctx.beginPath();
      ctx.moveTo(-10, -20); ctx.quadraticCurveTo(-4, 0, -10, 20);
      ctx.moveTo(0, -20);   ctx.quadraticCurveTo(0, 0, 0, 20);
      ctx.moveTo(10, -20);  ctx.quadraticCurveTo(4, 0, 10, 20);
      ctx.stroke();
    } else if (ball.skin === 'rainbow') {
      var rGrad = ctx.createLinearGradient(-ball.r, -ball.r, ball.r, ball.r);
      rGrad.addColorStop(0, '#f43f5e');
      rGrad.addColorStop(0.25, '#f59e0b');
      rGrad.addColorStop(0.5, '#eab308');
      rGrad.addColorStop(0.75, '#22c55e');
      rGrad.addColorStop(1, '#3b82f6');
      ctx.fillStyle = rGrad;
      ctx.fillRect(-ball.r, -ball.r, ball.r * 2, ball.r * 2);
    } else if (ball.skin === 'soccer') {
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(-ball.r, -ball.r, ball.r * 2, ball.r * 2);
      ctx.fillStyle = '#0f172a';
      ctx.beginPath(); ctx.arc(0, 0, 6.5, 0, TAU); ctx.fill();
      ctx.beginPath(); ctx.arc(-15, -10, 5, 0, TAU); ctx.fill();
      ctx.beginPath(); ctx.arc(15, -10, 5, 0, TAU); ctx.fill();
      ctx.beginPath(); ctx.arc(-12, 14, 5, 0, TAU); ctx.fill();
      ctx.beginPath(); ctx.arc(12, 14, 5, 0, TAU); ctx.fill();
    } else if (ball.skin === 'paw') {
      ctx.fillStyle = '#fce7f3';
      ctx.fillRect(-ball.r, -ball.r, ball.r * 2, ball.r * 2);
      ctx.fillStyle = '#f43f5e';
      ctx.beginPath(); ctx.ellipse(0, 4, 6.5, 5, 0, 0, TAU); ctx.fill();
      ctx.beginPath(); ctx.arc(-7, -4, 2.7, 0, TAU); ctx.fill();
      ctx.beginPath(); ctx.arc(-2.5, -7, 2.7, 0, TAU); ctx.fill();
      ctx.beginPath(); ctx.arc(2.5, -7, 2.7, 0, TAU); ctx.fill();
      ctx.beginPath(); ctx.arc(7, -4, 2.7, 0, TAU); ctx.fill();
    } else if (ball.skin === 'golden') {
      var gGrad = ctx.createRadialGradient(-5, -5, 2, 0, 0, ball.r);
      gGrad.addColorStop(0, '#fef9c3');
      gGrad.addColorStop(0.5, '#facc15');
      gGrad.addColorStop(1, '#ca8a04');
      ctx.fillStyle = gGrad;
      ctx.fillRect(-ball.r, -ball.r, ball.r * 2, ball.r * 2);
    } else {
      ctx.fillStyle = '#facc15';
      ctx.fillRect(-ball.r, -ball.r, ball.r * 2, ball.r * 2);
      ctx.strokeStyle = '#ca8a04';
      ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(-7, 0, 15, -1.1, 1.1); ctx.stroke();
      ctx.beginPath(); ctx.arc(7, 0, 15, 2.0, 4.2); ctx.stroke();
    }

    // 스파이크 오버레이 색조
    if (ball.spikeType === 'meteor') {
      ctx.fillStyle = 'rgba(239, 68, 68, 0.58)';
      ctx.fillRect(-ball.r, -ball.r, ball.r * 2, ball.r * 2);
    } else if (ball.spikeType === 'lightning') {
      ctx.fillStyle = 'rgba(56, 189, 248, 0.52)';
      ctx.fillRect(-ball.r, -ball.r, ball.r * 2, ball.r * 2);
    } else if (ball.spikeType === 'ice') {
      ctx.fillStyle = 'rgba(224, 242, 254, 0.65)';
      ctx.fillRect(-ball.r, -ball.r, ball.r * 2, ball.r * 2);
    } else if (ball.spikeType === 'sakura') {
      ctx.fillStyle = 'rgba(244, 114, 182, 0.45)';
      ctx.fillRect(-ball.r, -ball.r, ball.r * 2, ball.r * 2);
    } else if (ball.spikeType === 'blackhole') {
      ctx.fillStyle = 'rgba(15, 23, 42, 0.78)';
      ctx.fillRect(-ball.r, -ball.r, ball.r * 2, ball.r * 2);
    }

    ctx.restore();

    // 공 테두리
    ctx.save();
    ctx.translate(ball.x, ball.y);
    ctx.beginPath();
    ctx.arc(0, 0, ball.r, 0, TAU);
    ctx.lineWidth = 3;
    var strokeCol = '#0f172a';
    if (ball.spikeType === 'meteor') strokeCol = '#b91c1c';
    else if (ball.spikeType === 'lightning') strokeCol = '#0284c7';
    else if (ball.spikeType === 'ice') strokeCol = '#7dd3fc';
    else if (ball.spikeType === 'sakura') strokeCol = '#db2777';
    else if (ball.spikeType === 'blackhole') strokeCol = '#a855f7';
    ctx.strokeStyle = strokeCol;
    ctx.stroke();
    ctx.restore();
  }

  function drawHeroCat(x, y) {
    ctx.save();
    ctx.translate(x, y);
    var wave = Math.sin(mul(performance.now(), 0.015));

    ctx.fillStyle = '#10b981';
    ctx.strokeStyle = '#064e3b';
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.moveTo(-6, -4);
    ctx.quadraticCurveTo(-28, -12 + mul(wave, 5), -44, -4 + mul(wave, 7));
    ctx.lineTo(-40, 8 + mul(wave, 5));
    ctx.quadraticCurveTo(-22, 4, -6, 3);
    ctx.closePath();
    ctx.fill();
    ctx.stroke();

    ctx.fillStyle = '#f8fafc';
    ctx.strokeStyle = '#0f172a';
    ctx.beginPath();
    ctx.roundRect(-24, -4, 24, 9, 4);
    ctx.fill();
    ctx.stroke();

    ctx.fillStyle = '#facc15';
    ctx.beginPath();
    ctx.arc(-10, 0.5, 2.5, 0, TAU);
    ctx.fill();

    ctx.fillStyle = '#fde68a';
    ctx.beginPath();
    ctx.moveTo(0, -7); ctx.lineTo(3, -15); ctx.lineTo(7, -8);
    ctx.moveTo(6, -7); ctx.lineTo(10, -15); ctx.lineTo(13, -6);
    ctx.fill();
    ctx.beginPath();
    ctx.arc(7, -2, 8.5, 0, TAU);
    ctx.fill();
    ctx.stroke();

    ctx.fillStyle = '#0f172a';
    ctx.beginPath();
    ctx.arc(11, -3, 1.8, 0, TAU);
    ctx.fill();
    ctx.restore();
  }

  function drawBackground() {
    var pal = getSkyPalette();
    var sky = ctx.createLinearGradient(0, 0, 0, 380);
    sky.addColorStop(0, pal.top);
    sky.addColorStop(1, pal.bot);
    ctx.fillStyle = sky;
    ctx.fillRect(0, 0, 800, 450);

    var nightAlpha = 0;
    if (worldTime >= 0.46 && worldTime < 0.54) nightAlpha = (worldTime - 0.46) / 0.08;
    else if (worldTime >= 0.54 && worldTime <= 0.78) nightAlpha = 1;
    else if (worldTime > 0.78 && worldTime <= 0.86) nightAlpha = 1 - (worldTime - 0.78) / 0.08;

    if (nightAlpha > 0) {
      ctx.save();
      var now = performance.now();
      for (var i = 0; i < stars.length; i++) {
        var st = stars[i];
        var twinkle = 0.45 + mul(0.55, Math.abs(Math.sin(mul(now, 0.003) + st.phase)));
        ctx.fillStyle = "rgba(255, 255, 255, " + mul(nightAlpha, twinkle).toFixed(2) + ")";
        ctx.beginPath(); ctx.arc(st.x, st.y, st.r, 0, TAU); ctx.fill();
      }
      ctx.globalAlpha = nightAlpha;
      ctx.fillStyle = '#fef08a';
      ctx.beginPath(); ctx.arc(675, 78, 22, 0, TAU); ctx.fill();
      ctx.fillStyle = pal.top;
      ctx.beginPath(); ctx.arc(684, 72, 19, 0, TAU); ctx.fill();
      ctx.restore();
    }

    if (shootingStar.active) {
      ctx.save();
      var grad = ctx.createLinearGradient(shootingStar.x, shootingStar.y, shootingStar.x + 55, shootingStar.y - 25);
      grad.addColorStop(0, 'rgba(255, 255, 255, 0.95)');
      grad.addColorStop(1, 'rgba(255, 255, 255, 0)');
      ctx.strokeStyle = grad; ctx.lineWidth = 2.5; ctx.lineCap = 'round';
      ctx.beginPath(); ctx.moveTo(shootingStar.x, shootingStar.y); ctx.lineTo(shootingStar.x + 55, shootingStar.y - 25); ctx.stroke();
      ctx.fillStyle = '#ffffff';
      ctx.beginPath(); ctx.arc(shootingStar.x, shootingStar.y, 2.5, 0, TAU); ctx.fill();
      ctx.restore();
    }

    if (worldTime <= 0.50) {
      var sunProg = worldTime / 0.50;
      var sunX = lerp(95, 705, sunProg);
      var sunY = 75 + mul(Math.pow(sunProg, 2.2), 295);
      var isSunset = worldTime > 0.34;
      ctx.save();
      ctx.fillStyle = isSunset ? 'rgba(251, 146, 60, 0.35)' : 'rgba(253, 224, 71, 0.28)';
      ctx.beginPath(); ctx.arc(sunX, sunY, isSunset ? 42 : 34, 0, TAU); ctx.fill();
      ctx.fillStyle = isSunset ? '#fb7185' : '#fde047';
      ctx.beginPath(); ctx.arc(sunX, sunY, isSunset ? 28 : 22, 0, TAU); ctx.fill();
      ctx.restore();
    }

    var cloudAlpha = nightAlpha > 0 ? lerp(0.7, 0.16, nightAlpha) : 0.72;
    ctx.fillStyle = worldTime > 0.35 && worldTime < 0.50
      ? "rgba(254, 215, 170, 0.68)"
      : "rgba(255, 255, 255, " + cloudAlpha.toFixed(2) + ")";
    for (var c = 0; c < clouds.length; c++) {
      var cl = clouds[c];
      ctx.save(); ctx.translate(cl.x, cl.y); ctx.scale(cl.s, cl.s);
      ctx.beginPath(); ctx.arc(-28, 4, 24, 0, TAU); ctx.arc(0, -6, 34, 0, TAU); ctx.arc(30, 6, 22, 0, TAU); ctx.fill();
      ctx.restore();
    }

    for (var b = 0; b < birds.length; b++) {
      var bd = birds[b];
      if (bd.x > -40 && bd.x < 840) {
        var wingY = mul(Math.sin(bd.phase), 5);
        ctx.strokeStyle = 'rgba(15, 23, 42, 0.72)'; ctx.lineWidth = 2; ctx.lineCap = 'round';
        ctx.beginPath();
        ctx.moveTo(bd.x - 8, bd.y + wingY);
        ctx.quadraticCurveTo(bd.x - 4, bd.y - 4, bd.x, bd.y);
        ctx.quadraticCurveTo(bd.x + 4, bd.y - 4, bd.x + 8, bd.y + wingY);
        ctx.stroke();
      }
    }

    if (heroCat.active) drawHeroCat(heroCat.x, heroCat.y);

    ctx.fillStyle = pal.sand;
    ctx.fillRect(0, 380, 800, 70);
    ctx.fillStyle = pal.line;
    ctx.fillRect(0, 380, 800, 6);
  }

  function draw() {
    drawBackground();

    ctx.fillStyle = 'rgba(255,255,255,0.85)'; ctx.font = 'bold 11px sans-serif'; ctx.textAlign = 'right';
    ctx.fillText("제작: GCK", 775, 30);

    ctx.fillStyle = '#fff'; ctx.fillRect(396, 260, 8, 120);
    ctx.fillStyle = 'rgba(15,23,42,0.85)'; ctx.strokeStyle = '#38bdf8'; ctx.lineWidth = 2;
    ctx.fillRect(320, 15, 160, 45); ctx.strokeRect(320, 15, 160, 45);

    ctx.fillStyle = '#fff'; ctx.font = 'bold 22px sans-serif'; ctx.textAlign = 'center';
    ctx.fillText(score1 + "   VS   " + score2, 400, 44);

    drawChar(p1); drawChar(p2);

    // 스파이크 파티클 렌더링 (바람 / 메테오 / 번개 / 얼음 / 벚꽃 / 블랙홀)
    for (var i = 0; i < particles.length; i++) {
      var pt = particles[i];
      ctx.save();
      if (pt.kind === 'wind') {
        ctx.strokeStyle = pt.color;
        ctx.lineWidth = 2;
        ctx.lineCap = 'round';
        ctx.beginPath();
        ctx.moveTo(pt.x - pt.size, pt.y);
        ctx.lineTo(pt.x + pt.size, pt.y);
        ctx.stroke();
      } else if (pt.kind === 'bolt') {
        ctx.strokeStyle = pt.color;
        ctx.lineWidth = 2.2;
        ctx.beginPath();
        ctx.moveTo(pt.x - 6, pt.y - 4);
        ctx.lineTo(pt.x, pt.y);
        ctx.lineTo(pt.x - 3, pt.y + 4);
        ctx.lineTo(pt.x + 6, pt.y + 7);
        ctx.stroke();
      } else if (pt.kind === 'crystal') {
        ctx.strokeStyle = pt.color;
        ctx.lineWidth = 2;
        var sz = pt.size * 0.8;
        ctx.beginPath();
        ctx.moveTo(pt.x - sz, pt.y); ctx.lineTo(pt.x + sz, pt.y);
        ctx.moveTo(pt.x, pt.y - sz); ctx.lineTo(pt.x, pt.y + sz);
        ctx.stroke();
      } else if (pt.kind === 'petal') {
        ctx.fillStyle = pt.color;
        ctx.beginPath();
        ctx.ellipse(pt.x, pt.y, pt.size * 0.7, pt.size * 0.4, pt.life * 0.2, 0, TAU);
        ctx.fill();
      } else if (pt.kind === 'void') {
        ctx.strokeStyle = pt.color;
        ctx.lineWidth = 2.2;
        ctx.beginPath();
        ctx.arc(pt.x, pt.y, pt.size * 0.85, 0, TAU);
        ctx.stroke();
      } else {
        // 메테오(운석 불꽃)
        ctx.fillStyle = pt.color;
        ctx.beginPath();
        ctx.arc(pt.x, pt.y, pt.size, 0, TAU);
        ctx.fill();
      }
      ctx.restore();
    }

    drawBall();

    if (gameOver) {
      ctx.fillStyle = 'rgba(0,0,0,0.85)'; ctx.fillRect(0, 0, 800, 450);
      ctx.fillStyle = '#fff'; ctx.font = 'bold 25px sans-serif';
      ctx.fillText(winnerText, 400, 225);
    }
  }

  function loop(now) {
    var dt = (now - lastTime) / 16.666;
    if (dt > 2.5) dt = 2.5;
    lastTime = now;

    update(dt);
    draw();
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
};
</script>
</body>
</html>
