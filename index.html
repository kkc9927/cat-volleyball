<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Cat Volleyball Online & Lobby List</title>
<script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
<style>
* { box-sizing: border-box; user-select: none; -webkit-user-select: none; }
body { background: #0f172a; color: #fff; text-align: center; font-family: sans-serif; margin: 0; padding: 8px; display: flex; flex-direction: column; align-items: center; justify-content: space-between; height: 100dvh; overflow: hidden; touch-action: none; }

/* 상단 헤더 바 */
.top-bar { width: 100%; max-width: 800px; display: flex; justify-content: space-between; align-items: center; padding: 2px 4px; gap: 6px; }
h1 { font-size: 1rem; margin: 0; white-space: nowrap; }
.top-right { display: flex; align-items: center; gap: 6px; }
.spec-badge { background: rgba(168, 85, 247, 0.25); border: 1.5px solid #c084fc; color: #e9d5ff; border-radius: 8px; padding: 4px 8px; font-size: 0.78rem; font-weight: bold; display: none; }
.home-btn { background: #334155; color: #fff; border: 1.5px solid #64748b; border-radius: 8px; padding: 5px 10px; font-size: 0.8rem; font-weight: bold; cursor: pointer; }
.home-btn:active { background: #475569; }

/* 게임 캔버스 래퍼 */
.game-wrapper { position: relative; width: 100%; max-width: 800px; max-height: 58dvh; aspect-ratio: 800 / 450; }
canvas { border: 3px solid #fff; border-radius: 10px; width: 100%; height: 100%; display: block; background: #0284c7; transform: translateZ(0); }

/* 메인 대기화면(로비) 오버레이 */
.lobby-overlay {
  position: absolute;
  inset: 0;
  background: rgba(15, 23, 42, 0.88);
  backdrop-filter: blur(4px);
  border-radius: 10px;
  border: 3px solid #38bdf8;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 10px 12px;
  z-index: 10;
}
.lobby-title { font-size: 1.18rem; font-weight: bold; color: #fde047; margin-bottom: 8px; text-shadow: 0 2px 6px rgba(0,0,0,0.6); }
.menu-box { width: 100%; max-width: 350px; display: flex; flex-direction: column; gap: 7px; }

/* 닉네임 입력 칸 */
.nick-row { display: flex; align-items: center; gap: 6px; background: #1e293b; border: 1.5px solid #38bdf8; border-radius: 10px; padding: 3px 10px; }
.nick-label { font-size: 0.8rem; color: #7dd3fc; font-weight: bold; white-space: nowrap; }
.nick-input {
  flex: 1;
  background: transparent;
  border: none;
  color: #fff;
  font-size: 0.9rem;
  font-weight: bold;
  padding: 4px;
  outline: none;
  user-select: text;
  -webkit-user-select: text;
}

.menu-btn {
  width: 100%;
  padding: 9px 12px;
  border-radius: 11px;
  border: none;
  font-size: 0.92rem;
  font-weight: bold;
  color: #fff;
  cursor: pointer;
  box-shadow: 0 4px 10px rgba(0,0,0,0.3);
}
.menu-btn:active { transform: scale(0.97); }
.btn-ai { background: linear-gradient(135deg, #0284c7, #0369a1); border: 1.5px solid #7dd3fc; }
.btn-create { background: linear-gradient(135deg, #ea580c, #c2410c); border: 1.5px solid #fdba74; }
.btn-list { background: linear-gradient(135deg, #16a34a, #15803d); border: 1.5px solid #86efac; }

/* 방 리스트 패널 */
.list-panel { display: none; flex-direction: column; align-items: center; gap: 6px; width: 100%; max-width: 360px; }
.room-list-box {
  width: 100%;
  max-height: 115px;
  overflow-y: auto;
  background: rgba(30, 41, 59, 0.92);
  border: 1.5px solid #475569;
  border-radius: 10px;
  padding: 5px;
  display: flex;
  flex-direction: column;
  gap: 5px;
}
.room-item {
  display: flex;
  justify-content: space-between;
  align-items: center;
  background: #0f172a;
  border: 1px solid #38bdf8;
  border-radius: 8px;
  padding: 6px 10px;
  font-size: 0.82rem;
}
.room-item-info { text-align: left; }
.room-item-title { font-weight: bold; color: #fde047; }
.room-item-sub { font-size: 0.72rem; color: #94a3b8; }
.room-item-btn {
  background: #16a34a;
  color: #fff;
  border: none;
  border-radius: 6px;
  padding: 5px 10px;
  font-size: 0.78rem;
  font-weight: bold;
  cursor: pointer;
}
.room-item-btn.spec { background: #7e22ce; }

.join-row { display: flex; gap: 6px; width: 100%; }
.code-input {
  flex: 1.2;
  padding: 7px;
  border-radius: 9px;
  border: 1.5px solid #64748b;
  background: #1e293b;
  color: #fff;
  font-size: 0.85rem;
  font-weight: bold;
  text-align: center;
  text-transform: uppercase;
  user-select: text;
  -webkit-user-select: text;
}
.btn-small { flex: 0.8; padding: 7px; border-radius: 9px; font-size: 0.82rem; }

/* 방 생성 후 대기 패널 */
.wait-panel { display: none; flex-direction: column; align-items: center; gap: 7px; width: 100%; max-width: 340px; }
.room-badge {
  background: #1e293b;
  border: 2px dashed #fde047;
  border-radius: 10px;
  padding: 7px 16px;
  font-size: 1.15rem;
  font-weight: bold;
  color: #fde047;
  letter-spacing: 1px;
  user-select: all;
  -webkit-user-select: all;
}
.wait-actions { display: flex; gap: 8px; width: 100%; }
.btn-copy { flex: 1.5; background: #16a34a; border: 1.5px solid #86efac; }
.btn-cancel { flex: 1; background: #475569; border: 1.5px solid #94a3b8; }
.lobby-status { font-size: 0.78rem; color: #bae6fd; margin-top: 5px; min-height: 16px; }

/* 모바일 터치 패드 */
.controls { width: 100%; max-width: 800px; flex: 1; max-height: 160px; display: flex; justify-content: space-between; align-items: stretch; gap: 12px; padding: 8px 4px 10px; }
.dpad-group { flex: 1.1; display: flex; gap: 8px; }
.action-group { flex: 1.1; display: flex; gap: 8px; }
.touch-btn { flex: 1; height: 100%; min-height: 82px; border-radius: 18px; border: 2.5px solid rgba(255,255,255,0.45); background: rgba(255,255,255,0.14); color: #fff; font-size: 1.5rem; font-weight: bold; display: flex; flex-direction: column; align-items: center; justify-content: center; }
.touch-btn:active, .touch-btn.active { background: rgba(56,189,248,0.65); border-color: #7dd3fc; transform: scale(0.96); }
.jump-btn { background: rgba(56,189,248,0.25); border-color: rgba(125,211,252,0.6); font-size: 1.2rem; }
.spike-btn { background: rgba(249,115,22,0.45); border-color: #fb923c; font-size: 1.1rem; }
.sub-label { font-size: 0.72rem; font-weight: normal; opacity: 0.85; margin-top: 2px; }

/* 관전자 전용 안내 바 */
.spectator-banner {
  display: none;
  width: 100%;
  max-width: 800px;
  flex: 1;
  max-height: 130px;
  background: rgba(88, 28, 135, 0.35);
  border: 2px solid #a855f7;
  border-radius: 16px;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 12px;
  margin: 8px 0;
}
.spectator-banner strong { font-size: 1.05rem; color: #f3e8ff; margin-bottom: 4px; }
.spectator-banner span { font-size: 0.82rem; color: #d8b4fe; }
</style>
</head>
<body>

<div class="top-bar">
  <h1>🐾 냐옹이 비치 배구</h1>
  <div class="top-right">
    <div class="spec-badge" id="specBadge">👀 관전 0명</div>
    <button class="home-btn" id="btnHome" style="display:none;">🏠 대기화면</button>
  </div>
</div>

<div class="game-wrapper">
  <canvas id="cvs" width="800" height="450"></canvas>

  <!-- 대기화면(로비) -->
  <div class="lobby-overlay" id="lobbyOverlay">
    <div class="lobby-title">🏐 냐옹이 배구 챔피언십</div>

    <!-- 1. 기본 메인 메뉴 -->
    <div class="menu-box" id="mainMenuBox">
      <div class="nick-row">
        <span class="nick-label">닉네임</span>
        <input type="text" class="nick-input" id="nickInput" maxlength="8" placeholder="닉네임 입력 (최대 8자)">
      </div>

      <button class="menu-btn btn-ai" id="btnStartAI">🐱 1인 플레이 (AI 대전)</button>
      <button class="menu-btn btn-create" id="btnCreateRoom">🏠 방 만들기 (공개방 생성)</button>
      <button class="menu-btn btn-list" id="btnOpenRoomList">🔍 참여하기 (방 리스트 보기)</button>
    </div>

    <!-- 2. 공개 방 리스트 및 코드 직접 입력 패널 -->
    <div class="list-panel" id="listPanel">
      <div class="room-list-box" id="roomListBox">
        <div style="padding:18px; color:#94a3b8; font-size:0.82rem;">열려 있는 방을 찾는 중...</div>
      </div>
      <div class="join-row">
        <input type="text" class="code-input" id="roomCodeInput" placeholder="코드 직접입력">
        <button class="menu-btn btn-list btn-small" id="btnJoinDirect">입장</button>
        <button class="menu-btn btn-cancel btn-small" id="btnRefreshList">새로고침</button>
        <button class="menu-btn btn-cancel btn-small" id="btnBackMain">뒤로</button>
      </div>
    </div>

    <!-- 3. 방 생성 후 대기 화면 -->
    <div class="wait-panel" id="waitPanel">
      <div style="font-size:0.82rem; color:#e2e8f0;">공개 로비에 등록되었습니다! 친구가 방 리스트에서 바로 찾을 수 있어요.</div>
      <div class="room-badge" id="roomCodeDisplay">CAT-LOBBY-1</div>
      <div class="wait-actions">
        <button class="menu-btn btn-copy" id="btnCopyCode">📋 방코드 복사</button>
        <button class="menu-btn btn-cancel" id="btnCancelRoom">취소</button>
      </div>
    </div>

    <div class="lobby-status" id="lobbyStatus">닉네임을 정하고 게임 모드를 선택하세요!</div>
  </div>
</div>

<!-- 플레이어용 터치 패드 -->
<div class="controls" id="controlsArea">
  <div class="dpad-group" id="dpadArea">
    <div class="touch-btn" id="btnLeft">◀<span class="sub-label">왼쪽</span></div>
    <div class="touch-btn" id="btnRight">▶<span class="sub-label">오른쪽</span></div>
  </div>
  <div class="action-group">
    <div class="touch-btn spike-btn" id="btnSpike">🔥스파이크<span class="sub-label">강타</span></div>
    <div class="touch-btn jump-btn" id="btnJump">점프<span class="sub-label">▲</span></div>
  </div>
</div>

<!-- 3번째 입장자부터 표시되는 관전 안내 -->
<div class="spectator-banner" id="spectatorBanner">
  <strong>👀 관전 모드로 입장했습니다</strong>
  <span id="spectatorInfo">현재 1P와 2P가 대전 중입니다. 실시간 경기를 관람하세요!</span>
</div>

<script>
window.onload = function() {
  var cvs = document.getElementById("cvs");
  var ctx = cvs.getContext("2d", { alpha: false });
  var TAU = 6.283185;
  function mul(a, b) { return a / (1 / b); }

  // 공개 로비 슬롯 1~10번 (별도 서버 없이 방 리스트 탐색용)
  var LOBBY_SLOTS = [];
  for (var s = 1; s <= 10; s++) {
    LOBBY_SLOTS.push("CAT-ROOM-" + s);
  }

  // --- 동적 배경 (시간 흐름: 낮 -> 노을 -> 밤 -> 아침) ---
  var worldTime = 0.08;
  var clouds = [
    { x: 120, y: 82, s: 1.0, spd: 0.32 },
    { x: 430, y: 65, s: 0.78, spd: 0.22 },
    { x: 680, y: 105, s: 1.12, spd: 0.40 }
  ];
  var stars = [];
  for (var si = 0; si < 38; si++) {
    stars.push({
      x: Math.random() * 800,
      y: 12 + Math.random() * 230,
      r: 0.8 + Math.random() * 1.5,
      phase: Math.random() * TAU
    });
  }
  var shootingStar = { active: false, x: 0, y: 0, vx: 0, vy: 0, life: 0 };
  var birds = [
    { x: -60, y: 95, spd: 1.7, phase: 0 },
    { x: -95, y: 80, spd: 1.7, phase: 1.2 },
    { x: -125, y: 112, spd: 1.7, phase: 2.4 }
  ];
  var superman = { active: false, x: -120, y: 88, spd: 4.6, cooldown: 900 };

  function lerp(a, b, t) { return a + mul(b - a, t); }
  function lerpColor(c1, c2, t) {
    var r = Math.round(lerp(c1[0], c2[0], t));
    var g = Math.round(lerp(c1[1], c2[1], t));
    var b = Math.round(lerp(c1[2], c2[2], t));
    return "rgb(" + r + "," + g + "," + b + ")";
  }

  function updateEnvironment(dt) {
    worldTime += mul(0.00022, dt);
    if (worldTime >= 1) worldTime -= 1;

    for (var i = 0; i < clouds.length; i++) {
      clouds[i].x += mul(clouds[i].spd, dt);
      if (clouds[i].x > 890) clouds[i].x = -90;
    }

    if (worldTime >= 0.50 && worldTime <= 0.82) {
      if (!shootingStar.active && Math.random() < mul(0.014, dt)) {
        shootingStar.active = true;
        shootingStar.x = 180 + Math.random() * 580;
        shootingStar.y = 15 + Math.random() * 75;
        shootingStar.vx = -9.5;
        shootingStar.vy = 4.2;
        shootingStar.life = 34;
      }
    }
    if (shootingStar.active) {
      shootingStar.x += mul(shootingStar.vx, dt);
      shootingStar.y += mul(shootingStar.vy, dt);
      shootingStar.life -= dt;
      if (shootingStar.life <= 0) shootingStar.active = false;
    }

    var isMorning = (worldTime >= 0.82 || worldTime <= 0.08);
    for (var b = 0; b < birds.length; b++) {
      if (isMorning || birds[b].x > -40) {
        birds[b].x += mul(birds[b].spd, dt);
        birds[b].phase += mul(0.16, dt);
        if (birds[b].x > 860) {
          birds[b].x = isMorning ? -60 - mul(b, 32) : -120;
          birds[b].y = 70 + Math.random() * 65;
        }
      }
    }

    // 슈퍼맨 출현 빈도를 대폭 낮춰 가끔씩 깜짝 이벤트로만 등장 (쿨다운 + 낮은 확률)
    if (superman.cooldown > 0) superman.cooldown -= dt;
    if (worldTime >= 0.12 && worldTime <= 0.32 && superman.cooldown <= 0) {
      if (!superman.active && Math.random() < mul(0.0014, dt)) {
        superman.active = true;
        superman.x = -110;
        superman.y = 65 + Math.random() * 55;
        superman.cooldown = 2400; // 최소 약 40초 쿨다운
      }
    }
    if (superman.active) {
      superman.x += mul(superman.spd, dt);
      if (superman.x > 920) superman.active = false;
    }
  }

  function getSkyPalette() {
    var keys = [
      { t: 0.00, top: [14, 165, 233], bot: [186, 230, 253], sand: [253, 224, 71], line: [234, 179, 8] },
      { t: 0.32, top: [2, 132, 199],  bot: [125, 211, 252], sand: [253, 224, 71], line: [234, 179, 8] },
      { t: 0.43, top: [124, 45, 18],  bot: [251, 146, 60],  sand: [245, 158, 11], line: [180, 83, 9] },
      { t: 0.53, top: [15, 23, 42],   bot: [30, 41, 59],    sand: [161, 136, 62], line: [113, 95, 42] },
      { t: 0.80, top: [15, 23, 42],   bot: [49, 46, 129],   sand: [175, 150, 72], line: [120, 102, 48] },
      { t: 0.90, top: [131, 24, 67],  bot: [253, 186, 116], sand: [252, 211, 77], line: [217, 119, 6] },
      { t: 1.00, top: [14, 165, 233], bot: [186, 230, 253], sand: [253, 224, 71], line: [234, 179, 8] }
    ];
    for (var i = 0; i < keys.length - 1; i++) {
      if (worldTime >= keys[i].t && worldTime <= keys[i + 1].t) {
        var span = keys[i + 1].t - keys[i].t;
        var ratio = span > 0 ? (worldTime - keys[i].t) / span : 0;
        return {
          top: lerpColor(keys[i].top, keys[i + 1].top, ratio),
          bot: lerpColor(keys[i].bot, keys[i + 1].bot, ratio),
          sand: lerpColor(keys[i].sand, keys[i + 1].sand, ratio),
          line: lerpColor(keys[i].line, keys[i + 1].line, ratio)
        };
      }
    }
    return { top: '#0284c7', bot: '#7dd3fc', sand: '#fde047', line: '#eab308' };
  }

  var p1 = {
    x: 150, y: 340, vx: 0, vy: 0, r: 26, maxSpeed: 7.5,
    type: 'tabby', name: '치즈냥',
    color: '#f59e0b', shadow: '#78350f', light: '#fde68a', stripe: '#92400e', earInner: '#fda4af',
    hitTimer: 0, squash: 1
  };
  var p2 = {
    x: 650, y: 340, vx: 0, vy: 0, r: 26, maxSpeed: 7.5,
    type: 'persian', name: '페르시안냥',
    color: '#ffffff', shadow: '#0f172a', light: '#bae6fd', stripe: '#1e293b', earInner: '#fda4af',
    hitTimer: 0, squash: 1
  };

  var ball = { x: 400, y: 150, vx: 1.6, vy: -2.2, r: 20, isFire: false };
  var particles = [];
  var score1 = 0, score2 = 0, gameOver = false, winnerText = "", keys = {};
  var lastTime = performance.now();

  var gameState = 'lobby';
  var netMode = 'ai';
  var peer = null;
  var scanPeer = null;
  var player2Conn = null;
  var spectatorConns = [];
  var spectatorNames = [];
  var remoteKeys = {};
  var myRoomId = "";
  var isHostingRoom = false;

  var lobbyOverlay = document.getElementById("lobbyOverlay");
  var mainMenuBox = document.getElementById("mainMenuBox");
  var listPanel = document.getElementById("listPanel");
  var roomListBox = document.getElementById("roomListBox");
  var waitPanel = document.getElementById("waitPanel");
  var lobbyStatus = document.getElementById("lobbyStatus");
  var btnHome = document.getElementById("btnHome");
  var controlsArea = document.getElementById("controlsArea");
  var spectatorBanner = document.getElementById("spectatorBanner");
  var specBadge = document.getElementById("specBadge");
  var nickInput = document.getElementById("nickInput");

  try {
    var savedNick = sessionStorage.getItem('cat_nick');
    if (savedNick) nickInput.value = savedNick;
  } catch (e) {}

  function getMyNick(fallback) {
    var val = nickInput.value.trim();
    var finalNick = val ? val.slice(0, 8) : fallback;
    try { sessionStorage.setItem('cat_nick', finalNick); } catch (e) {}
    return finalNick;
  }

  function copyTextSafe(text) {
    var textArea = document.createElement("textarea");
    textArea.value = text;
    textArea.style.position = "fixed";
    textArea.style.left = "-9999px";
    textArea.style.top = "0";
    textArea.setAttribute("readonly", "");
    document.body.appendChild(textArea);
    textArea.focus();
    textArea.select();
    textArea.setSelectionRange(0, 99999);
    var success = false;
    try {
      success = document.execCommand("copy");
    } catch (err) {
      success = false;
    }
    document.body.removeChild(textArea);

    if (success) {
      lobbyStatus.innerText = "✅ 복사 완료! [" + text + "] 친구에게 보내거나 리스트에서 입장하세요.";
    } else {
      lobbyStatus.innerText = "방 코드 [" + text + "] 를 길게 눌러 복사해 주세요.";
    }
  }

  function updateSpecBadge(count) {
    if (count > 0) {
      specBadge.style.display = 'inline-block';
      specBadge.innerText = "👀 관전 " + count + "명";
    } else {
      specBadge.style.display = 'none';
    }
  }

  function resetPositions() {
    p1.x = 150; p1.y = 340; p1.vx = 0; p1.vy = 0; p1.squash = 1;
    p2.x = 650; p2.y = 340; p2.vx = 0; p2.vy = 0; p2.squash = 1;
    ball.x = 400; ball.y = 150; ball.vx = 1.6; ball.vy = -2.2; ball.isFire = false;
    particles = [];
  }

  function broadcastToAll(payload) {
    if (player2Conn && player2Conn.open) player2Conn.send(payload);
    for (var i = 0; i < spectatorConns.length; i++) {
      if (spectatorConns[i].open) spectatorConns[i].send(payload);
    }
  }

  function resetGame() {
    score1 = 0; score2 = 0; gameOver = false;
    resetPositions();
    if (netMode === 'host') {
      broadcastToAll({ type: 'reset' });
    }
  }

  function startMatch(mode) {
    netMode = mode;
    gameState = 'playing';
    lobbyOverlay.style.display = 'none';
    btnHome.style.display = 'inline-block';

    if (mode === 'spectator') {
      controlsArea.style.display = 'none';
      spectatorBanner.style.display = 'flex';
    } else {
      controlsArea.style.display = 'flex';
      spectatorBanner.style.display = 'none';
    }
    resetGame();
  }

  function returnToLobby(msg) {
    isHostingRoom = false;
    try { sessionStorage.removeItem('cat_host_room'); } catch (e) {}

    if (player2Conn) { player2Conn.close(); player2Conn = null; }
    for (var i = 0; i < spectatorConns.length; i++) {
      spectatorConns[i].close();
    }
    spectatorConns = [];
    spectatorNames = [];
    updateSpecBadge(0);

    if (peer) { try { peer.destroy(); } catch (e) {} peer = null; }
    if (scanPeer) { try { scanPeer.destroy(); } catch (e) {} scanPeer = null; }

    netMode = 'ai';
    gameState = 'lobby';
    gameOver = false;
    p1.name = '치즈냥';
    p2.name = '페르시안냥';
    resetPositions();

    lobbyOverlay.style.display = 'flex';
    mainMenuBox.style.display = 'flex';
    listPanel.style.display = 'none';
    waitPanel.style.display = 'none';
    btnHome.style.display = 'none';
    controlsArea.style.display = 'flex';
    spectatorBanner.style.display = 'none';
    lobbyStatus.innerText = msg || "닉네임을 정하고 게임 모드를 선택하세요!";
  }

  // 비어있는 공개 로비 슬롯(CAT-ROOM-1 ~ 10)을 순서대로 찾아 방 개설
  function tryCreateHostSlot(slotIndex, fixedCode) {
    if (typeof Peer === 'undefined') {
      lobbyStatus.innerText = "인터넷 연결이 필요합니다.";
      return;
    }
    if (!fixedCode && slotIndex >= LOBBY_SLOTS.length) {
      lobbyStatus.innerText = "현재 공개방 10개가 모두 가득 찼습니다. 잠시 후 다시 시도하세요.";
      mainMenuBox.style.display = 'flex';
      waitPanel.style.display = 'none';
      return;
    }

    var targetId = fixedCode || LOBBY_SLOTS[slotIndex];
    if (peer) { try { peer.destroy(); } catch (e) {} }

    isHostingRoom = true;
    p1.name = getMyNick('치즈냥');
    myRoomId = targetId;

    mainMenuBox.style.display = 'none';
    listPanel.style.display = 'none';
    waitPanel.style.display = 'flex';
    document.getElementById("roomCodeDisplay").innerText = targetId;
    lobbyStatus.innerText = "공개 방 슬롯(" + (slotIndex + 1) + "번) 연결 중...";

    var tempPeer = new Peer(targetId);
    peer = tempPeer;

    tempPeer.on('open', function(id) {
      myRoomId = id;
      try { sessionStorage.setItem('cat_host_room', id); } catch (e) {}
      document.getElementById("roomCodeDisplay").innerText = id;
      lobbyStatus.innerText = "방 개설 완료! 상대방이 방 리스트에서 입장할 수 있습니다.";
    });

    tempPeer.on('connection', function(c) {
      c.on('data', function(data) {
        // 참여자가 방 목록 조회를 위해 핑(probe)을 보낸 경우 방 정보만 응답하고 종료
        if (data && data.type === 'probe') {
          var isPlaying = (player2Conn && player2Conn.open);
          c.send({
            type: 'roomInfo',
            roomId: myRoomId,
            hostName: p1.name,
            p2Name: isPlaying ? p2.name : "",
            status: isPlaying ? 'playing' : 'waiting',
            specCount: spectatorConns.length
          });
          setTimeout(function() { try { c.close(); } catch (e) {} }, 300);
          return;
        }

        if (data && data.type === 'hello') {
          if (!player2Conn || !player2Conn.open) {
            player2Conn = c;
            p2.name = data.nick || '페르시안냥';
            c.send({ type: 'role', role: 'guest', p1Name: p1.name });
            if (gameState !== 'playing') {
              startMatch('host');
            }
          } else {
            spectatorConns.push(c);
            spectatorNames.push(data.nick || '관전자');
            updateSpecBadge(spectatorConns.length);
            c.send({
              type: 'role',
              role: 'spectator',
              p1Name: p1.name,
              p2Name: p2.name,
              specCount: spectatorConns.length
            });
          }
        } else if (data && data.type === 'keys' && c === player2Conn) {
          remoteKeys = data.keys;
        }
      });

      c.on('close', function() {
        if (c === player2Conn) {
          player2Conn = null;
          returnToLobby("상대 플레이어(2P)가 퇴장하여 대기화면으로 돌아왔습니다.");
        } else {
          var idx = spectatorConns.indexOf(c);
          if (idx !== -1) {
            spectatorConns.splice(idx, 1);
            spectatorNames.splice(idx, 1);
            updateSpecBadge(spectatorConns.length);
          }
        }
      });
    });

    tempPeer.on('disconnected', function() {
      if (isHostingRoom && peer && !peer.destroyed) {
        peer.reconnect();
      }
    });

    tempPeer.on('error', function(err) {
      if (err && err.type === 'unavailable-id') {
        if (fixedCode) {
          setTimeout(function() {
            if (isHostingRoom) tryCreateHostSlot(0, fixedCode);
          }, 1200);
        } else {
          // 이미 사용 중인 슬롯이면 다음 번호 슬롯 자동 시도
          tryCreateHostSlot(slotIndex + 1, null);
        }
      } else {
        lobbyStatus.innerText = "연결 대기 중...";
      }
    });
  }

  // 공개 방 리스트(1~10번 슬롯) 실시간 탐색
  function scanOpenRooms() {
    if (typeof Peer === 'undefined') {
      lobbyStatus.innerText = "인터넷 연결이 필요합니다.";
      return;
    }
    if (scanPeer) { try { scanPeer.destroy(); } catch (e) {} }

    roomListBox.innerHTML = '<div style="padding:18px; color:#bae6fd; font-size:0.82rem;">🔍 열려 있는 방을 찾는 중...</div>';
    lobbyStatus.innerText = "공개 방 목록을 조회하고 있습니다...";

    var foundRooms = [];
    var checkedCount = 0;
    var sp = new Peer();
    scanPeer = sp;

    sp.on('open', function() {
      for (var i = 0; i < LOBBY_SLOTS.length; i++) {
        (function(slotId) {
          var c = sp.connect(slotId, { reliable: true });
          var done = false;

          var finishOne = function() {
            if (done) return;
            done = true;
            checkedCount++;
            renderRoomList(foundRooms, checkedCount >= LOBBY_SLOTS.length);
          };

          c.on('open', function() {
            c.send({ type: 'probe' });
          });

          c.on('data', function(data) {
            if (data && data.type === 'roomInfo') {
              foundRooms.push(data);
              finishOne();
            }
          });

          c.on('error', finishOne);
          setTimeout(function() {
            try { c.close(); } catch (e) {}
            finishOne();
          }, 1600);
        })(LOBBY_SLOTS[i]);
      }
    });

    sp.on('error', function() {
      renderRoomList(foundRooms, true);
    });
  }

  function renderRoomList(rooms, isDone) {
    if (rooms.length === 0) {
      if (isDone) {
        roomListBox.innerHTML = '<div style="padding:16px; color:#94a3b8; font-size:0.82rem;">현재 열린 방이 없습니다.<br>직접 방을 만들거나 코드를 입력해 보세요!</div>';
        lobbyStatus.innerText = "열린 방이 없으면 [방 만들기]로 호스트가 되어보세요.";
      }
      return;
    }

    roomListBox.innerHTML = "";
    for (var i = 0; i < rooms.length; i++) {
      var r = rooms[i];
      var item = document.createElement("div");
      item.className = "room-item";

      var isWaiting = (r.status === 'waiting');
      var statusBadge = isWaiting
        ? "대기중 (1/2명) · 바로 대전 가능"
        : "대전중 (" + r.hostName + " vs " + r.p2Name + ") · 관전 " + r.specCount + "명";

      item.innerHTML =
        '<div class="room-item-info">' +
          '<div class="room-item-title">🐾 ' + r.hostName + '의 방 (' + r.roomId.replace('CAT-ROOM-', '') + '번)</div>' +
          '<div class="room-item-sub">' + statusBadge + '</div>' +
        '</div>';

      var btn = document.createElement("button");
      btn.className = isWaiting ? "room-item-btn" : "room-item-btn spec";
      btn.innerText = isWaiting ? "대전 입장" : "👀 관람";
      (function(targetRoomId) {
        btn.onclick = function() {
          joinRoomById(targetRoomId);
        };
      })(r.roomId);

      item.appendChild(btn);
      roomListBox.appendChild(item);
    }
    lobbyStatus.innerText = "총 " + rooms.length + "개의 방이 열려 있습니다! 터치해서 입장하세요.";
  }

  function joinRoomById(code) {
    if (!code) {
      lobbyStatus.innerText = "입장할 방을 선택하거나 코드를 입력하세요!";
      return;
    }
    isHostingRoom = false;
    try { sessionStorage.removeItem('cat_host_room'); } catch (e) {}
    if (scanPeer) { try { scanPeer.destroy(); } catch (e) {} scanPeer = null; }
    if (peer) { try { peer.destroy(); } catch (e) {} }

    var myNick = getMyNick('페르시안냥');
    lobbyStatus.innerText = "[" + code + "] 방에 접속 중...";
    peer = new Peer();

    peer.on('open', function() {
      conn = peer.connect(code);
      conn.on('open', function() {
        conn.send({ type: 'hello', nick: myNick });

        conn.on('data', function(data) {
          if (data.type === 'role') {
            p1.name = data.p1Name || '치즈냥';
            if (data.role === 'guest') {
              p2.name = myNick;
              startMatch('guest');
            } else {
              p2.name = data.p2Name || '페르시안냥';
              updateSpecBadge(data.specCount || 1);
              document.getElementById("spectatorInfo").innerText =
                "[" + p1.name + "] vs [" + p2.name + "] 실시간 대전을 관람 중입니다!";
              startMatch('spectator');
            }
          } else if (data.type === 'state') {
            p1.x = data.p1.x; p1.y = data.p1.y; p1.vx = data.p1.vx; p1.hitTimer = data.p1.ht; p1.squash = data.p1.sq; p1.name = data.p1.nm;
            p2.x = data.p2.x; p2.y = data.p2.y; p2.vx = data.p2.vx; p2.hitTimer = data.p2.ht; p2.squash = data.p2.sq; p2.name = data.p2.nm;
            ball.x = data.b.x; ball.y = data.b.y; ball.isFire = data.b.f;
            score1 = data.s1; score2 = data.s2;
            gameOver = data.go; winnerText = data.wt;
            if (typeof data.wtm === 'number') worldTime = data.wtm;
            updateSpecBadge(data.sc || 0);
          } else if (data.type === 'reset') {
            gameOver = false; particles = [];
          }
        });
      });

      conn.on('close', function() {
        returnToLobby("방장과의 연결이 종료되었습니다.");
      });
    });

    peer.on('error', function() {
      lobbyStatus.innerText = "방을 찾을 수 없습니다. 새로고침 후 다시 시도해 주세요.";
    });
  }

  document.addEventListener("visibilitychange", function() {
    if (document.visibilityState === "visible") {
      if (isHostingRoom) {
        if (!peer || peer.destroyed) {
          tryCreateHostSlot(0, myRoomId);
        } else if (peer.disconnected) {
          peer.reconnect();
        }
      }
    }
  });

  try {
    var pendingRoom = sessionStorage.getItem('cat_host_room');
    if (pendingRoom) {
      tryCreateHostSlot(0, pendingRoom);
    }
  } catch (e) {}

  // 버튼 이벤트 바인딩
  document.getElementById("btnStartAI").onclick = function() {
    isHostingRoom = false;
    try { sessionStorage.removeItem('cat_host_room'); } catch (e) {}
    p1.name = getMyNick('치즈냥');
    p2.name = '페르시안냥(AI)';
    startMatch('ai');
  };

  document.getElementById("btnCreateRoom").onclick = function() {
    tryCreateHostSlot(0, null);
  };

  document.getElementById("btnOpenRoomList").onclick = function() {
    mainMenuBox.style.display = 'none';
    listPanel.style.display = 'flex';

  };

  document.getElementById("btnRefreshList").onclick = function() {

  };

  document.getElementById("btnBackMain").onclick = function() {
    if (scanPeer) { try { scanPeer.destroy(); } catch (e) {} scanPeer = null; }
    listPanel.style.display = 'none';
    mainMenuBox.style.display = 'flex';

  };

  document.getElementById("btnJoinDirect").onclick = function() {
    var code = document.getElementById("roomCodeInput").value.trim().toUpperCase();
    // 숫자만(예: 1) 입력해도 CAT-ROOM-1 로 자동 변환
    if (/^[1-9]$|^10$/.test(code)) code = "CAT-ROOM-" + code;

  document.getElementById("btnCopyCode").onclick = function() {

  document.getElementById("roomCodeDisplay").onclick = function() {

  };

  document.getElementById("btnCancelRoom").onclick = function() {
    returnToLobby("방 만들기를 취소했습니다.");
  };

  btnHome.onclick = function() {
    returnToLobby();
  };

  window.onkeydown = function(e) {
    keys[e.code] = true;
    if (gameState === 'playing' && gameOver && e.code === 'Space' && (netMode === 'ai' || netMode === 'host')) resetGame();
  };
  window.onkeyup = function(e) { keys[e.code] = false; };

  cvs.addEventListener('touchstart', function(e) {
    if (gameState === 'playing' && gameOver && (netMode === 'ai' || netMode === 'host')) { e.preventDefault(); resetGame(); }
  });
  cvs.addEventListener('click', function() {
    if (gameState === 'playing' && gameOver && (netMode === 'ai' || netMode === 'host')) resetGame();
  });

  var dpadArea = document.getElementById("dpadArea");
  var btnLeft = document.getElementById("btnLeft");
  var btnRight = document.getElementById("btnRight");

  function handleDpad(e) {
    e.preventDefault();
    if (gameState !== 'playing' || netMode === 'spectator') return;
    if (gameOver && (netMode === 'ai' || netMode === 'host')) { resetGame(); return; }
    var rect = dpadArea.getBoundingClientRect();
    var midX = rect.left + rect.width / 2;
    var leftActive = false;
    var rightActive = false;

    for (var i = 0; i < e.touches.length; i++) {
      var tx = e.touches[i].clientX;
      var ty = e.touches[i].clientY;
      if (tx >= rect.left - 20 && tx <= rect.right + 20 && ty >= rect.top - 20 && ty <= rect.bottom + 20) {
        if (tx < midX) leftActive = true;
        else rightActive = true;
      }
    }
    keys['ArrowLeft'] = leftActive;
    keys['ArrowRight'] = rightActive;
    btnLeft.classList.toggle('active', leftActive);
    btnRight.classList.toggle('active', rightActive);
  }

  dpadArea.addEventListener('touchstart', handleDpad, { passive: false });
  dpadArea.addEventListener('touchmove', handleDpad, { passive: false });
  dpadArea.addEventListener('touchend', handleDpad, { passive: false });
  dpadArea.addEventListener('touchcancel', handleDpad, { passive: false });

  function bindBtn(id, code) {
    var btn = document.getElementById(id);
    var down = function(e) {
      e.preventDefault();
      if (gameState !== 'playing' || netMode === 'spectator') return;
      if (gameOver && (netMode === 'ai' || netMode === 'host')) { resetGame(); return; }
      keys[code] = true;
      btn.classList.add('active');
    };
    var up = function(e) { e.preventDefault(); keys[code] = false; btn.classList.remove('active'); };
    btn.addEventListener('touchstart', down, {passive: false});
    btn.addEventListener('touchend', up, {passive: false});
    btn.addEventListener('touchcancel', up, {passive: false});
    btn.addEventListener('mousedown', down);
    btn.addEventListener('mouseup', up);
    btn.addEventListener('mouseleave', up);
  }
  bindBtn('btnLeft', 'ArrowLeft');
  bindBtn('btnRight', 'ArrowRight');
  bindBtn('btnJump', 'ArrowUp');
  bindBtn('btnSpike', 'Space');

  function update(dt) {
    updateEnvironment(dt);

    if (gameState !== 'playing') return;

    if (netMode === 'guest' || netMode === 'spectator') {
      if (netMode === 'guest' && conn && conn.open) {
        conn.send({
          type: 'keys',
          keys: {
            L: !!(keys["ArrowLeft"] || keys["KeyA"]),
            R: !!(keys["ArrowRight"] || keys["KeyD"]),
            U: !!(keys["ArrowUp"] || keys["KeyW"]),
            S: !!keys["Space"]
          }
        });
      }
      updateParticles(dt);
      return;
    }

    if (gameOver) return;
    if (p1.hitTimer > 0) p1.hitTimer -= dt;
    if (p2.hitTimer > 0) p2.hitTimer -= dt;

    var moveDir = 0;
    if (keys["ArrowLeft"] || keys["KeyA"]) moveDir -= 1;
    if (keys["ArrowRight"] || keys["KeyD"]) moveDir += 1;

    if (moveDir !== 0) {
      p1.vx += mul(moveDir, 1.4) * dt;
      if (p1.vx > p1.maxSpeed) p1.vx = p1.maxSpeed;
      if (p1.vx < -p1.maxSpeed) p1.vx = -p1.maxSpeed;
    } else {
      p1.vx = mul(p1.vx, Math.pow(0.76, dt));
      if (Math.abs(p1.vx) < 0.15) p1.vx = 0;
    }

    if ((keys["ArrowUp"] || keys["KeyW"]) && p1.y >= 340) {
      p1.vy = -10.8;
      p1.squash = 1.22;
    }

    var wasAir1 = p1.y < 340;
    p1.vy += mul(0.36, dt);
    p1.x += mul(p1.vx, dt);
    p1.y += mul(p1.vy, dt);

    if (p1.y >= 340) {
      p1.y = 340;
      if (wasAir1) p1.squash = 0.82;
      p1.vy = 0;
    }
    p1.squash += mul(1 - p1.squash, 0.2) * dt;
    if (p1.x < p1.r + 6) { p1.x = p1.r + 6; p1.vx = 0; }
    if (p1.x > 390 - p1.r) { p1.x = 390 - p1.r; p1.vx = 0; }

    if (netMode === 'host') {
      var p2Dir = 0;
      if (remoteKeys.L) p2Dir -= 1;
      if (remoteKeys.R) p2Dir += 1;
      if (p2Dir !== 0) {
        p2.vx += mul(p2Dir, 1.4) * dt;
        if (p2.vx > p2.maxSpeed) p2.vx = p2.maxSpeed;
        if (p2.vx < -p2.maxSpeed) p2.vx = -p2.maxSpeed;
      } else {
        p2.vx = mul(p2.vx, Math.pow(0.76, dt));
        if (Math.abs(p2.vx) < 0.15) p2.vx = 0;
      }
      if (remoteKeys.U && p2.y >= 340) {
        p2.vy = -10.8;
        p2.squash = 1.22;
      }
    } else {
      var aiMax = 4.5;
      var targetX = ball.x > 400 ? ball.x + 10 : 650;
      var diffX = targetX - p2.x;
      if (Math.abs(diffX) > 6) {
        var aiDir = diffX > 0 ? 1 : -1;
        p2.vx += mul(aiDir, 1.0) * dt;
        if (p2.vx > aiMax) p2.vx = aiMax;
        if (p2.vx < -aiMax) p2.vx = -aiMax;
      } else {
        p2.vx = mul(p2.vx, Math.pow(0.78, dt));
      }
      if (ball.x > 400 && ball.y < 250 && ball.vy > 0 && p2.y >= 340 && Math.abs(p2.x - ball.x) < 70) {
        p2.vy = -10.5;
        p2.squash = 1.22;
      }
    }

    var wasAir2 = p2.y < 340;
    p2.vy += mul(0.36, dt);
    p2.x += mul(p2.vx, dt);
    p2.y += mul(p2.vy, dt);

    if (p2.y >= 340) {
      p2.y = 340;
      if (wasAir2) p2.squash = 0.82;
      p2.vy = 0;
    }
    p2.squash += mul(1 - p2.squash, 0.2) * dt;
    if (p2.x < 410 + p2.r) { p2.x = 410 + p2.r; p2.vx = 0; }
    if (p2.x > 800 - p2.r - 6) { p2.x = 800 - p2.r - 6; p2.vx = 0; }

    ball.vy += mul(0.15, dt);
    ball.x += mul(ball.vx, dt);
    ball.y += mul(ball.vy, dt);

    updateParticles(dt);

    if (ball.x < ball.r) { ball.x = ball.r; ball.vx = -ball.vx; }
    if (ball.x > 800 - ball.r) { ball.x = 800 - ball.r; ball.vx = -ball.vx; }
    if (ball.y < ball.r) { ball.y = ball.r; ball.vy = -ball.vy; }

    if (ball.x + ball.r > 395 && ball.x - ball.r < 405 && ball.y + ball.r > 260) {
      if (ball.y < 275) { ball.y = 260 - ball.r; ball.vy = mul(ball.vy, -0.92); }
      else { ball.vx = mul(ball.vx, -0.85); ball.x = ball.x < 400 ? 395 - ball.r : 405 + ball.r; }
    }

    hitBall(p1, !!keys["Space"]);
    hitBall(p2, netMode === 'host' ? !!remoteKeys.S : false);

    if (ball.y > 430) {
      if (ball.x < 400) {
        score2++;
        if (score2 >= 15) { gameOver = true; winnerText = "🎉 " + p2.name + " 승리! (터치해 재시작)"; }
        else { ball.x = 580; ball.y = 140; ball.vx = -1.6; ball.vy = -2.2; ball.isFire = false; particles = []; }
      } else {
        score1++;
        if (score1 >= 15) { gameOver = true; winnerText = "🎉 " + p1.name + " 승리! (터치해 재시작)"; }
        else { ball.x = 220; ball.y = 140; ball.vx = 1.6; ball.vy = -2.2; ball.isFire = false; particles = []; }
      }
    }

    if (netMode === 'host') {
      broadcastToAll({
        type: 'state',
        p1: { x: p1.x, y: p1.y, vx: p1.vx, ht: p1.hitTimer, sq: p1.squash, nm: p1.name },
        p2: { x: p2.x, y: p2.y, vx: p2.vx, ht: p2.hitTimer, sq: p2.squash, nm: p2.name },
        b: { x: ball.x, y: ball.y, f: ball.isFire },
        s1: score1, s2: score2, go: gameOver, wt: winnerText,
        sc: spectatorConns.length,
        wtm: worldTime
      });
    }
  }

  function updateParticles(dt) {
    if (ball.isFire && particles.length < 35) {
      particles.push({
        x: ball.x + mul(Math.random() - 0.5, 18),
        y: ball.y + mul(Math.random() - 0.5, 18),
        vx: mul(Math.random() - 0.5, 3.0) - mul(ball.vx, 0.25),
        vy: mul(Math.random() - 0.5, 3.0) - mul(ball.vy, 0.25),
        size: mul(Math.random(), 7) + 4,
        color: Math.random() > 0.5 ? '#f97316' : '#facc15',
        life: 20
      });
    }
    for (var i = particles.length - 1; i >= 0; i--) {
      var pt = particles[i];
      pt.x += mul(pt.vx, dt);
      pt.y += mul(pt.vy, dt);
      pt.life -= dt;
      if (pt.life <= 0) particles.splice(i, 1);
    }
  }

  function hitBall(p, isSpike) {
    var dx = ball.x - p.x, dy = ball.y - p.y;
    var dist = Math.hypot(dx, dy);
    if (dist < ball.r + p.r + 6 && dist > 0) {
      var overlap = (ball.r + p.r + 6) - dist;
      ball.x += mul(dx / dist, overlap);
      ball.y += mul(dy / dist, overlap);
      p.hitTimer = 18;
      p.squash = 1.15;
      var angle = Math.atan2(dy, dx);
      if (isSpike) {
        ball.isFire = true;
        ball.vx = mul(Math.cos(angle), 12.2) + mul(p.vx, 0.3);
        ball.vy = mul(Math.sin(angle), 12.2) - 3.5;
      } else {
        ball.isFire = false;
        ball.vx = mul(Math.cos(angle), 6.5) + mul(p.vx, 0.25);
        ball.vy = mul(Math.sin(angle), 6.5) - 2.4;
      }
    }
  }

  function traceCatHeadPath() {
    ctx.beginPath();
    ctx.moveTo(0, -25);
    ctx.bezierCurveTo(18, -25, 29, -15, 29, 2);
    ctx.bezierCurveTo(29, 16, 17, 22, 0, 22);
    ctx.bezierCurveTo(-17, 22, -29, 16, -29, 2);
    ctx.bezierCurveTo(-29, -15, -18, -25, 0, -25);
    ctx.closePath();
  }

  function drawChar(p) {
    ctx.save();
    ctx.font = 'bold 14px sans-serif';
    var nameWidth = ctx.measureText(p.name).width + 16;
    ctx.fillStyle = 'rgba(15, 23, 42, 0.78)';
    ctx.beginPath();
    ctx.roundRect(p.x - nameWidth / 2, p.y - 72, nameWidth, 22, 8);
    ctx.fill();
    ctx.fillStyle = p.type === 'tabby' ? '#fde047' : '#e0f2fe';
    ctx.textAlign = 'center';
    ctx.fillText(p.name, p.x, p.y - 56);
    ctx.restore();

    ctx.save();
    ctx.translate(p.x, p.y + 32);
    ctx.scale(2 - p.squash, p.squash);
    ctx.translate(0, -32);

    var isTabby = (p.type === 'tabby');
    var dir = isTabby ? 1 : -1;
    var speedRatio = Math.abs(p.vx) / p.maxSpeed;
    var time = performance.now();

    var tailWag = mul(Math.sin(mul(time, 0.008)), 6);
    ctx.lineCap = 'round';
    ctx.strokeStyle = '#0f172a';
    ctx.lineWidth = isTabby ? 9 : 11;
    ctx.beginPath();
    ctx.moveTo(mul(-dir, 12), 17);
    ctx.quadraticCurveTo(mul(-dir, 36), 2 + tailWag, mul(-dir, 28), -18 + tailWag);
    ctx.stroke();

    ctx.strokeStyle = isTabby ? p.color : '#bae6fd';
    ctx.lineWidth = isTabby ? 5 : 6.5;
    ctx.stroke();

    if (!isTabby) {
      ctx.fillStyle = '#0f172a';
      ctx.beginPath();
      ctx.arc(mul(-dir, 28), -18 + tailWag, 4.5, 0, TAU);
      ctx.fill();
    }

    ctx.fillStyle = p.color;
    ctx.beginPath();
    ctx.ellipse(0, 17, 16, 13, 0, 0, TAU);
    ctx.fill();
    ctx.lineWidth = 2.6;
    ctx.strokeStyle = '#0f172a';
    ctx.stroke();

    if (!isTabby) {
      ctx.fillStyle = '#bae6fd';
      ctx.beginPath();
      ctx.ellipse(mul(-dir, 4), 19, 10, 8, 0, 0, TAU);
      ctx.fill();

      ctx.fillStyle = '#ffffff';
      ctx.beginPath();
      ctx.arc(mul(dir, 3), 9, 6.2, 0, TAU);
      ctx.arc(mul(dir, 8), 11, 5.2, 0, TAU);
      ctx.arc(mul(-dir, 3), 10, 5.2, 0, TAU);
      ctx.fill();
    }

    ctx.fillStyle = p.stripe;
    ctx.beginPath();
    ctx.roundRect(mul(dir, 3), 12, 3.8, 8.5, 2);
    ctx.roundRect(mul(dir, 8.5), 14, 3.8, 6.5, 2);
    ctx.fill();

    var paw = mul(Math.sin(mul(time, 0.022)), mul(4.2, speedRatio));
    ctx.fillStyle = isTabby ? '#fef3c7' : '#1e293b';
    ctx.strokeStyle = '#0f172a';
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(-8, 28 + paw, 5.2, 0, TAU); ctx.fill(); ctx.stroke();
    ctx.beginPath(); ctx.arc(8, 28 - paw, 5.2, 0, TAU); ctx.fill(); ctx.stroke();

    var earBaseColor = isTabby ? p.color : '#334155';
    ctx.fillStyle = earBaseColor;
    ctx.strokeStyle = '#0f172a';
    ctx.lineWidth = 2.5;
    ctx.beginPath();
    ctx.moveTo(-23, -10);
    ctx.quadraticCurveTo(-26, -34, -20, -36);
    ctx.quadraticCurveTo(-13, -37, -7, -21);
    ctx.closePath();
    ctx.fill();
    ctx.stroke();

    ctx.fillStyle = p.earInner;
    ctx.beginPath();
    ctx.moveTo(-20, -14);
    ctx.quadraticCurveTo(-22, -29, -18.5, -31);
    ctx.quadraticCurveTo(-15, -31, -11, -20);
    ctx.closePath();
    ctx.fill();

    ctx.fillStyle = earBaseColor;
    ctx.beginPath();
    ctx.moveTo(23, -10);
    ctx.quadraticCurveTo(26, -34, 20, -36);
    ctx.quadraticCurveTo(13, -37, 7, -21);
    ctx.closePath();
    ctx.fill();
    ctx.stroke();

    ctx.fillStyle = p.earInner;
    ctx.beginPath();
    ctx.moveTo(20, -14);
    ctx.quadraticCurveTo(22, -29, 18.5, -31);
    ctx.quadraticCurveTo(15, -31, 11, -20);
    ctx.closePath();
    ctx.fill();

    ctx.fillStyle = p.color;
    traceCatHeadPath();
    ctx.fill();

    ctx.save();
    traceCatHeadPath();
    ctx.clip();

    if (isTabby) {
      ctx.fillStyle = p.light;
      ctx.beginPath();
      ctx.ellipse(-6, -15, 13, 6, -0.25, 0, TAU);
      ctx.fill();
    } else {
      ctx.fillStyle = '#bae6fd';
      ctx.beginPath();
      ctx.ellipse(0, -17, 27, 13, 0, 0, TAU);
      ctx.fill();

      ctx.fillStyle = '#e0f2fe';
      ctx.beginPath();
      ctx.arc(-22, 6, 10, 0, TAU);
      ctx.arc(22, 6, 10, 0, TAU);
      ctx.fill();
    }

    ctx.fillStyle = p.stripe;
    ctx.beginPath();
    ctx.roundRect(-7, -26, 2.8, 9, 1.5);
    ctx.roundRect(-1.4, -26, 2.8, 11, 1.5);
    ctx.roundRect(4.2, -26, 2.8, 9, 1.5);
    ctx.fill();

    ctx.beginPath();
    ctx.roundRect(-30, -1, 8.5, 2.5, 1.2);
    ctx.roundRect(-30, 3.5, 7.5, 2.5, 1.2);
    ctx.roundRect(21.5, -1, 8.5, 2.5, 1.2);
    ctx.roundRect(22.5, 3.5, 7.5, 2.5, 1.2);
    ctx.fill();

    ctx.restore();

    ctx.lineWidth = 2.7;
    ctx.strokeStyle = '#0f172a';
    traceCatHeadPath();
    ctx.stroke();

    ctx.fillStyle = 'rgba(244, 63, 94, 0.36)';
    ctx.beginPath();
    ctx.ellipse(-15, 4, 4.8, 3.2, 0, 0, TAU);
    ctx.ellipse(15, 4, 4.8, 3.2, 0, 0, TAU);
    ctx.fill();

    if (p.hitTimer > 0) {
      ctx.strokeStyle = '#0f172a';
      ctx.lineWidth = 2.6;
      ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(-12, -4); ctx.lineTo(-8, -7.5); ctx.lineTo(-4, -4);
      ctx.moveTo(4, -4); ctx.lineTo(8, -7.5); ctx.lineTo(12, -4);
      ctx.stroke();
    } else {
      var eyeX1 = -8.5 + dir;
      var eyeX2 = 8.5 + dir;
      ctx.fillStyle = '#0f172a';
      ctx.beginPath();
      ctx.ellipse(eyeX1, -2.5, 3.8, 4.4, 0, 0, TAU);
      ctx.ellipse(eyeX2, -2.5, 3.8, 4.4, 0, 0, TAU);
      ctx.fill();

      ctx.fillStyle = '#ffffff';
      ctx.beginPath();
      ctx.arc(eyeX1 - 1.2, -4, 1.6, 0, TAU);
      ctx.arc(eyeX2 - 1.2, -4, 1.6, 0, TAU);
      ctx.fill();
      ctx.beginPath();
      ctx.arc(eyeX1 + 1.2, -1.2, 0.8, 0, TAU);
      ctx.arc(eyeX2 + 1.2, -1.2, 0.8, 0, TAU);
      ctx.fill();
    }

    var noseX = dir;
    ctx.fillStyle = '#fb7185';
    ctx.beginPath();
    ctx.ellipse(noseX, 2.5, 2.6, 1.9, 0, 0, TAU);
    ctx.fill();

    ctx.strokeStyle = '#0f172a';
    ctx.lineWidth = 1.7;
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.arc(noseX - 2.6, 5.2, 2.6, 0.15, 2.9);
    ctx.stroke();
    ctx.beginPath();
    ctx.arc(noseX + 2.6, 5.2, 2.6, 0.25, 3.0);
    ctx.stroke();

    ctx.restore();
  }

  function drawSuperman(x, y) {
    ctx.save();
    ctx.translate(x, y);
    var wave = Math.sin(mul(performance.now(), 0.015));

    ctx.fillStyle = '#ef4444';
    ctx.strokeStyle = '#7f1d1d';
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.moveTo(-6, -4);
    ctx.quadraticCurveTo(-28, -12 + mul(wave, 5), -44, -4 + mul(wave, 7));
    ctx.lineTo(-40, 8 + mul(wave, 5));
    ctx.quadraticCurveTo(-22, 4, -6, 3);
    ctx.closePath();
    ctx.fill();
    ctx.stroke();

    ctx.fillStyle = '#2563eb';
    ctx.strokeStyle = '#0f172a';
    ctx.beginPath();
    ctx.roundRect(-24, -4, 24, 9, 4);
    ctx.fill();
    ctx.stroke();

    ctx.fillStyle = '#dc2626';
    ctx.beginPath();
    ctx.roundRect(-27, -3.5, 6, 8, 2);
    ctx.fill();

    ctx.fillStyle = '#2563eb';
    ctx.beginPath();
    ctx.roundRect(4, -5, 16, 5.5, 2.5);
    ctx.fill();
    ctx.stroke();
    ctx.fillStyle = '#fde68a';
    ctx.beginPath();
    ctx.arc(21, -2.2, 3.2, 0, TAU);
    ctx.fill();

    ctx.fillStyle = '#f59e0b';
    ctx.beginPath();
    ctx.moveTo(0, -7); ctx.lineTo(3, -15); ctx.lineTo(7, -8);
    ctx.moveTo(6, -7); ctx.lineTo(10, -15); ctx.lineTo(13, -6);
    ctx.fill();

    ctx.beginPath();
    ctx.arc(7, -2, 8.5, 0, TAU);
    ctx.fill();
    ctx.stroke();

    ctx.fillStyle = '#0f172a';
    ctx.beginPath();
    ctx.arc(11, -3, 1.8, 0, TAU);
    ctx.fill();

    ctx.restore();
  }

  function drawBackground() {
    var pal = getSkyPalette();
    var sky = ctx.createLinearGradient(0, 0, 0, 380);
    sky.addColorStop(0, pal.top);
    sky.addColorStop(1, pal.bot);
    ctx.fillStyle = sky;
    ctx.fillRect(0, 0, 800, 450);

    var nightAlpha = 0;
    if (worldTime >= 0.46 && worldTime < 0.54) nightAlpha = (worldTime - 0.46) / 0.08;
    else if (worldTime >= 0.54 && worldTime <= 0.78) nightAlpha = 1;
    else if (worldTime > 0.78 && worldTime <= 0.86) nightAlpha = 1 - (worldTime - 0.78) / 0.08;

    if (nightAlpha > 0) {
      ctx.save();
      var now = performance.now();
      for (var i = 0; i < stars.length; i++) {
        var st = stars[i];
        var twinkle = 0.45 + mul(0.55, Math.abs(Math.sin(mul(now, 0.003) + st.phase)));
        ctx.fillStyle = "rgba(255, 255, 255, " + mul(nightAlpha, twinkle).toFixed(2) + ")";
        ctx.beginPath();
        ctx.arc(st.x, st.y, st.r, 0, TAU);
        ctx.fill();
      }

      ctx.globalAlpha = nightAlpha;
      ctx.fillStyle = '#fef08a';
      ctx.beginPath();
      ctx.arc(675, 78, 22, 0, TAU);
      ctx.fill();
      ctx.fillStyle = pal.top;
      ctx.beginPath();
      ctx.arc(684, 72, 19, 0, TAU);
      ctx.fill();
      ctx.restore();
    }

    if (shootingStar.active) {
      ctx.save();
      var grad = ctx.createLinearGradient(shootingStar.x, shootingStar.y, shootingStar.x + 55, shootingStar.y - 25);
      grad.addColorStop(0, 'rgba(255, 255, 255, 0.95)');
      grad.addColorStop(1, 'rgba(255, 255, 255, 0)');
      ctx.strokeStyle = grad;
      ctx.lineWidth = 2.5;
      ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(shootingStar.x, shootingStar.y);
      ctx.lineTo(shootingStar.x + 55, shootingStar.y - 25);
      ctx.stroke();

      ctx.fillStyle = '#ffffff';
      ctx.beginPath();
      ctx.arc(shootingStar.x, shootingStar.y, 2.5, 0, TAU);
      ctx.fill();
      ctx.restore();
    }

    if (worldTime <= 0.50) {
      var sunProg = worldTime / 0.50;
      var sunX = lerp(95, 705, sunProg);
      var sunY = 75 + mul(Math.pow(sunProg, 2.2), 295);
      var isSunset = worldTime > 0.34;
      ctx.save();
      ctx.fillStyle = isSunset ? 'rgba(251, 146, 60, 0.35)' : 'rgba(253, 224, 71, 0.28)';
      ctx.beginPath();
      ctx.arc(sunX, sunY, isSunset ? 42 : 34, 0, TAU);
      ctx.fill();

      ctx.fillStyle = isSunset ? '#fb7185' : '#fde047';
      ctx.beginPath();
      ctx.arc(sunX, sunY, isSunset ? 28 : 22, 0, TAU);
      ctx.fill();
      ctx.restore();
    }

    var cloudAlpha = nightAlpha > 0 ? lerp(0.7, 0.16, nightAlpha) : 0.72;
    ctx.fillStyle = worldTime > 0.35 && worldTime < 0.50
      ? "rgba(254, 215, 170, 0.68)"
      : "rgba(255, 255, 255, " + cloudAlpha.toFixed(2) + ")";
    for (var c = 0; c < clouds.length; c++) {
      var cl = clouds[c];
      ctx.save();
      ctx.translate(cl.x, cl.y);
      ctx.scale(cl.s, cl.s);
      ctx.beginPath();
      ctx.arc(-28, 4, 24, 0, TAU);
      ctx.arc(0, -6, 34, 0, TAU);
      ctx.arc(30, 6, 22, 0, TAU);
      ctx.fill();
      ctx.restore();
    }

    for (var b = 0; b < birds.length; b++) {
      var bd = birds[b];
      if (bd.x > -40 && bd.x < 840) {
        var wingY = mul(Math.sin(bd.phase), 5);
        ctx.strokeStyle = 'rgba(15, 23, 42, 0.72)';
        ctx.lineWidth = 2;
        ctx.lineCap = 'round';
        ctx.beginPath();
        ctx.moveTo(bd.x - 8, bd.y + wingY);
        ctx.quadraticCurveTo(bd.x - 4, bd.y - 4, bd.x, bd.y);
        ctx.quadraticCurveTo(bd.x + 4, bd.y - 4, bd.x + 8, bd.y + wingY);
        ctx.stroke();
      }
    }

    if (superman.active) {
      drawSuperman(superman.x, superman.y);
    }

    ctx.fillStyle = pal.sand;
    ctx.fillRect(0, 380, 800, 70);
    ctx.fillStyle = pal.line;
    ctx.fillRect(0, 380, 800, 6);
  }

  function draw() {
    drawBackground();

    ctx.fillStyle = 'rgba(255,255,255,0.85)'; ctx.font = '11px sans-serif'; ctx.textAlign = 'right';
    ctx.fillText("제작: 김기", 775, 30);

    ctx.fillStyle = '#fff'; ctx.fillRect(396, 260, 8, 120);
    ctx.fillStyle = 'rgba(15,23,42,0.85)'; ctx.strokeStyle = '#38bdf8'; ctx.lineWidth = 2;
    ctx.fillRect(320, 15, 160, 45); ctx.strokeRect(320, 15, 160, 45);

    ctx.fillStyle = '#fff'; ctx.font = 'bold 22px sans-serif'; ctx.textAlign = 'center';
    ctx.fillText(score1 + "   VS   " + score2, 400, 44);

    drawChar(p1); drawChar(p2);

    for (var i = 0; i < particles.length; i++) {
      var pt = particles[i]; ctx.fillStyle = pt.color;
      ctx.beginPath(); ctx.arc(pt.x, pt.y, pt.size, 0, TAU); ctx.fill();
    }

    ctx.fillStyle = ball.isFire ? '#ff5722' : '#facc15';
    ctx.beginPath(); ctx.arc(ball.x, ball.y, ball.r, 0, TAU); ctx.fill();
    ctx.strokeStyle = ball.isFire ? '#b71c1c' : '#ca8a04'; ctx.lineWidth = 3; ctx.stroke();

    if (gameOver) {
      ctx.fillStyle = 'rgba(0,0,0,0.85)'; ctx.fillRect(0, 0, 800, 450);
      ctx.fillStyle = '#fff'; ctx.font = 'bold 26px sans-serif';
      ctx.fillText(winnerText, 400, 225);
    }
  }

  function loop(now) {
    var dt = (now - lastTime) / 16.666;
    if (dt > 2.5) dt = 2.5;
    lastTime = now;

    update(dt);
    draw();
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
};
</script>
